const IMPACT_LEVEL_COLOR = {
    'High':'#c62828', 'Medium':'#e65100', 'Low-Medium':'#f9a825',
    'Low':'#2e7d32', 'Minimal':'#1565c0', 'Unknown':'#757575',
};

// Parse "HR 22", "S. 5", "H.R. 1234" etc into {type, number}
const parseFederalBill = (input) => {
    const cleaned = input.trim().replace(/\./g, '').replace(/\s+/g,' ');
    const m = cleaned.match(/^(HR|HB|SR|SB|S|HJRES|SJRES|HCONRES|SCONRES|H RES|S RES)\s*(\d+)$/i);
    if (!m) return null;
    const raw = m[1].toUpperCase().replace(/\s/g,'');
    const typeMap = {HR:'hr', HB:'hr', S:'s', SR:'s', SB:'s', HJRES:'hjres', SJRES:'sjres', HCONRES:'hconres', SCONRES:'sconres', HRES:'hres', SRES:'sres'};
    return {type: typeMap[raw] || raw.toLowerCase(), number: m[2]};
};

// Generate a structured local impact analysis from bill data (no AI required)
const generateLocalAnalysis = (bill, budgetAmt) => {
    const policyArea = bill.policyArea?.name || 'Unknown';
    const impact = POLICY_IMPACT_MAP[policyArea] || {level:'Unknown', areas:['All Departments'], keywords:['general compliance','administrative review']};
    const status = bill.latestAction?.text || 'Status unknown';
    const title = bill.title || '';
    const budgetStr = budgetAmt ? `$${(budgetAmt/1000000).toFixed(1)}M` : 'your municipal budget';

    const pctGuide = {High:'1–5%', 'Medium':'0.5–2%', 'Low-Medium':'0.2–1%', Low:'0–0.5%', Minimal:'<0.1%', Unknown:'indeterminate'};
    const pct = pctGuide[impact.level] || 'indeterminate';

    return `EXECUTIVE SUMMARY
${title || 'This legislation'} falls under the "${policyArea}" policy area and has a ${impact.level} municipal financial impact profile. Current status: ${status}.

ESTIMATED FINANCIAL IMPACT
Based on policy area classification, bills of this type historically affect ${pct} of a municipal budget of ${budgetStr}. Key cost drivers: ${impact.keywords.join('; ')}.

AFFECTED DEPARTMENTS
Primary: ${impact.areas.join(', ')}. Secondary impact possible across all departments depending on specific provisions.

IMPLEMENTATION TIMELINE
If enacted, municipalities typically have 6–18 months to comply. Budget planning should begin as soon as the bill advances out of committee.

COMPLIANCE REQUIREMENTS
Review the full bill text on Congress.gov for specific reporting, staffing, or technology requirements. Sign up for legislative alerts to track amendments.

RISK ASSESSMENT
Impact level: ${impact.level}. Bills in committee may not become law — assess probability of passage before allocating significant planning resources. Monitor closely if it advances to floor vote.

RECOMMENDED ACTIONS
1. Assign a staff member to review the full bill text and identify specific municipal obligations.
2. Contact your state municipal league for guidance and collective advocacy positions.
3. If impact is material (>0.5% of budget), begin preliminary budget scenario planning now.
4. Watch for any companion bills or amendments that may expand or narrow scope.

Note: This is a rules-based preliminary assessment. For AI-enhanced analysis, ensure the GovSight API service is accessible from this environment.`;
};

function LegislativeTab() {
    const [level, setLevel] = useState('federal');
    const [state, setState] = useState('');
    const [bill, setBill] = useState('');
    const [congress, setCongress] = useState(119);
    const [budget, setBudget] = useState(5000000);
    const [billData, setBillData] = useState(null);
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState('');

    const STATES = ['Alabama','Alaska','Arizona','Arkansas','California','Colorado','Connecticut','Delaware','Florida','Georgia','Hawaii','Idaho','Illinois','Indiana','Iowa','Kansas','Kentucky','Louisiana','Maine','Maryland','Massachusetts','Michigan','Minnesota','Mississippi','Missouri','Montana','Nebraska','Nevada','New Hampshire','New Jersey','New Mexico','New York','North Carolina','North Dakota','Ohio','Oklahoma','Oregon','Pennsylvania','Rhode Island','South Carolina','South Dakota','Tennessee','Texas','Utah','Vermont','Virginia','Washington','West Virginia','Wisconsin','Wyoming'];

    // Direct Congress.gov API call — works from the browser (CORS-enabled public API)
    const lookupFederal = async (parsed, congressNum) => {
        const base = 'https://api.congress.gov/v3';
        const billUrl = `${base}/bill/${congressNum}/${parsed.type}/${parsed.number}?format=json`;

        const billRes = await fetch(billUrl);
        if (billRes.status === 404) return {found: false, error: `${parsed.type.toUpperCase()} ${parsed.number} not found in the ${congressNum}th Congress. Verify the bill number and congress session.`};
        if (!billRes.ok) throw new Error(`Congress.gov returned HTTP ${billRes.status}`);

        const billJson = await billRes.json();
        const b = billJson.bill;

        // Try to fetch a summary (best effort, don't fail if absent)
        let summary = '';
        try {
            const sumRes = await fetch(`${base}/bill/${congressNum}/${parsed.type}/${parsed.number}/summaries?format=json`);
            if (sumRes.ok) {
                const sumJson = await sumRes.json();
                const summaries = (sumJson.summaries || []).sort((a,z) => new Date(z.updateDate) - new Date(a.updateDate));
                if (summaries.length) summary = summaries[0].text.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0, 2000);
            }
        } catch {}

        // Extract financial-relevant keywords from policy area and title
        const policyArea = b.policyArea?.name || '';
        const titleLower = (b.title||'').toLowerCase();
        const FINANCIAL_TERMS = ['tax','fund','appropriat','grant','budget','revenue','spending','fee','cost','financ','fiscal','debt','bond','allocat','subsid','penalty','fine','reimburs'];
        const financial_keywords = FINANCIAL_TERMS.filter(t => titleLower.includes(t) || policyArea.toLowerCase().includes(t));

        const data = {
            found: true,
            bill_type: parsed.type,
            bill_number: parsed.number,
            title: b.title,
            introduced_date: b.introducedDate,
            policy_area: policyArea,
            status: b.latestAction?.text || '',
            summary,
            financial_keywords,
            congress_url: `https://www.congress.gov/bill/${congressNum}th-congress/${parsed.type === 'hr' ? 'house-bill' : parsed.type === 's' ? 'senate-bill' : parsed.type}/${parsed.number}`,
            source: 'federal',
            _rawBill: b,
        };

        // Generate local analysis immediately (no API dependency)
        data.impact_analysis = generateLocalAnalysis(b, budget);

        // Attempt AI enrichment via PBB API — but with a short timeout so we
        // never block the UI if the API is unreachable in the deployment env
        try {
            const ctrl = new AbortController();
            const tid = setTimeout(() => ctrl.abort(), 5000);
            const aiRes = await fetch(`${API}/api/ai/bill-lookup`, {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({billNumber:`${parsed.type.toUpperCase()} ${parsed.number}`, level:'federal', congress:congressNum, annualBudget:budget}),
                signal: ctrl.signal,
            });
            clearTimeout(tid);
            if (aiRes.ok) {
                const aiJson = await aiRes.json();
                if (aiJson.success && aiJson.data?.impact_analysis) {
                    data.impact_analysis = aiJson.data.impact_analysis;
                    data.ai_enhanced = true;
                }
            }
        } catch {}

        return data;
    };

    const lookup = async () => {
        if (!bill.trim()) { setError('Please enter a bill number.'); return; }
        if (level === 'state' && !state) { setError('Please select a state.'); return; }
        setLoading(true); setError(''); setBillData(null);

        if (level === 'federal') {
            const parsed = parseFederalBill(bill);
            if (!parsed) {
                setError('Could not parse bill number. Use format: HR 22, S 5, H.R. 1234');
                setLoading(false);
                return;
            }
            try {
                const data = await lookupFederal(parsed, congress);
                setBillData(data);
                if (!data.found) setError(data.error || 'Bill not found');
            } catch (e) {
                setError(`Lookup failed: ${e.message}. Check your connection and try again.`);
            }
        } else {
            // State bills — show a direct link to the state legislature
            setBillData({
                found: false,
                isState: true,
                stateName: state,
                billRef: bill.trim(),
                legUrl: STATE_LEG_URLS[state] || 'https://legiscan.com',
            });
        }
        setLoading(false);
    };

    const impactLevel = billData?.found ? (POLICY_IMPACT_MAP[billData.policy_area]?.level || 'Unknown') : null;
    const impactColor = impactLevel ? (IMPACT_LEVEL_COLOR[impactLevel] || '#757575') : null;

    return (
        <div>
            <h2>Legislative Impact Analysis</h2>
            <p className="page-desc">Look up federal bills directly from Congress.gov and get a structured municipal financial impact assessment. State bill lookups link to the official state legislature website.</p>
            <div className="grid-2">
                <div className="card">
                    <div className="card-header">Bill Lookup</div>
                    <div className="card-body">
                        <div className="form-group"><label>Legislative Level</label>
                            <div style={{display:'flex',gap:8}}>
                                <button className={`btn ${level==='federal'?'btn-primary':'btn-secondary'}`} style={{flex:1}} onClick={()=>setLevel('federal')}>Federal</button>
                                <button className={`btn ${level==='state'?'btn-primary':'btn-secondary'}`} style={{flex:1}} onClick={()=>setLevel('state')}>State</button>
                            </div>
                        </div>
                        {level==='state'&&<div className="form-group"><label>Select State</label><select value={state} onChange={e=>setState(e.target.value)}><option value="">-- Select --</option>{STATES.map(s=><option key={s}>{s}</option>)}</select></div>}
                        <div className="form-group">
                            <label>{level==='federal'?'Federal Bill Number':'State Bill Number'}</label>
                            <input type="text" value={bill} onChange={e=>setBill(e.target.value)}
                                placeholder={level==='federal'?'e.g., HR 22, S 5, H.R. 1234':'e.g., HB 100, SB 200'}
                                onKeyDown={e=>e.key==='Enter'&&lookup()} />
                            {level==='federal'&&<div style={{fontSize:11,color:'#888',marginTop:4}}>Examples: HR 22, S 5, HJRES 7, SCONRES 2</div>}
                        </div>
                        {level==='federal'&&<div className="form-group"><label>Congress</label><select value={congress} onChange={e=>setCongress(+e.target.value)}><option value={119}>Current (119th, 2025–2026)</option><option value={118}>118th (2023–2024)</option><option value={117}>117th (2021–2022)</option></select></div>}
                        <div className="form-group"><label>Your Annual Budget (for impact sizing)</label><input type="number" value={budget} step={100000} onChange={e=>setBudget(+e.target.value||0)} /></div>
                        <button className="btn btn-primary" onClick={lookup} disabled={loading} style={{width:'100%'}}>
                            {loading?'Looking up bill...':'Look Up Bill & Analyze Impact'}{loading&&<span className="loading"></span>}
                        </button>
                        {error&&<div className="alert alert-warning" style={{marginTop:10}}>{error}</div>}
                        {level==='federal'&&<div className="alert alert-info" style={{marginTop:10,fontSize:12}}>
                            Federal bills are fetched directly from Congress.gov. No API key required.
                        </div>}
                    </div>
                </div>

                <div>
                    {/* ── Federal bill found ── */}
                    {billData?.found && (
                        <>
                            <div className="card" style={{marginBottom:14}}>
                                <div className="card-header" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                                    <span>{billData.bill_type?.toUpperCase()} {billData.bill_number}</span>
                                    {impactLevel && (
                                        <span style={{fontSize:11,padding:'2px 10px',borderRadius:12,background:impactColor,color:'white',fontWeight:700}}>
                                            {impactLevel} Impact
                                        </span>
                                    )}
                                </div>
                                <div className="card-body">
                                    <h3 style={{marginBottom:10,lineHeight:1.4}}>{billData.title}</h3>
                                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
                                        {billData.introduced_date&&<div style={{background:'#f8f9fa',padding:8,borderRadius:4,textAlign:'center'}}><div style={{fontSize:11,color:'#777'}}>Introduced</div><div style={{fontWeight:700,fontSize:13}}>{billData.introduced_date}</div></div>}
                                        {billData.policy_area&&<div style={{background:'#f8f9fa',padding:8,borderRadius:4,textAlign:'center'}}><div style={{fontSize:11,color:'#777'}}>Policy Area</div><div style={{fontWeight:700,fontSize:12}}>{billData.policy_area}</div></div>}
                                    </div>
                                    {billData.status&&<div style={{fontSize:12,color:'#555',marginBottom:10,fontStyle:'italic'}}>Latest action: {billData.status}</div>}
                                    {billData.financial_keywords?.length>0&&(
                                        <div style={{marginBottom:10}}>
                                            <div style={{fontSize:11,color:'#777',marginBottom:4}}>Financial Relevance Keywords</div>
                                            <div style={{display:'flex',flexWrap:'wrap',gap:5}}>{billData.financial_keywords.map((kw,i)=><span key={i} className="badge badge-blue">{kw}</span>)}</div>
                                        </div>
                                    )}
                                    {billData.congress_url&&<p style={{fontSize:13}}><a href={billData.congress_url} target="_blank" rel="noopener noreferrer">View full text on Congress.gov</a></p>}
                                    {billData.ai_enhanced&&<div style={{fontSize:11,color:'#2e7d32',marginTop:6}}>AI-enhanced analysis available</div>}
                                </div>
                            </div>
                            {billData.summary&&(
                                <div className="card" style={{marginBottom:14}}>
                                    <div className="card-header">Official Summary</div>
                                    <div className="card-body" style={{fontSize:13,lineHeight:1.65,maxHeight:200,overflowY:'auto'}}>{billData.summary}</div>
                                </div>
                            )}
                            {billData.impact_analysis&&(
                                <div className="card">
                                    <div className="card-header">Municipal Financial Impact Assessment {billData.ai_enhanced?'(AI-Enhanced)':'(Rules-Based)'}</div>
                                    <div className="card-body" style={{whiteSpace:'pre-wrap',lineHeight:1.7,fontSize:13}}>{billData.impact_analysis}</div>
                                </div>
                            )}
                        </>
                    )}

                    {/* ── State bill redirect ── */}
                    {billData?.isState && (
                        <div className="card">
                            <div className="card-header">State Bill — {billData.stateName}</div>
                            <div className="card-body">
                                <p style={{fontSize:14,marginBottom:12}}>
                                    State bill lookup ({billData.billRef}) requires accessing your state legislature's website directly.
                                    Click below to search the {billData.stateName} legislature database.
                                </p>
                                <a href={billData.legUrl} target="_blank" rel="noopener noreferrer" className="btn btn-primary" style={{display:'inline-block'}}>
                                    Search {billData.stateName} Legislature
                                </a>
                                <p style={{marginTop:14,fontSize:12,color:'#777'}}>
                                    After finding the bill, return here and use the What-If Simulator to model its financial impact on your budget.
                                </p>
                            </div>
                        </div>
                    )}
                </div>
            </div>
        </div>
    );
}

// ════════════════════════════════════════════════════════════════════════════
// TAB 7 — MONTE CARLO
// ════════════════════════════════════════════════════════════════════════════
function MonteCarloTab() {
    // API requires costMin/costLikely/costMax (triangular distribution for costs),
    // NOT a costVolatility scalar — both sides use triangular distributions.
    const [params, setParams] = useState({
        revenueMin:900000, revenueLikely:1000000, revenueMax:1100000,
        costMin:850000,    costLikely:950000,     costMax:1050000,
        iterations:1000,
    });
    const [results, setResults] = useState(null);
    const [loading, setLoading] = useState(false);
    const [error, setError]     = useState('');
    const chartRef = useRef(null); const chartInst = useRef(null);

    const run = async () => {
        setLoading(true); setError('');
        try {
            const r = await api.runMonteCarlo(params);
            setResults(r);
            if (r.distribution) drawChart(r.distribution);
        } catch (e) {
            setError('Simulation failed — check that all fields are filled in correctly.');
        } finally { setLoading(false); }
    };

    const drawChart = (d) => {
        if (!chartRef.current) return;
        const ctx = chartRef.current.getContext('2d');
        if (chartInst.current) chartInst.current.destroy();
        chartInst.current = new Chart(ctx,{type:'bar',data:{labels:d.bins,datasets:[{label:'Net Budget Outcome Frequency',data:d.frequencies,backgroundColor:'#1976d2',borderColor:'#0d47a1',borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:'Simulated Budget Outcome Distribution'},legend:{display:false}},scales:{x:{ticks:{callback:function(v){return fc(this.getLabelForValue(v));},maxTicksLimit:8}},y:{beginAtZero:true,title:{display:true,text:'Frequency'}}}}});
    };

    const upd = (f,v) => setParams(p=>({...p,[f]:parseFloat(v)||0}));

    return (
        <div>
            <h2>Monte Carlo Risk Simulation</h2>
            <p className="page-desc">Model uncertainty in both revenue and costs using triangular distributions. Run thousands of simulations to see the full range of possible budget outcomes and their probabilities.</p>
            <div className="grid-2">
                <div className="card">
                    <div className="card-header">Simulation Parameters</div>
                    <div className="card-body">
                        <h3>Revenue Range (Triangular Distribution)</h3>
                        <div style={{fontSize:12,color:'#777',marginBottom:10}}>Enter the pessimistic, most likely, and optimistic revenue amounts.</div>
                        <div className="form-group"><label>Minimum Revenue</label><input type="number" value={params.revenueMin} onChange={e=>upd('revenueMin',e.target.value)} /></div>
                        <div className="form-group"><label>Most Likely Revenue</label><input type="number" value={params.revenueLikely} onChange={e=>upd('revenueLikely',e.target.value)} /></div>
                        <div className="form-group"><label>Maximum Revenue</label><input type="number" value={params.revenueMax} onChange={e=>upd('revenueMax',e.target.value)} /></div>
                        <h3 style={{marginTop:16}}>Cost Range (Triangular Distribution)</h3>
                        <div style={{fontSize:12,color:'#777',marginBottom:10}}>Enter the best-case, expected, and worst-case total operating costs.</div>
                        <div className="form-group"><label>Minimum Cost (best case)</label><input type="number" value={params.costMin} onChange={e=>upd('costMin',e.target.value)} /></div>
                        <div className="form-group"><label>Most Likely Cost</label><input type="number" value={params.costLikely} onChange={e=>upd('costLikely',e.target.value)} /></div>
                        <div className="form-group"><label>Maximum Cost (worst case)</label><input type="number" value={params.costMax} onChange={e=>upd('costMax',e.target.value)} /></div>
                        <div className="form-group"><label>Iterations</label><input type="number" value={params.iterations} step={100} min={100} max={10000} onChange={e=>upd('iterations',e.target.value)} /></div>
                        <button className="btn btn-primary" onClick={run} disabled={loading} style={{width:'100%'}}>
                            {loading?'Running simulation...':'Run Simulation'}{loading&&<span className="loading"></span>}
                        </button>
                        {error&&<div className="alert alert-warning" style={{marginTop:10}}>{error}</div>}
                    </div>
                </div>
                {results&&(
                    <div>
                        <div className="grid-2" style={{marginBottom:14}}>
                            <div className="stat-card"><div className="stat-value">{fc(results.mean||0)}</div><div className="stat-label">Mean Outcome</div></div>
                            <div className="stat-card"><div className="stat-value">{fc(results.standardDeviation||0)}</div><div className="stat-label">Std. Deviation</div></div>
                        </div>
                        <div className="card">
                            <div className="card-header">Percentile Analysis</div>
                            <table>
                                <tbody>
                                    {[['5% (Worst Case)','p5'],['25%','p25'],['50% (Median)','p50'],['75%','p75'],['95% (Best Case)','p95']].map(([lbl,k])=>(
                                        <tr key={k}><td style={{padding:'8px 12px'}}>{lbl}</td><td style={{padding:'8px 12px',textAlign:'right',fontWeight:600}}>{fc(results.percentiles?.[k]||0)}</td></tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                )}
            </div>
            <div className="chart-box" style={{marginTop:20}}><canvas ref={chartRef}></canvas></div>
        </div>
    );
}

// ════════════════════════════════════════════════════════════════════════════
// APP ROOT
// ════════════════════════════════════════════════════════════════════════════
// Build a stable localStorage key from a scenario name.
// Converts e.g. "Bridge Repair 2026" → "gs_notes_bridge_repair_2026".
// Falls back to "gs_notes_default" when no scenario is named yet.
const notesKey = (name) => {
    const slug = (name || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
    return `gs_notes_${slug || 'default'}`;
};

const SAVED_KEY = 'gs_saved_scenarios';

function App() {
    const [tab, setTab] = useState('scenario');
    const [scenario, setScenario] = useState({name:'',description:'',years:5});
    const [fundingSources, setFundingSources] = useState([{id:'1',type:'tax',description:'Property Tax Revenue',amount:1000000}]);
    const [expenses, setExpenses] = useState([]);
    const [savedScenarios, setSavedScenarios] = useState(() => lsGet(SAVED_KEY, []));
    const [saveMsg, setSaveMsg] = useState('');
    // adjExpenseTotal and adjContingencyPct are updated whenever the user visits
    // the Expenses & Analytics tab and the ExpensePlanner fires onGapChange.
    // They represent the full cost including contingency and inflation adjustments —
    // the authoritative number the main Scenario page should show.
    const [adjExpenseTotal,   setAdjExpenseTotal]   = useState(0);
    const [adjContingencyPct, setAdjContingencyPct] = useState(10);

    // Save the entire current scenario to localStorage.
    // No API call — avoids the network entirely and is always reliable.
    const saveCurrentScenario = () => {
        const name = scenario.name.trim() || 'Untitled';
        const entry = {
            id: genId(),
            name,
            savedAt: new Date().toISOString(),
            scenario: {...scenario, name},
            fundingSources,
            expenses,
        };
        const existing = lsGet(SAVED_KEY, []);
        // Overwrite if same name already exists, otherwise append
        const idx = existing.findIndex(s => s.name === name);
        const updated = idx >= 0 ? existing.map((s,i) => i===idx ? entry : s) : [...existing, entry];
        lsSet(SAVED_KEY, updated);
        setSavedScenarios(updated);
        setSaveMsg(`Saved "${name}"`);
        setTimeout(() => setSaveMsg(''), 3000);
    };

    // Reset everything to a blank working state.
    const newScenario = () => {
        setScenario({name:'', description:'', years:5});
        setFundingSources([{id:genId(), type:'tax', description:'Property Tax Revenue', amount:1000000}]);
        setExpenses([]);
    };

    // Restore a saved snapshot into the live working state.
    const loadScenario = (entry) => {
        setScenario(entry.scenario || {name:'',description:'',years:5});
        setFundingSources(entry.fundingSources || []);
        setExpenses(entry.expenses || []);
    };

    const deleteScenario = (id) => {
        const updated = lsGet(SAVED_KEY, []).filter(s => s.id !== id);
        lsSet(SAVED_KEY, updated);
        setSavedScenarios(updated);
    };
    // fundingGap and gapDetails are derived — NOT state — so they update instantly
    // whenever fundingSources or expenses change, without requiring the user to visit
    // the Expenses tab first. This fixes auto-match grants showing even when revenue = 0.
    const totalRevenue = fundingSources.reduce((s,f) => s+(f.amount||0), 0);
    const numYrs = parseInt(scenario.years)||5;
    const fundPerYr = totalRevenue / Math.max(numYrs, 1);
    const yrExpMap = {};
    expenses.forEach(e => { const yr = parseInt(e.year)||1; yrExpMap[yr] = (yrExpMap[yr]||0)+(parseFloat(e.amount)||0); });
    const gapDetails = Array.from({length:numYrs},(_,i)=>i+1)
        .filter(yr => (yrExpMap[yr]||0) > fundPerYr)
        .map(yr => ({year:yr, shortfall:(yrExpMap[yr]||0)-fundPerYr}));
    const fundingGap = gapDetails.length > 0 || expenses.reduce((s,e)=>s+(parseFloat(e.amount)||0),0) > totalRevenue;
    // Notes are namespaced by scenario name so each project has its own thread.
    // currentNotesKey tracks which localStorage key is active right now.
    const [currentNotesKey, setCurrentNotesKey] = useState(() => notesKey(''));
    const [annotations, setAnnotations] = useState(() => lsGet(notesKey(''), []));
    const [isSharedView, setIsSharedView] = useState(false);

    // Persist annotations whenever they change.
    useEffect(() => { lsSet(currentNotesKey, annotations); }, [annotations, currentNotesKey]);

    // When the scenario name changes, save current notes and switch to the new namespace.
    useEffect(() => {
        const newKey = notesKey(scenario.name);
        if (newKey === currentNotesKey) return;
        lsSet(currentNotesKey, annotations);   // flush current notes first
        setAnnotations(lsGet(newKey, []));      // load notes for the new scenario
        setCurrentNotesKey(newKey);
    }, [scenario.name]);

    useEffect(() => {
        const hash = window.location.hash;
        if (hash.startsWith('#share=')) {
            try {
                const payload = JSON.parse(decodeURIComponent(escape(atob(hash.slice(7)))));
                if (payload.fundingSources) setFundingSources(payload.fundingSources);
                if (payload.expenses) setExpenses(payload.expenses);
                if (payload.name) setScenario(s=>({...s,name:payload.name,description:payload.description||''}));
                setIsSharedView(true);
            } catch {}
        }
    }, []);

    const TABS = [
        {key:'scenario',label:'Scenario'},
        {key:'revenue',label:'Revenue'},
        {key:'expenses',label:'Expenses & Analytics'},
        {key:'comparison',label:'Scenario Comparison'},
        {key:'whatif',label:'What-If Simulator'},
        {key:'legislative',label:'Legislative Impact'},
        {key:'montecarlo',label:'Monte Carlo'},
    ];

    return (
        <div className="app-shell">
            {isSharedView && (
                <div className="shared-banner">
                    Viewing a shared scenario — changes are local only.
                </div>
            )}
            <div className="top-bar">
                <h1>GovSight Scenario Planner</h1>
                <div className="top-meta">
                    {scenario.name ? scenario.name : 'No project loaded'} &bull; {scenario.years}-year horizon &bull; {fc(fundingSources.reduce((s,f)=>s+(f.amount||0),0))} total funding
                </div>
            </div>
            <div className="main-nav">
                {TABS.map(t => <button key={t.key} className={tab===t.key?'active':''} onClick={()=>setTab(t.key)}>{t.label}</button>)}
            </div>
            <div className="body-area">
                <div className="content-area">
                    {tab==='scenario'    && <ScenarioTab scenario={scenario} setScenario={setScenario} fundingSources={fundingSources} setFundingSources={setFundingSources} expenses={expenses} setExpenses={setExpenses} onSave={saveCurrentScenario} onLoad={loadScenario} onDelete={deleteScenario} onNew={newScenario} savedScenarios={savedScenarios} saveMsg={saveMsg} adjExpenseTotal={adjExpenseTotal} adjContingencyPct={adjContingencyPct} />}
                    {tab==='revenue'     && <RevenueTab fundingGap={fundingGap} gapDetails={gapDetails} expenses={expenses} fundingSources={fundingSources} setFundingSources={setFundingSources} />}
                    {tab==='expenses'    && <ExpensesTab expenses={expenses} setExpenses={setExpenses} fundingSources={fundingSources} onGapChange={(hasGap, gapDetails, adjTotal, contingencyPct) => { if (adjTotal != null) setAdjExpenseTotal(adjTotal); if (contingencyPct != null) setAdjContingencyPct(contingencyPct); }} annotations={annotations} setAnnotations={setAnnotations} projectYears={scenario.years} />}
                    {tab==='comparison'  && <ComparisonTab fundingSources={fundingSources} expenses={expenses} scenario={scenario} savedScenarios={savedScenarios} />}
                    {tab==='whatif'      && <WhatIfTab fundingSources={fundingSources} expenses={expenses} scenario={scenario} />}
                    {tab==='legislative' && <LegislativeTab />}
                    {tab==='montecarlo'  && <MonteCarloTab />}
                </div>
                <CollabSidebar annotations={annotations} setAnnotations={setAnnotations} currentTab={tab} scenarioName={scenario.name} />
            </div>
        </div>
    );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
