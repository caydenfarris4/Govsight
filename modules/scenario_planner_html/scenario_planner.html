function ExpensesTab({ expenses, setExpenses, fundingSources, onGapChange, annotations, setAnnotations, projectYears }) {
    const [sub, setSub] = useState('planner');
    return (
        <div>
            <h2>Expenses &amp; Analytics</h2>
            <p className="page-desc">Plan projected expenses with inflation and contingency, then visualize cash flow, funding diversity, and return on investment.</p>
            <div className="sub-nav">
                <button className={sub==='planner'?'active':''} onClick={()=>setSub('planner')}>Expense Planner</button>
                <button className={sub==='analytics'?'active':''} onClick={()=>setSub('analytics')}>Analytics</button>
            </div>
            {sub==='planner' && <ExpensePlanner expenses={expenses} setExpenses={setExpenses} fundingSources={fundingSources} onGapChange={onGapChange} annotations={annotations} setAnnotations={setAnnotations} projectYears={projectYears} />}
            {sub==='analytics' && <Analytics expenses={expenses} fundingSources={fundingSources} projectYears={projectYears} />}
        </div>
    );
}

function ExpensePlanner({ expenses, setExpenses, fundingSources, onGapChange, annotations, setAnnotations, projectYears }) {
    const [inflation, setInflation] = useState({Infrastructure:4,Staffing:3,Maintenance:2.5,Technology:1.5,Other:3});
    const [contingency, setContingency] = useState(10);
    const [applyInfl, setApplyInfl] = useState(false);
    const [openRow, setOpenRow] = useState(null);
    const [cmtText, setCmtText] = useState('');
    // Use the server-injected user identity for inline expense notes
    const gsUser = (typeof window !== 'undefined' && window.GOVSIGHT_USER) || {};
    const cmtAuthor = gsUser.name || 'Anonymous';

    // Duplicate-with-adjustment state. Holds the source expense id, the % change per year,
    // and which target years the user wants to copy to (defaults: all other years).
    const [dupState, setDupState] = useState(null);

    const numYrs = parseInt(projectYears)||5;
    const years = Array.from({length:numYrs},(_,i)=>i+1);
    const totalFunding = fundingSources.reduce((s,f)=>s+(f.amount||0),0);
    const fundPerYr = totalFunding/Math.max(numYrs,1);

    const inflated = (exp) => {
        if (!applyInfl||exp.year<=1) return exp.amount||0;
        return (exp.amount||0)*Math.pow(1+(inflation[exp.category]||3)/100, exp.year-1);
    };

    const addExp = () => setExpenses(p=>[...p,{id:genId(),year:1,label:'',amount:0,category:'Infrastructure'}]);
    const updExp = (id,f,v) => setExpenses(p=>p.map(e=>e.id===id?{...e,[f]:f==='amount'||f==='year'?(parseFloat(v)||0):v}:e));
    const delExp = (id) => setExpenses(p=>p.filter(e=>e.id!==id));

    // Open the duplicate panel for an expense row.
    // Defaults to 3% annual increase applied to all other years in the project.
    const openDup = (exp) => {
        const sourceYear = parseInt(exp.year)||1;
        const otherYears = years.filter(y => y !== sourceYear);
        setDupState({id: exp.id, sourceYear, pct: 3, targetYears: otherYears});
        setOpenRow(null); // close notes if open
    };

    // Apply the duplication: for each selected target year, create a new expense row
    // with the amount compounded from the source year using the chosen % per year.
    const applyDup = () => {
        const source = expenses.find(e => e.id === dupState.id);
        if (!source) { setDupState(null); return; }
        const newRows = dupState.targetYears.map(yr => ({
            ...source,
            id: genId(),
            year: yr,
            amount: Math.round((parseFloat(source.amount)||0) * Math.pow(1 + dupState.pct/100, yr - dupState.sourceYear)),
        }));
        setExpenses(prev => [...prev, ...newRows].sort((a,b) => (parseInt(a.year)||0)-(parseInt(b.year)||0)));
        setDupState(null);
    };

    const toggleDupYear = (yr) => {
        setDupState(ds => ({...ds, targetYears: ds.targetYears.includes(yr) ? ds.targetYears.filter(y=>y!==yr) : [...ds.targetYears, yr].sort((a,b)=>a-b)}));
    };

    const yearData = years.map(yr => {
        const exps = expenses.filter(e=>parseInt(e.year)===yr);
        const raw = exps.reduce((s,e)=>s+inflated(e),0);
        const cont = raw*(contingency/100);
        const total = raw+cont;
        const gap = fundPerYr-total;
        return {yr,raw,cont,total,gap};
    });
    const totalGap = yearData.reduce((s,d)=>s+d.gap,0);

    useEffect(()=>{
        const gapDetails = yearData.filter(d=>d.gap<0).map(d=>({year:d.yr,shortfall:Math.abs(d.gap)}));
        const adjTotal = yearData.reduce((s,d)=>s+d.total,0);
        onGapChange(totalGap<0, gapDetails, adjTotal, contingency);
    },[expenses,fundingSources,contingency,applyInfl,inflation]);

    const addNote = (rowId) => {
        if (!cmtText.trim()) return;
        setAnnotations(p=>[...p,{id:genId(),target:`exp:${rowId}`,authorName:cmtAuthor||'Anonymous',text:cmtText,timestamp:new Date().toISOString()}]);
        setCmtText(''); setOpenRow(null);
    };

    const rowNotes = (id) => annotations.filter(a=>a.target===`exp:${id}`);

    return (
        <div>
            <div className="card" style={{marginBottom:16}}>
                <div className="card-header">
                    Inflation &amp; Contingency
                    <label style={{display:'flex',alignItems:'center',gap:6,fontWeight:400,fontSize:13,cursor:'pointer'}}>
                        <input type="checkbox" checked={applyInfl} onChange={e=>setApplyInfl(e.target.checked)} /> Apply compound inflation to future years
                    </label>
                </div>
                <div className="card-body">
                    {applyInfl && (
                        <div className="grid-3" style={{marginBottom:14}}>
                            {CATS.map(cat=>(
                                <div key={cat} className="form-group" style={{marginBottom:0}}>
                                    <label>{cat} Inflation (%)</label>
                                    <input type="number" min={0} max={20} step={0.5} value={inflation[cat]} onChange={e=>setInflation(r=>({...r,[cat]:parseFloat(e.target.value)||0}))} />
                                </div>
                            ))}
                        </div>
                    )}
                    <div className="form-group" style={{marginBottom:0}}>
                        <label>Contingency Buffer: <strong>{contingency}%</strong></label>
                        <div className="slider-row">
                            <input type="range" min={0} max={30} value={contingency} onChange={e=>setContingency(+e.target.value)} />
                            <span className="slider-val">{contingency}%</span>
                        </div>
                    </div>
                </div>
            </div>

            <div className="card" style={{marginBottom:16}}>
                <div className="card-header">
                    Expense Line Items
                    <button className="btn btn-primary btn-sm" onClick={addExp}>Add Expense</button>
                </div>
                {expenses.length===0
                    ? <div style={{padding:16}}><div className="alert alert-info" style={{marginBottom:0}}>No expenses added. Click "Add Expense" to build your timeline.</div></div>
                    : <div style={{overflowX:'auto'}}>
                        <table>
                            <thead>
                                <tr>
                                    <th style={{width:70}}>Year</th>
                                    <th>Label</th>
                                    <th>Category</th>
                                    <th style={{textAlign:'right'}}>Amount</th>
                                    {applyInfl&&<th style={{textAlign:'right'}}>Adj. Amount</th>}
                                    <th style={{width:80}}>Notes</th>
                                    <th style={{width:110}}></th>
                                </tr>
                            </thead>
                            <tbody>
                                {expenses.map(exp=>(
                                    <React.Fragment key={exp.id}>
                                        <tr style={{background: dupState&&dupState.id===exp.id ? '#fff8e1' : undefined}}>
                                            <td><input type="number" min={1} max={numYrs} value={exp.year} onChange={e=>updExp(exp.id,'year',e.target.value)} style={{width:55,padding:'3px 6px',border:'1px solid #ddd',borderRadius:4}} /></td>
                                            <td><input type="text" value={exp.label} placeholder="Description" onChange={e=>updExp(exp.id,'label',e.target.value)} style={{width:'100%',padding:'3px 8px',border:'1px solid #ddd',borderRadius:4}} /></td>
                                            <td>
                                                <select value={exp.category} onChange={e=>updExp(exp.id,'category',e.target.value)} style={{padding:'3px 6px',border:'1px solid #ddd',borderRadius:4}}>
                                                    {CATS.map(c=><option key={c}>{c}</option>)}
                                                </select>
                                            </td>
                                            <td style={{textAlign:'right'}}><input type="number" min={0} value={exp.amount} onChange={e=>updExp(exp.id,'amount',e.target.value)} style={{width:110,padding:'3px 8px',border:'1px solid #ddd',borderRadius:4,textAlign:'right'}} /></td>
                                            {applyInfl&&<td style={{textAlign:'right',color:'#1565c0',fontWeight:500}}>{fc(inflated(exp))}</td>}
                                            <td>
                                                <span className="comment-link" onClick={()=>{setOpenRow(openRow===exp.id?null:exp.id);setDupState(null);}}>
                                                    [{rowNotes(exp.id).length}] notes
                                                </span>
                                            </td>
                                            <td style={{whiteSpace:'nowrap'}}>
                                                <button className={`btn btn-sm ${dupState&&dupState.id===exp.id?'btn-secondary':'btn-primary'}`} style={{marginRight:4}} title="Copy to other years with % adjustment" onClick={()=>dupState&&dupState.id===exp.id?setDupState(null):openDup(exp)}>
                                                    {dupState&&dupState.id===exp.id?'Cancel':'Copy'}
                                                </button>
                                                <button className="btn btn-danger btn-sm" onClick={()=>delExp(exp.id)}>Del</button>
                                            </td>
                                        </tr>

                                        {/* Inline duplicate panel — year selector + % adjustment */}
                                        {dupState&&dupState.id===exp.id&&(
                                            <tr>
                                                <td colSpan={applyInfl?7:6} style={{padding:0}}>
                                                    <div style={{padding:'12px 16px',background:'#fffde7',borderBottom:'2px solid #ffe57f'}}>
                                                        <div style={{fontWeight:600,fontSize:13,marginBottom:10,color:'#555'}}>
                                                            Copy "{exp.label||'this expense'}" ({fc(exp.amount)}) to other years
                                                        </div>
                                                        <div style={{display:'flex',flexWrap:'wrap',gap:16,alignItems:'flex-start'}}>
                                                            <div>
                                                                <div style={{fontSize:12,fontWeight:600,marginBottom:6,color:'#555'}}>Annual adjustment %</div>
                                                                <div style={{display:'flex',alignItems:'center',gap:8}}>
                                                                    <input type="number" step={0.1} value={dupState.pct}
                                                                        onChange={e=>setDupState(ds=>({...ds,pct:parseFloat(e.target.value)||0}))}
                                                                        style={{width:80,padding:'5px 8px',border:'1px solid #ddd',borderRadius:4,fontSize:13,textAlign:'center'}} />
                                                                    <span style={{fontSize:12,color:'#888'}}>% per year<br/>(0 = exact copy, 3 = +3%/yr)</span>
                                                                </div>
                                                            </div>
                                                            <div style={{flex:1}}>
                                                                <div style={{fontSize:12,fontWeight:600,marginBottom:6,color:'#555'}}>
                                                                    Copy to years
                                                                    <button style={{marginLeft:8,fontSize:11,padding:'2px 7px',border:'1px solid #bbb',borderRadius:3,cursor:'pointer',background:'#fff'}} onClick={()=>setDupState(ds=>({...ds,targetYears:years.filter(y=>y!==ds.sourceYear)}))}>All</button>
                                                                    <button style={{marginLeft:4,fontSize:11,padding:'2px 7px',border:'1px solid #bbb',borderRadius:3,cursor:'pointer',background:'#fff'}} onClick={()=>setDupState(ds=>({...ds,targetYears:[]}))}>None</button>
                                                                </div>
                                                                <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                                                                    {years.filter(y=>y!==dupState.sourceYear).map(yr=>{
                                                                        const checked = dupState.targetYears.includes(yr);
                                                                        const previewAmt = Math.round((parseFloat(exp.amount)||0)*Math.pow(1+dupState.pct/100,yr-dupState.sourceYear));
                                                                        return (
                                                                            <label key={yr} style={{display:'flex',alignItems:'center',gap:4,padding:'4px 8px',border:`1px solid ${checked?'#1976d2':'#ddd'}`,borderRadius:4,cursor:'pointer',background:checked?'#e3f2fd':'#fafafa',fontSize:12}}>
                                                                                <input type="checkbox" checked={checked} onChange={()=>toggleDupYear(yr)} style={{margin:0}} />
                                                                                <span>Yr {yr}</span>
                                                                                {dupState.pct!==0&&<span style={{color:'#1565c0',fontWeight:600,fontSize:11}}>{fc(previewAmt)}</span>}
                                                                            </label>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div style={{marginTop:12,display:'flex',gap:8}}>
                                                            <button className="btn btn-primary" disabled={dupState.targetYears.length===0} onClick={applyDup}>
                                                                Copy to {dupState.targetYears.length} year{dupState.targetYears.length!==1?'s':''}
                                                            </button>
                                                            <button className="btn btn-secondary" onClick={()=>setDupState(null)}>Cancel</button>
                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                        )}

                                        {openRow===exp.id&&(
                                            <tr>
                                                <td colSpan={applyInfl?7:6} style={{padding:0}}>
                                                    <div className="inline-note">
                                                        {rowNotes(exp.id).map(n=>(
                                                            <div key={n.id} style={{marginBottom:6}}>
                                                                <div style={{fontSize:11,color:'#888'}}><strong>{n.authorName}</strong> &bull; {timeAgo(n.timestamp)}</div>
                                                                <div style={{fontSize:13}}>{n.text}</div>
                                                            </div>
                                                        ))}
                                                        <div style={{display:'flex',gap:6,marginTop:6,alignItems:'center'}}>
                                                            <span style={{fontSize:12,color:'#555',fontWeight:600,flexShrink:0}}>{cmtAuthor}</span>
                                                            <input type="text" placeholder="Add note..." value={cmtText} onChange={e=>setCmtText(e.target.value)} style={{flex:1,padding:'4px 7px',border:'1px solid #ddd',borderRadius:4,fontSize:12}} />
                                                            <button className="btn btn-primary btn-sm" onClick={()=>addNote(exp.id)}>Add</button>
                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                        )}
                                    </React.Fragment>
                                ))}
                            </tbody>
                        </table>
                    </div>
                }
            </div>

            {expenses.length>0&&(
                <div className="card">
                    <div className="card-header">Funding Gap Analysis — Year by Year</div>
                    <div style={{overflowX:'auto'}}>
                        <table>
                            <thead>
                                <tr>
                                    <th>Year</th>
                                    <th style={{textAlign:'right'}}>Expenses</th>
                                    <th style={{textAlign:'right'}}>Contingency ({contingency}%)</th>
                                    <th style={{textAlign:'right'}}>Total Cost</th>
                                    <th style={{textAlign:'right'}}>Funding</th>
                                    <th style={{textAlign:'right'}}>Gap / Surplus</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                {yearData.map(d=>(
                                    <tr key={d.yr} className={d.gap>=0?'row-surplus':'row-gap'}>
                                        <td><strong>Year {d.yr}</strong></td>
                                        <td style={{textAlign:'right'}}>{fc(d.raw)}</td>
                                        <td style={{textAlign:'right',color:'#e65100'}}>{fc(d.cont)}</td>
                                        <td style={{textAlign:'right',fontWeight:600}}>{fc(d.total)}</td>
                                        <td style={{textAlign:'right'}}>{fc(fundPerYr)}</td>
                                        <td style={{textAlign:'right',fontWeight:700,color:d.gap>=0?'#2e7d32':'#c62828'}}>{d.gap>=0?'+':''}{fc(d.gap)}</td>
                                        <td>{d.gap>=0?<span className="badge badge-green">Funded</span>:<span className="badge badge-red">Gap</span>}</td>
                                    </tr>
                                ))}
                                <tr style={{fontWeight:700,background:'#f5f5f5'}}>
                                    <td>Total</td>
                                    <td style={{textAlign:'right'}}>{fc(yearData.reduce((s,d)=>s+d.raw,0))}</td>
                                    <td style={{textAlign:'right',color:'#e65100'}}>{fc(yearData.reduce((s,d)=>s+d.cont,0))}</td>
                                    <td style={{textAlign:'right'}}>{fc(yearData.reduce((s,d)=>s+d.total,0))}</td>
                                    <td style={{textAlign:'right'}}>{fc(totalFunding)}</td>
                                    <td style={{textAlign:'right',color:totalGap>=0?'#2e7d32':'#c62828'}}>{totalGap>=0?'+':''}{fc(totalGap)}</td>
                                    <td>{totalGap>=0?<span className="badge badge-green">Fully Funded</span>:<span className="badge badge-red">Gap</span>}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    {totalGap<0&&<div style={{padding:'10px 16px'}}><div className="alert alert-warning" style={{marginBottom:0}}>Total shortfall of {fc(Math.abs(totalGap))}. Visit the <strong>Revenue</strong> tab to find grants and reallocation opportunities.</div></div>}
                </div>
            )}
        </div>
    );
}

function Analytics({ expenses, fundingSources, projectYears }) {
    const cashRef = useRef(null); const cashChart = useRef(null);
    const divRef = useRef(null); const divChart = useRef(null);
    const [roi, setRoi] = useState({cost:5000000,benefit:750000,duration:10,rate:5});
    const [roiRes, setRoiRes] = useState(null);

    const numYrs = parseInt(projectYears)||5;
    const years = Array.from({length:numYrs},(_,i)=>i+1);
    const totalFunding = fundingSources.reduce((s,f)=>s+(f.amount||0),0);
    const fpY = totalFunding/Math.max(numYrs,1);

    useEffect(()=>{
        if (!cashRef.current) return;
        if (cashChart.current) cashChart.current.destroy();
        const ctx = cashRef.current.getContext('2d');
        const datasets = CATS.map(cat=>({
            label:cat, stack:'e',
            data:years.map(yr=>expenses.filter(e=>parseInt(e.year)===yr&&e.category===cat).reduce((s,e)=>s+(e.amount||0),0)),
            backgroundColor:CAT_COLORS[cat]
        }));
        let cum=0;
        datasets.push({label:'Cumulative Funding',type:'line',borderColor:'#000',borderWidth:2,borderDash:[5,3],pointRadius:4,fill:false,data:years.map(()=>{cum+=fpY;return cum;})});
        cashChart.current = new Chart(ctx,{
            type:'bar',
            data:{labels:years.map(y=>`Year ${y}`),datasets},
            options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},title:{display:true,text:'Year-by-Year Cash Flow'}},scales:{y:{stacked:true,ticks:{callback:v=>fc(v)},beginAtZero:true},x:{stacked:true}}}
        });
    },[expenses,fundingSources,projectYears]);

    const typeGroups = fundingSources.reduce((acc,f)=>{const l=f.type.charAt(0).toUpperCase()+f.type.slice(1);acc[l]=(acc[l]||0)+(f.amount||0);return acc;},{});
    const totalFund = fundingSources.reduce((s,f)=>s+(f.amount||0),0);
    const maxShare = totalFund>0 ? Math.max(...Object.values(typeGroups))/totalFund*100 : 0;
    const score = Math.max(0,Math.round(100-Math.max(0,(maxShare-40)/60*50)));
    const scoreCls = score>=85?'score-excellent':score>=70?'score-good':score>=50?'score-risk':'score-critical';
    const scoreLbl = score>=85?'Excellent':score>=70?'Good':score>=50?'At Risk':'Critical';

    useEffect(()=>{
        if (!divRef.current||!Object.keys(typeGroups).length) return;
        if (divChart.current) divChart.current.destroy();
        const ctx = divRef.current.getContext('2d');
        divChart.current = new Chart(ctx,{type:'bar',data:{labels:Object.keys(typeGroups),datasets:[{label:'Funding ($)',data:Object.values(typeGroups),backgroundColor:['#1976d2','#4caf50','#ff9800','#9c27b0','#607d8b']}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{callback:v=>fc(v)}}}}});
    },[fundingSources]);

    const calcROI = () => {
        const {cost,benefit,duration,rate} = roi;
        const r = rate/100;
        let npv = -cost;
        for (let t=1;t<=duration;t++) npv += benefit/Math.pow(1+r,t);
        const bcr = (npv+cost)/cost;
        const payback = cost/benefit;
        let lo=-0.99,hi=10,irr=0;
        for (let i=0;i<50;i++) { irr=(lo+hi)/2; let n=-cost; for(let t=1;t<=duration;t++) n+=benefit/Math.pow(1+irr,t); if(n>0) lo=irr; else hi=irr; }
        setRoiRes({npv,bcr,payback,irr:irr*100});
    };

    return (
        <div>
            <div className="card" style={{marginBottom:16}}>
                <div className="card-header">Year-by-Year Cash Flow</div>
                <div className="card-body"><div className="chart-box" style={{height:300}}><canvas ref={cashRef}></canvas></div></div>
            </div>
            <div className="grid-2">
                <div className="card">
                    <div className="card-header">Funding Diversity Score</div>
                    <div className="card-body">
                        {!fundingSources.length
                            ? <div className="alert alert-info">Add funding sources in the Scenario tab to see diversity analysis.</div>
                            : <>
                                <div className={`score-ring ${scoreCls}`}>{score}<small>{scoreLbl}</small></div>
                                {maxShare>90&&<div className="alert alert-danger" style={{marginTop:12}}>{fp(maxShare,0)} of funding from a single source — critical over-reliance.</div>}
                                {maxShare>70&&maxShare<=90&&<div className="alert alert-warning" style={{marginTop:12}}>{fp(maxShare,0)} from one source — consider diversifying.</div>}
                                <div style={{marginTop:12}}>
                                    {Object.entries(typeGroups).map(([t,a])=>{
                                        const pct = totalFund>0?a/totalFund*100:0;
                                        return <div key={t} className="diversity-bar-wrap">
                                            <div className="diversity-bar-lbl"><span>{t}</span><span>{fp(pct,0)} — {fc(a)}</span></div>
                                            <div className="diversity-bar-track"><div className="diversity-bar-fill" style={{width:`${pct}%`,background:pct>70?'#e65100':'#1976d2'}} /></div>
                                        </div>;
                                    })}
                                </div>
                                <div className="chart-box" style={{height:150,marginTop:12}}><canvas ref={divRef}></canvas></div>
                            </>
                        }
                    </div>
                </div>
                <div className="card">
                    <div className="card-header">ROI / Cost-Benefit Calculator</div>
                    <div className="card-body">
                        <div className="form-group"><label>Total Project Cost ($)</label><input type="number" value={roi.cost} min={0} onChange={e=>setRoi(r=>({...r,cost:+e.target.value||0}))} /></div>
                        <div className="form-group"><label>Expected Annual Benefit ($)</label><input type="number" value={roi.benefit} min={0} onChange={e=>setRoi(r=>({...r,benefit:+e.target.value||0}))} /></div>
                        <div className="grid-2">
                            <div className="form-group"><label>Duration (years)</label><input type="number" value={roi.duration} min={1} max={30} onChange={e=>setRoi(r=>({...r,duration:+e.target.value||10}))} /></div>
                            <div className="form-group"><label>Discount Rate (%)</label><input type="number" value={roi.rate} min={0} max={20} step={0.5} onChange={e=>setRoi(r=>({...r,rate:+e.target.value||0}))} /></div>
                        </div>
                        <button className="btn btn-primary" onClick={calcROI} style={{width:'100%'}}>Calculate ROI</button>
                        {roiRes&&(
                            <div style={{marginTop:14}}>
                                {roiRes.bcr<1&&<div className="alert alert-danger">BCR below 1.0 — project does not generate positive returns at these inputs.</div>}
                                <div className="grid-2" style={{gap:10}}>
                                    <div className="roi-box"><div className="roi-val" style={{color:roiRes.npv>=0?'#1976d2':'#c62828'}}>{fc(roiRes.npv)}</div><div className="roi-lbl">Net Present Value</div></div>
                                    <div className="roi-box"><div className="roi-val" style={{color:roiRes.bcr>=1?'#2e7d32':'#c62828'}}>{roiRes.bcr.toFixed(2)}x</div><div className="roi-lbl">Benefit-Cost Ratio</div></div>
                                    <div className="roi-box"><div className="roi-val">{roiRes.payback.toFixed(1)} yrs</div><div className="roi-lbl">Payback Period</div></div>
                                    <div className="roi-box"><div className="roi-val">{roiRes.irr.toFixed(1)}%</div><div className="roi-lbl">Estimated IRR</div></div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            </div>
        </div>
    );
}

// TAB 4 — SCENARIO COMPARISON
// ════════════════════════════════════════════════════════════════════════════
function ComparisonTab({ fundingSources, expenses, scenario, savedScenarios }) {
    // Derive totals from the live working scenario passed from App.
    const liveCost = (expenses||[]).reduce((s,e) => s+(parseFloat(e.amount)||0), 0);
    const liveFunding = (fundingSources||[]).reduce((s,f) => s+(f.amount||0), 0);
    const liveName = (scenario||{}).name || 'Current Scenario';

    // Build the list of all loadable scenarios (live + saved snapshots)
    const allScenarioOptions = [
        {id:'__live__', name: liveName || 'Current Scenario', cost: liveCost, funding: liveFunding},
        ...(savedScenarios||[]).map(s => ({
            id: s.id,
            name: s.name,
            cost: (s.expenses||[]).reduce((t,e) => t+(parseFloat(e.amount)||0), 0),
            funding: (s.fundingSources||[]).reduce((t,f) => t+(f.amount||0), 0),
        })),
    ];

    const defaults = [
        {key:'opt', label:'Optimistic', cost: liveCost||5000000, funding: liveFunding||6000000, contingency:5, inflation:2, baseCost: liveCost||5000000, baseFunding: liveFunding||6000000},
        {key:'base', label:'Baseline',  cost: liveCost||7500000, funding: liveFunding||7500000, contingency:10, inflation:3, baseCost: liveCost||7500000, baseFunding: liveFunding||7500000},
        {key:'worst', label:'Worst Case', cost: liveCost||10000000, funding: liveFunding||6000000, contingency:20, inflation:6, baseCost: liveCost||10000000, baseFunding: liveFunding||6000000},
    ];
    const [scenarios, setScenarios] = useState(defaults);
    const [openLoader, setOpenLoader] = useState(null); // key of the panel showing load dropdown
    const COLORS = {opt:'#2e7d32',base:'#1565c0',worst:'#e65100'};

    const upd = (key,f,v) => setScenarios(p=>p.map(s=>s.key===key?{...s,[f]:parseFloat(v)||0}:s));
    const updLabel = (key,label) => setScenarios(p=>p.map(s=>s.key===key?{...s,label}:s));

    // Seed a comparison panel from a saved or live scenario.
    const seedPanel = (panelKey, opt) => {
        setScenarios(p => p.map(s => s.key===panelKey ? {
            ...s,
            cost: opt.cost,
            funding: opt.funding,
            baseCost: opt.cost,
            baseFunding: opt.funding,
            label: opt.id==='__live__' ? (liveName||s.label) : opt.name,
        } : s));
        setOpenLoader(null);
    };

    const calc = (s) => {
        const yrs = parseInt((scenario||{}).years)||5;
        const infl = s.cost * Math.pow(1+s.inflation/100, yrs);
        const cont = infl * (s.contingency/100);
        const total = infl + cont;
        return {infl, cont, total, gap: s.funding - total};
    };

    const metrics = [
        {label:'Project Cost',fn:s=>fc(s.cost)},
        {label:'Total Funding',fn:s=>fc(s.funding)},
        {label:'Inflation Rate',fn:s=>`${s.inflation}%`},
        {label:'Contingency %',fn:s=>`${s.contingency}%`},
        {label:'Contingency $',fn:s=>fc(calc(s).cont)},
        {label:'Infl.-Adjusted Cost',fn:s=>fc(calc(s).infl)},
        {label:'Total Cost (w/ contingency)',fn:s=>fc(calc(s).total)},
        {label:'Net Position',fn:(s)=>{const g=calc(s).gap;return <span style={{color:g>=0?'#2e7d32':'#c62828',fontWeight:700}}>{g>=0?'+':''}{fc(g)}</span>;}},
    ];

    return (
        <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                <div>
                    <h2>Scenario Comparison</h2>
                    <p className="page-desc">Load your built scenarios into each panel to compare them side by side. Adjust sliders to model optimistic, baseline, and worst-case variations.</p>
                </div>
                <button className="btn btn-primary no-print" onClick={()=>window.print()}>Export PDF</button>
            </div>

            {/* Quick-seed strip — one button loads the current scenario into Baseline */}
            {(liveCost > 0 || liveFunding > 0) && (
                <div className="alert alert-info" style={{marginBottom:18,display:'flex',alignItems:'center',gap:12}}>
                    <div style={{flex:1}}>
                        <strong>{liveName||'Current Scenario'}</strong> — {fc(liveFunding)} revenue, {fc(liveCost)} expenses, net {fc(liveFunding-liveCost)}
                    </div>
                    <button className="btn btn-primary btn-sm" onClick={()=>seedPanel('base', allScenarioOptions[0])}>
                        Load as Baseline
                    </button>
                </div>
            )}

            <div className="grid-3" style={{marginBottom:22}}>
                {scenarios.map(s=>{
                    const c=calc(s);
                    const bCost = s.baseCost || s.cost;
                    const bFund = s.baseFunding || s.funding;
                    return (
                        <div key={s.key} className={`scenario-panel ${s.key}`}>
                            <input type="text" value={s.label} onChange={e=>updLabel(s.key,e.target.value)}
                                style={{width:'100%',fontSize:17,fontWeight:700,border:'none',borderBottom:`2px solid ${COLORS[s.key]}`,marginBottom:10,padding:'3px 0',color:COLORS[s.key],background:'transparent'}} />

                            {/* Load from scenario dropdown */}
                            <div style={{position:'relative',marginBottom:14}}>
                                <button className="btn btn-secondary btn-sm" style={{width:'100%',textAlign:'left'}} onClick={()=>setOpenLoader(openLoader===s.key?null:s.key)}>
                                    Load from saved scenario...
                                </button>
                                {openLoader===s.key && (
                                    <div style={{position:'absolute',top:'100%',left:0,right:0,zIndex:100,background:'#fff',border:'1px solid #ddd',borderRadius:4,boxShadow:'0 4px 12px rgba(0,0,0,.12)',maxHeight:220,overflowY:'auto'}}>
                                        {allScenarioOptions.map(opt=>(
                                            <div key={opt.id} onClick={()=>seedPanel(s.key,opt)}
                                                style={{padding:'9px 12px',cursor:'pointer',borderBottom:'1px solid #f0f0f0'}}
                                                onMouseEnter={e=>e.currentTarget.style.background='#f0f7ff'}
                                                onMouseLeave={e=>e.currentTarget.style.background='#fff'}>
                                                <div style={{fontWeight:600,fontSize:13}}>{opt.id==='__live__'?'Current working scenario':opt.name}</div>
                                                <div style={{fontSize:11,color:'#888'}}>{fc(opt.funding)} funding / {fc(opt.cost)} expenses</div>
                                            </div>
                                        ))}
                                        {allScenarioOptions.length === 1 && (
                                            <div style={{padding:'9px 12px',color:'#aaa',fontSize:12}}>No saved scenarios yet — save one from the Scenario tab.</div>
                                        )}
                                    </div>
                                )}
                            </div>

                            <div className="form-group"><label>Total Cost</label><input type="number" value={s.cost} step={10000} onChange={e=>upd(s.key,'cost',e.target.value)} /></div>
                            <div className="form-group"><label>Total Funding</label><input type="number" value={s.funding} step={10000} onChange={e=>upd(s.key,'funding',e.target.value)} /></div>
                            <div className="form-group">
                                <label>Cost ±50% <span style={{color:COLORS[s.key],fontWeight:600}}>{fc(s.cost)}</span></label>
                                <input type="range" min={Math.max(0,bCost*.5)} max={bCost*1.5||1000000} step={Math.max(1,Math.round(bCost*.01))} value={s.cost} onChange={e=>upd(s.key,'cost',e.target.value)} style={{width:'100%'}} />
                            </div>
                            <div className="form-group">
                                <label>Funding ±50% <span style={{color:COLORS[s.key],fontWeight:600}}>{fc(s.funding)}</span></label>
                                <input type="range" min={Math.max(0,bFund*.5)} max={bFund*1.5||1000000} step={Math.max(1,Math.round(bFund*.01))} value={s.funding} onChange={e=>upd(s.key,'funding',e.target.value)} style={{width:'100%'}} />
                            </div>
                            <div className="form-group"><label>Contingency: <strong>{s.contingency}%</strong></label>
                                <input type="range" min={0} max={30} value={s.contingency} onChange={e=>upd(s.key,'contingency',e.target.value)} style={{width:'100%'}} /></div>
                            <div className="form-group"><label>Inflation: <strong>{s.inflation}%</strong></label>
                                <input type="range" min={0} max={10} step={.5} value={s.inflation} onChange={e=>upd(s.key,'inflation',e.target.value)} style={{width:'100%'}} /></div>
                            <div className="net-box" style={{background:c.gap>=0?'#e8f5e9':'#ffebee'}}>
                                <div className="net-label">Net Position</div>
                                <div className="net-val" style={{color:c.gap>=0?'#2e7d32':'#c62828'}}>{c.gap>=0?'+':''}{fc(c.gap)}</div>
                                <div style={{fontSize:11,color:'#777'}}>{c.gap>=0?'Surplus':'Funding Gap'}</div>
                            </div>
                        </div>
                    );
                })}
            </div>

            <div className="card">
                <div className="card-header">Comparison Summary</div>
                <div style={{overflowX:'auto'}}>
                    <table>
                        <thead>
                            <tr>
                                <th>Metric</th>
                                {scenarios.map(s=><th key={s.key} style={{textAlign:'right',color:COLORS[s.key]}}>{s.label}</th>)}
                            </tr>
                        </thead>
                        <tbody>
                            {metrics.map((m,i)=>{
                                const vals = scenarios.map(s=>{
                                    const c=calc(s);
                                    if(m.label==='Net Position') return c.gap;
                                    if(m.label==='Project Cost') return s.cost;
                                    if(m.label==='Total Funding') return s.funding;
                                    if(m.label==='Contingency $') return c.cont;
                                    if(m.label==='Infl.-Adjusted Cost') return c.infl;
                                    if(m.label==='Total Cost (w/ contingency)') return c.total;
                                    return null;
                                });
                                const nums = vals.every(v=>v!==null);
                                const maxV=nums?Math.max(...vals):null;
                                const minV=nums?Math.min(...vals):null;
                                return (
                                    <tr key={i}>
                                        <td><strong>{m.label}</strong></td>
                                        {scenarios.map((s,si)=>{
                                            const v=nums?vals[si]:null;
                                            const isNet=m.label==='Net Position';
                                            let bg='';
                                            if(nums&&v!==null){bg=isNet?(v>=0&&v===maxV?'#e8f5e9':v<0&&v===minV?'#ffebee':''):(v===minV?'#e8f5e9':v===maxV?'#ffebee':'');}
                                            return <td key={s.key} style={{textAlign:'right',background:bg}}>{m.fn(s)}</td>;
                                        })}
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    );
}

// TAB 5 — WHAT-IF SIMULATOR
// ════════════════════════════════════════════════════════════════════════════
// Helper: currency formatter (reused from outer scope)
const FACTOR_COLORS = {
    revenue_loss:    '#c62828',
    revenue_gain:    '#2e7d32',
    expense_removed: '#1565c0',
    expense_added:   '#e65100',
    onetime_cost:    '#6a1b9a',
    budget_change:   '#0277bd',
    unknown:         '#757575',
};
const FACTOR_LABELS = {
    revenue_loss:    'Revenue Loss',
    revenue_gain:    'Revenue Gain',
    expense_removed: 'Expense Saved',
    expense_added:   'New Expense',
    onetime_cost:    'One-Time Cost',
    budget_change:   'Budget Change',
    unknown:         'Unclassified',
};

function WhatIfTab({ fundingSources, expenses, scenario }) {
    const [query, setQuery]   = useState('');
    const [results, setResults] = useState(null);
    const [loading, setLoading] = useState(false);
    const [showAccounts, setShowAccounts] = useState(false);
    const chartRef  = useRef(null);
    const chartInst = useRef(null);

    // Real GL accounts injected server-side. Falls back to an empty set.
    const GL = (typeof window !== 'undefined' && window.GOVSIGHT_GL_ACCOUNTS) || {revenue:[], expense:[], asset:[]};
    const totalGLRevenue = GL.revenue.reduce((s,a)=>s+(a.budget||0), 0) || 12800000;
    const totalGLExpense = GL.expense.reduce((s,a)=>s+(a.budget||0), 0) || 11000000;

    const samples = [
        'What if our data center accounting for 8% of utility revenue burns down, but saves $100K/yr in expenses and causes cleanup costs?',
        'What if a flood destroys our parking garage that generates 12% of fee revenue?',
        'What if we lose a major employer that contributes 15% of sales tax revenue?',
        'What if we increase the police department budget by 15%?',
        'What happens if we cut all department budgets by 10%?',
        'Show impact of adding 5% COLA to all salaries',
        'Impact of hiring 10 new firefighters',
    ];

    // ── Multi-factor GL-aware parser ─────────────────────────────────────────
    // Extracts an ARRAY of financial factors from a free-form question, matching
    // each factor against real GL accounts injected by the server.
    // Direction is classified by disaster/removal/cleanup CONTEXT, not a generic
    // increase/decrease word search — which is what caused "accounting for 8%"
    // to previously return a positive result.
    const parseMultiFactor = (q) => {
        const ql = q.toLowerCase();

        // ── Magnitude extraction ───────────────────────────────────────────────
        const pcts    = [...ql.matchAll(/(\d+\.?\d*)\s*%/g)].map(m => parseFloat(m[1]));
        const dolarMs = [...ql.matchAll(/\$\s*([\d,]+\.?\d*)\s*(k|m|million|thousand)?/gi)];
        const parseDollar = (m) => {
            let v = parseFloat(m[1].replace(/,/g,''));
            const u = (m[2]||'').toLowerCase();
            if (u==='k'||u==='thousand') v*=1000;
            if (u==='m'||u==='million')  v*=1000000;
            return v;
        };
        const dollars = dolarMs.map(parseDollar);

        // ── Semantic context flags ─────────────────────────────────────────────
        // "accounting for 8%" → has_pct_context but NOT isDecrease/isIncrease
        const isDisaster   = /burns?\s*down|destroy|fire\s+(destroys?|burns?|damage)|flood|disaster|collapse|explosion|catastroph/.test(ql);
        const isRemoveExp  = /won'?t\s+need|no\s+longer|eliminat|save\s+(us\s+)?on|discontinu|shut\s+down/.test(ql);
        const isCleanup    = /cleanup|clean.up|remediat|demolit|rebuild|debris|decontaminat|haul\s+away|repair\s+cost/.test(ql);
        const isHire       = /\bhire\b|hiring\b|new\s+(firefighter|officer|employee|staff|worker)/.test(ql);
        const isCOLA       = /\bcola\b|cost.of.living|salary increase|pay raise/.test(ql);
        const isReallocate = /reallocat|transfer|move.*from|shift.*from/.test(ql);
        const isIncrease   = /\b(increase|raise|add|boost|grow)\b/.test(ql) && !isDisaster;
        const isDecrease   = /\b(cut|reduc|decreas|slash|lower|trim)\b/.test(ql) && !isDisaster;
        const isAll        = /all department|every department|across.the.board/.test(ql);
        const hasRevKw     = /revenue|income|fund|tax|utilit|earn|generat|contribut|account.+for/.test(ql);
        const hasExpKw     = /expense|cost|maintain|mainten|server|operat|staff|employ|utilities/.test(ql);

        // ── GL account keyword matching ────────────────────────────────────────
        const queryWords = ql.match(/[a-z]{4,}/g) || [];
        const matchAccts = (list) => list.filter(a =>
            queryWords.some(w => (a.name||'').toLowerCase().includes(w) || (a.department||'').toLowerCase().includes(w))
        ).slice(0, 5);

        const matchedRev = matchAccts(GL.revenue);
        const matchedExp = matchAccts(GL.expense);

        // Derive totals from matched accounts if found, else use GL totals
        const revBase = matchedRev.length > 0
            ? matchedRev.reduce((s,a)=>s+(a.budget||0),0)
            : totalGLRevenue;

        // ── Factor extraction ──────────────────────────────────────────────────
        const factors = [];

        // Factor A — revenue loss (disaster / event destroys revenue source)
        if (isDisaster && hasRevKw && pcts.length > 0) {
            const pct = pcts[0];
            const loss = totalGLRevenue * (pct / 100);
            factors.push({
                type: 'revenue_loss',
                label: `Revenue loss — ${pct.toFixed(1)}% of total revenue`,
                annualImpact: -loss,
                pct,
                matchedAccounts: matchedRev,
            });
        }

        // Factor B — ongoing expense elimination
        if ((isRemoveExp || isDisaster) && hasExpKw) {
            let saved = 0;
            if (dollars.length > 0) {
                saved = dollars[0];
            } else if (matchedExp.length > 0) {
                saved = matchedExp.reduce((s,a)=>s+(a.budget||0),0) * 0.8;
            } else {
                saved = totalGLExpense * 0.015; // 1.5% default when nothing matched
            }
            factors.push({
                type: 'expense_removed',
                label: `Ongoing expense savings (asset no longer operating)`,
                annualImpact: +saved,
                dollar: saved,
                matchedAccounts: matchedExp,
            });
        }

        // Factor C — one-time cleanup / remediation cost
        if (isCleanup || isDisaster) {
            let cleanup = 0;
            if (dollars.length >= 2) {
                cleanup = dollars[1];
            } else if (dollars.length === 1 && factors.length === 0) {
                cleanup = dollars[0];
            } else if (factors.length > 0) {
                // Estimate: 2–3× the annual revenue loss
                const revFactor = factors.find(f=>f.type==='revenue_loss');
                cleanup = revFactor ? Math.abs(revFactor.annualImpact) * 2.5 : 300000;
            } else {
                cleanup = 300000;
            }
            factors.push({
                type: 'onetime_cost',
                label: `One-time cleanup / remediation (not annualised)`,
                annualImpact: 0,
                onetimeCost: cleanup,
                matchedAccounts: [],
            });
        }

        // Factor D — new hire cost
        if (isHire) {
            const hm = ql.match(/(\d+)\s+new\s+\w+/);
            const count = hm ? parseInt(hm[1]) : 1;
            const AVG_COMP = 72000;
            const cost = count * AVG_COMP;
            factors.push({
                type: 'expense_added',
                label: `New hire cost (${count} position${count!==1?'s':''} × $72K avg total comp)`,
                annualImpact: -cost,
                dollar: cost,
                matchedAccounts: matchedExp,
            });
        }

        // Factor E — COLA
        if (isCOLA && pcts.length > 0) {
            const pct = pcts[0];
            const cola = totalGLExpense * 0.65 * (pct / 100);
            factors.push({
                type: 'expense_added',
                label: `${pct.toFixed(1)}% COLA applied to estimated personnel costs (65% of total expenses)`,
                annualImpact: -cola,
                dollar: cola,
                matchedAccounts: [],
            });
        }

        // Factor F — reallocation (revenue-neutral)
        if (isReallocate && pcts.length > 0) {
            const fromM = ql.match(/from\s+([a-z\s&]+?)\s+to\s+/);
            const toM   = ql.match(/\bto\s+([a-z\s&]+?)(?:\s*[?.]|$)/);
            factors.push({
                type: 'budget_change',
                label: `Reallocation of ${pcts[0].toFixed(1)}%${fromM?` from ${fromM[1].trim()}`:''}${toM?` to ${toM[1].trim()}`:''}`,
                annualImpact: 0,
                matchedAccounts: [...matchedRev, ...matchedExp].slice(0,4),
            });
        }

        // Factor G — simple % increase / decrease
        if (!factors.length && pcts.length > 0) {
            const pct = pcts[0];
            const base = isAll ? totalGLExpense : (matchedExp.length ? matchedExp.reduce((s,a)=>s+(a.budget||0),0) : totalGLExpense * 0.15);
            const impact = base * (pct/100) * (isDecrease ? -1 : 1);
            factors.push({
                type: isDecrease ? 'budget_change' : 'budget_change',
                label: `${pct.toFixed(1)}% ${isDecrease?'reduction':'increase'} in ${isAll?'all departments':matchedExp.length?matchedExp.map(a=>a.department).join(', '):'selected departments'}`,
                annualImpact: impact,
                matchedAccounts: matchedExp,
            });
        }

        // Factor H — dollar-only scenario
        if (!factors.length && dollars.length > 0) {
            const impact = dollars[0] * (isDecrease ? -1 : 1);
            factors.push({
                type: 'budget_change',
                label: `${isDecrease?'Remove':'Add'} ${fc(dollars[0])} ${isDecrease?'from':'to'} ${matchedExp.length?matchedExp[0].department:'budget'}`,
                annualImpact: impact,
                matchedAccounts: [...matchedRev,...matchedExp].slice(0,3),
            });
        }

        // Unknown
        if (!factors.length) {
            factors.push({
                type: 'unknown',
                label: 'Scenario could not be parsed — try including a percentage or dollar amount.',
                annualImpact: 0,
                matchedAccounts: [],
            });
        }

        // ── Three scenario branches ────────────────────────────────────────────
        // Branches differ in how optimistic/pessimistic the revenue loss and
        // cleanup costs are. Impact multipliers are applied only to non-zero items.
        const calcBranch = (impMult, onetimeMult) => {
            let annual = 0, onetime = 0;
            factors.forEach(f => {
                annual  += (f.annualImpact || 0) * impMult;
                onetime += (f.onetimeCost  || 0) * onetimeMult;
            });
            return {annualNet: Math.round(annual), onetimeCost: Math.round(onetime)};
        };
        const optimistic = calcBranch(0.7, 0.5);
        const expected   = calcBranch(1.0, 1.0);
        const worstCase  = calcBranch(1.3, 2.0);

        const totalImpact = expected.annualNet;
        const pctChange   = totalGLRevenue ? (totalImpact / totalGLRevenue * 100) : 0;
        const allMatched  = [...matchedRev, ...matchedExp].filter((a,i,arr) => arr.findIndex(b=>b.number===a.number)===i);

        // ── Interpretation text ────────────────────────────────────────────────
        let interpretation = '';
        if (factors[0].type === 'unknown') {
            interpretation = 'Could not identify a specific financial action or amount. Try: "What if our data center accounting for 8% of utility revenue burns down, saving $100K/yr in expenses?"';
        } else {
            const parts = factors.filter(f=>f.type!=='onetime_cost').map(f => {
                const sign = f.annualImpact >= 0 ? '+' : '';
                return `${f.label} (${sign}${fc(f.annualImpact)}/yr)`;
            });
            const onetimeF = factors.find(f=>f.type==='onetime_cost');
            interpretation  = `This scenario involves ${factors.length} financial factor${factors.length!==1?'s':''}: ${parts.join('; ')}.`;
            if (onetimeF) interpretation += ` Additionally, an estimated one-time cost of ${fc(onetimeF.onetimeCost)} is projected for cleanup or remediation.`;
            interpretation += ` Expected net annual position: ${fc(totalImpact)} (${pctChange >= 0 ? '+' : ''}${pctChange.toFixed(1)}% of total revenue).`;
            if (allMatched.length) {
                interpretation += ` ${allMatched.length} matching GL account${allMatched.length!==1?'s were':' was'} identified in the chart of accounts.`;
            }
        }

        return {
            interpretation,
            totalImpact,
            pctChange,
            affectedCount: new Set(allMatched.map(a=>a.department)).size,
            factors,
            branches: {optimistic, expected, worstCase},
            matchedAccounts: allMatched,
            chartData: {
                labels:   ['Optimistic', 'Expected', 'Worst Case'],
                current:  [0, 0, 0],
                proposed: [optimistic.annualNet, expected.annualNet, worstCase.annualNet],
                changed:  [true, true, true],
            },
        };
    };

    const run = () => {
        if (!query.trim()) return;
        setLoading(true);
        setTimeout(() => {
            const r = parseMultiFactor(query);
            setResults(r);
            setTimeout(() => drawChart(r.chartData), 60);
            setLoading(false);
        }, 300);
    };

    const drawChart = (data) => {
        if (!chartRef.current) return;
        const ctx = chartRef.current.getContext('2d');
        if (chartInst.current) chartInst.current.destroy();
        const BRANCH_COLORS = ['#66bb6a','#1976d2','#f44336'];
        chartInst.current = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: data.labels,
                datasets: [{
                    label: 'Net Annual Impact',
                    data: data.proposed,
                    backgroundColor: data.proposed.map(v => v >= 0 ? '#66bb6a' : '#ef9a9a'),
                    borderColor:     data.proposed.map(v => v >= 0 ? '#2e7d32' : '#c62828'),
                    borderWidth: 2,
                }],
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: {display: false},
                    tooltip: {callbacks: {label: c => `Net annual impact: ${fc(c.parsed.y)}`}},
                },
                scales: {y: {ticks: {callback: v => fc(v)}}},
            },
        });

    const BRANCH_COLOR = {optimistic:'#2e7d32', expected:'#1565c0', worstCase:'#c62828'};
    const BRANCH_LABEL = {optimistic:'Optimistic', expected:'Expected', worstCase:'Worst Case'};

    return (
        <div>
            <h2>What-If Scenario Simulator</h2>
            <p className="page-desc">
                Describe any financial scenario — including complex multi-factor events — and see a breakdown of
                revenue impacts, expense changes, one-time costs, and three scenario branches (Optimistic, Expected, Worst Case).

                {GL.revenue.length + GL.expense.length > 0
                    ? `${GL.revenue.length + GL.expense.length} real GL accounts loaded from your chart of accounts.`
                    : 'a representative municipal chart of accounts.'}
            </p>
            <div className="alert alert-info">
                Try complex scenarios like: "What if our data center accounting for 8% of utility revenue burns down, saving $100K/yr in expenses but causing cleanup costs?"
            </div>

            <div className="form-group">
                <label>Enter your scenario question</label>
                <textarea value={query} onChange={e=>setQuery(e.target.value)}
                    onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();run();} }}
                    placeholder="Describe your scenario in plain language..." rows={4} />
            </div>
            <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:16}}>
                {samples.map((s,i) => <button key={i} className="btn btn-secondary btn-sm" onClick={()=>setQuery(s)}>{s}</button>)}
            </div>
            <button className="btn btn-primary" onClick={run} disabled={loading||!query.trim()}>
                Analyze Scenario {loading && <span className="loading"></span>}
            </button>

            {results && (
                <div style={{marginTop:24}}>

                    {/* ── Interpretation ── */}
                    <div className="card">
                        <div className="card-header">Scenario Interpretation</div>
                        <div className="card-body">
                            <p style={{fontSize:14,lineHeight:1.7,marginBottom:16}}>{results.interpretation}</p>
                            <div className="grid-3">
                                <div className="stat-card">
                                    <div className="stat-value" style={{color:results.totalImpact>=0?'#2e7d32':'#c62828'}}>
                                        {results.totalImpact>=0?'+':''}{fc(results.totalImpact)}
                                    </div>
                                    <div className="stat-label">Expected Net Annual Impact</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-value" style={{color:results.pctChange>=0?'#2e7d32':'#c62828'}}>
                                        {results.pctChange>=0?'+':''}{fp(Math.abs(results.pctChange))}
                                    </div>
                                    <div className="stat-label">% of Total Revenue</div>
                                </div>
                                <div className="stat-card">
                                    <div className="stat-value">{results.factors.length}</div>
                                    <div className="stat-label">Financial Factors Identified</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* ── Factor Breakdown ── */}
                    <div className="card" style={{marginTop:16}}>
                        <div className="card-header">Factor Breakdown</div>
                        <div style={{overflowX:'auto'}}>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Type</th>
                                        <th>Description</th>
                                        <th style={{textAlign:'right'}}>Annual Impact</th>
                                        <th style={{textAlign:'right'}}>One-Time Cost</th>
                                        <th>Matched GL Accounts</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {results.factors.map((f,i) => (
                                        <tr key={i}>
                                            <td>

                            </table>
                        </div>
                    </div>

                    {/* ── Three Scenario Branches ── */}
                    <div className="card" style={{marginTop:16}}>
                        <div className="card-header">Scenario Branch Comparison</div>
                        <div className="card-body">
                            <p style={{fontSize:12,color:'#777',marginBottom:14}}>
                                Optimistic assumes 70% of expected impact + 50% cleanup costs.
                                Expected uses stated values.
                                Worst Case assumes 130% of expected impact + 200% cleanup costs.
                            </p>
                            <div className="grid-3">
                                {Object.entries(results.branches).map(([key, branch]) => (
                                    <div key={key} style={{background:'#f9f9f9',border:`2px solid ${BRANCH_COLOR[key]}`,borderRadius:8,padding:16}}>
                                        <div style={{fontWeight:700,fontSize:15,color:BRANCH_COLOR[key],marginBottom:12}}>{BRANCH_LABEL[key]}</div>
                                        <div style={{marginBottom:8}}>
                                            <div style={{fontSize:11,color:'#888',marginBottom:2}}>Net Annual Impact</div>
                                            <div style={{fontWeight:700,fontSize:20,color:branch.annualNet>=0?'#2e7d32':'#c62828'}}>
                                                {branch.annualNet>=0?'+':''}{fc(branch.annualNet)}
                                            </div>
                                        </div>
                                        {branch.onetimeCost > 0 && (
                                            <div>
                                                <div style={{fontSize:11,color:'#888',marginBottom:2}}>One-Time Remediation</div>
                                                <div style={{fontWeight:600,fontSize:15,color:'#6a1b9a'}}>{fc(branch.onetimeCost)}</div>
                                            </div>
                                        )}
                                        <div style={{marginTop:10,paddingTop:8,borderTop:'1px solid #e0e0e0',fontSize:11,color:'#666'}}>
                                            Year 1 total: {fc(branch.annualNet - branch.onetimeCost)}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* ── Chart ── */}
                    <div className="chart-box" style={{marginTop:16,height:260}}>
                        <canvas ref={chartRef}></canvas>
                    </div>

                    {/* ── Matched GL Accounts ── */}
                    {results.matchedAccounts.length > 0 && (
                        <div className="card" style={{marginTop:16}}>
                            <div className="card-header" style={{cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center'}} onClick={()=>setShowAccounts(v=>!v)}>
                                <span>Matched GL Accounts ({results.matchedAccounts.length})</span>
                                <span style={{fontSize:12,color:'#888'}}>{showAccounts?'Hide':'Show'}</span>
                            </div>
                            {showAccounts && (
                                <div style={{overflowX:'auto'}}>
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Account #</th>
                                                <th>Account Name</th>
                                                <th>Type</th>
                                                <th>Department</th>
                                                <th style={{textAlign:'right'}}>Budget</th>
                                                <th style={{textAlign:'right'}}>YTD Actual</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {results.matchedAccounts.map((a,i) => (
                                                <tr key={i}>
                                                    <td style={{fontFamily:'monospace',fontSize:12}}>{a.number}</td>
                                                    <td>{a.name}</td>
                                                    <td><span style={{fontSize:11,padding:'1px 6px',borderRadius:10,background:a.type==='Revenue'?'#e8f5e9':'#fff3e0',color:a.type==='Revenue'?'#2e7d32':'#e65100',fontWeight:600}}>{a.type}</span></td>
                                                    <td style={{fontSize:12,color:'#666'}}>{a.department}</td>
                                                    <td style={{textAlign:'right'}}>{fc(a.budget||0)}</td>
                                                    <td style={{textAlign:'right',color:(a.actual||0)>(a.budget||0)?'#c62828':'#555'}}>{fc(a.actual||0)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            )}
        </div>
    );
}

const POLICY_IMPACT_MAP = {

    'Transportation and Public Works': {level:'High', areas:['Public Works','Engineering'], keywords:['infrastructure grants','road funding','transit subsidies']},
