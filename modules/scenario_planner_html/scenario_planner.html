<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GovSight Scenario Planner</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --primary: #1976d2;
            --success: #4caf50;
            --danger: #f44336;
            --warning: #ff9800;
            --dark: #212121;
            --white: #ffffff;
            --border: #e0e0e0;
            --bg: #f5f5f5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: var(--bg); color: #333; }

        /* ── Layout ── */
        .app-shell { display: flex; flex-direction: column; min-height: 100vh; }
        .top-bar { background: #1565c0; color: white; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
        .top-bar h1 { font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
        .top-bar .top-meta { font-size: 13px; opacity: .8; }
        .main-nav { background: white; border-bottom: 2px solid var(--border); display: flex; overflow-x: auto; }
        .main-nav button { padding: 14px 22px; background: none; border: none; border-bottom: 3px solid transparent; margin-bottom: -2px; cursor: pointer; font-size: 14px; font-weight: 500; color: #555; white-space: nowrap; transition: all .15s; }
        .main-nav button:hover { color: var(--primary); }
        .main-nav button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

        .body-area { display: flex; flex: 1; position: relative; }
        .content-area { flex: 1; padding: 24px; overflow-y: auto; }

        /* ── Collaboration sidebar ── */
        .collab-toggle { position: fixed; right: 0; top: 50%; transform: translateY(-50%); background: #1565c0; color: white; border: none; cursor: pointer; writing-mode: vertical-rl; padding: 14px 8px; border-radius: 6px 0 0 6px; font-size: 13px; font-weight: 600; z-index: 100; letter-spacing: .04em; }
        .collab-sidebar { position: fixed; right: 0; top: 0; bottom: 0; width: 320px; background: white; border-left: 2px solid var(--border); display: flex; flex-direction: column; z-index: 200; transform: translateX(100%); transition: transform .2s; box-shadow: -4px 0 20px rgba(0,0,0,.12); }
        .collab-sidebar.open { transform: translateX(0); }
        .collab-header { background: #1565c0; color: white; padding: 16px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .collab-header span { font-weight: 600; font-size: 15px; }
        .collab-close { background: none; border: 1px solid rgba(255,255,255,.4); color: white; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .collab-body { flex: 1; overflow-y: auto; padding: 14px; }
        .collab-add { padding: 12px 14px; border-top: 1px solid var(--border); flex-shrink: 0; }
        .ann-item { background: #fffde7; border: 1px solid #ffe082; border-radius: 5px; padding: 10px; margin-bottom: 8px; }
        .ann-meta { font-size: 11px; color: #888; margin-bottom: 3px; display: flex; justify-content: space-between; }
        .ann-target { font-size: 10px; background: #e3f2fd; color: #1565c0; padding: 1px 6px; border-radius: 8px; }
        .ann-remove { background: none; border: none; color: #ccc; cursor: pointer; font-size: 11px; }
        .ann-remove:hover { color: #f44336; }

        /* ── Sub-tabs ── */
        .sub-nav { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        .sub-nav button { padding: 9px 18px; background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; font-size: 13px; font-weight: 500; color: #777; transition: all .15s; }
        .sub-nav button:hover { color: var(--primary); }
        .sub-nav button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

        /* ── Cards / UI ── */
        .card { background: white; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 18px; overflow: hidden; }
        .card-header { background: #f8f9fa; padding: 11px 16px; font-weight: 600; font-size: 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .card-body { padding: 16px; }
        h2 { font-size: 19px; margin-bottom: 6px; color: var(--dark); }
        h3 { font-size: 15px; margin-bottom: 10px; color: #444; }
        .page-desc { color: #777; font-size: 13px; margin-bottom: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 7px 11px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(25,118,210,.1); }

        .btn { padding: 7px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s; }
        .btn:disabled { opacity: .55; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background: #1565c0; }
        .btn-secondary { background: #e8e8e8; color: #333; }
        .btn-secondary:hover:not(:disabled) { background: #d0d0d0; }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover:not(:disabled) { background: #1b5e20; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover:not(:disabled) { background: #b71c1c; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }

        .badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .badge-gray { background: #eee; color: #555; }
        .badge-blue { background: #e3f2fd; color: #1565c0; }
        .badge-green { background: #e8f5e9; color: #2e7d32; }
        .badge-red { background: #ffebee; color: #b71c1c; }
        .badge-orange { background: #fff3e0; color: #e65100; }
        .badge-amber { background: #fffde7; color: #f57f17; }

        .alert { padding: 10px 14px; border-radius: 5px; margin-bottom: 14px; font-size: 13px; }
        .alert-info { background: #e3f2fd; border: 1px solid #90caf9; color: #0d47a1; }
        .alert-success { background: #e8f5e9; border: 1px solid #a5d6a7; color: #1b5e20; }
        .alert-warning { background: #fff3e0; border: 1px solid #ffcc80; color: #e65100; }
        .alert-danger { background: #ffebee; border: 1px solid #ef9a9a; color: #b71c1c; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f5f5f5; padding: 9px 10px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border); }
        td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; }
        tr:hover td { background: rgba(25,118,210,.025); }
        .row-gap { background: #ffebee !important; }
        .row-surplus { background: #e8f5e9 !important; }

        .stat-card { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 14px; text-align: center; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 11px; color: #777; margin-top: 3px; text-transform: uppercase; letter-spacing: .04em; }

        .chart-box { position: relative; height: 280px; }
        .funding-row { display: flex; gap: 10px; margin-bottom: 9px; align-items: center; }
        .funding-row select { width: 130px; flex-shrink: 0; }
        .funding-row input[type="text"] { flex: 1; }
        .funding-row input[type="number"] { width: 130px; flex-shrink: 0; text-align: right; }

        .slider-row { display: flex; align-items: center; gap: 10px; }
        .slider-row input[type="range"] { flex: 1; }
        .slider-val { min-width: 52px; text-align: right; font-weight: 600; color: var(--primary); font-size: 14px; }

        .grant-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; background: white; }
        .grant-row:hover { border-color: #90caf9; }

        .realloc-bar-track { background: #e0e0e0; border-radius: 4px; height: 14px; margin-top: 4px; }
        .realloc-bar-fill { height: 14px; border-radius: 4px; transition: width .3s; }

        .scenario-panel { border: 2px solid var(--border); border-radius: 8px; padding: 14px; background: white; }
        .scenario-panel.opt { border-top: 4px solid #4caf50; }
        .scenario-panel.base { border-top: 4px solid #1976d2; }
        .scenario-panel.worst { border-top: 4px solid #ff9800; }
        .net-box { border-radius: 6px; padding: 11px; margin-top: 10px; text-align: center; }
        .net-label { font-size: 10px; color: #666; text-transform: uppercase; }
        .net-val { font-size: 20px; font-weight: 700; margin-top: 2px; }

        .diversity-bar-wrap { margin-bottom: 8px; }
        .diversity-bar-lbl { font-size: 12px; display: flex; justify-content: space-between; margin-bottom: 2px; }
        .diversity-bar-track { background: #e0e0e0; border-radius: 4px; height: 16px; }
        .diversity-bar-fill { height: 16px; border-radius: 4px; transition: width .3s; }
        .score-ring { font-size: 52px; font-weight: 700; text-align: center; padding: 16px; border-radius: 8px; line-height: 1; }
        .score-ring small { font-size: 16px; font-weight: 400; display: block; margin-top: 4px; }
        .score-excellent { color: #2e7d32; background: #e8f5e9; }
        .score-good { color: #1565c0; background: #e3f2fd; }
        .score-risk { color: #e65100; background: #fff3e0; }
        .score-critical { color: #b71c1c; background: #ffebee; }

        .roi-box { text-align: center; padding: 12px; border-radius: 8px; background: #f5f5f5; }
        .roi-val { font-size: 20px; font-weight: 700; color: var(--primary); }
        .roi-lbl { font-size: 11px; color: #777; margin-top: 2px; }

        .inline-note { background: #fffde7; border: 1px solid #f9a825; border-radius: 4px; padding: 8px 10px; margin-top: 6px; }
        .comment-link { font-size: 11px; color: var(--primary); cursor: pointer; text-decoration: underline; }

        .share-url-box { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
        .share-url-box input { flex: 1; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; background: #f9f9f9; }

        .shared-banner { background: #e3f2fd; border-bottom: 2px solid #90caf9; padding: 9px 24px; font-size: 13px; color: #0d47a1; }

        .loading { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; margin-left: 6px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media print {
            .collab-toggle, .collab-sidebar, .main-nav, .top-bar, .sub-nav, .no-print { display: none !important; }
            body { background: white; }
            .card { box-shadow: none; break-inside: avoid; }
        }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Utilities ────────────────────────────────────────────────────────────────
const fc = (n) => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:0,maximumFractionDigits:0}).format(n||0);
const fp = (v,d=1) => `${(+v||0).toFixed(d)}%`;
const genId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const timeAgo = (ts) => { const s=Math.floor((Date.now()-new Date(ts))/1000); if(s<60)return'just now'; if(s<3600)return`${Math.floor(s/60)}m ago`; if(s<86400)return`${Math.floor(s/3600)}h ago`; return`${Math.floor(s/86400)}d ago`; };
const daysUntil = (d) => d ? Math.ceil((new Date(d)-new Date())/86400000) : null;
const lsGet = (k,fb) => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):fb; } catch { return fb; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch {} };

// ── API ──────────────────────────────────────────────────────────────────────
// Priority: server-injected URL > localStorage override > environment detection > localhost fallback
const getBase = () => {
    if (window.GOVSIGHT_API_URL) return window.GOVSIGHT_API_URL;
    const cfg = localStorage.getItem('govsight_api_url'); if(cfg) return cfg;
    const {hostname,protocol} = window.location;
    if(hostname.includes('replit.app')) return `${protocol}//${hostname.replace(/-\d+\./, '-8000.')}`;
    if(hostname.includes('replit.dev')||hostname.includes('repl.co')) {
        try { let h=hostname; if(window.parent!==window&&window.parent.location) h=window.parent.location.hostname; return `${protocol}//${h.replace(/-5000\b/,'-8000').replace(/-00\b/,'-8000')}`; } catch { return `${protocol}//${hostname.replace(/-5000\b/,'-8000')}`; }
    }
    return 'http://localhost:8000';
};
const API = getBase();
const api = {
    get: async (path) => { const r=await fetch(`${API}${path}`); return r.json(); },
    post: async (path,body) => { const r=await fetch(`${API}${path}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); if(!r.ok) throw new Error(`${r.status}`); return r.json(); },
    getScenarios: () => api.get('/api/scenarios'),
    saveScenario: (d) => api.post('/api/scenarios',d),
    getDepartments: () => api.get('/api/departments'),
    runMonteCarlo: (p) => api.post('/api/monte-carlo/run',p),
    lookupBill: (p) => api.post('/api/ai/bill-lookup',p),
    analyzeWhatIf: (q) => api.post('/api/ai/whatif-analysis',{query:q}),
    searchGrants: (q) => api.get(`/api/grants/search?q=${encodeURIComponent(q)}`),
};

// ── Grant library (built-in, used for client-side search + auto-matching) ─────
const GRANT_LIBRARY = [
    // Infrastructure & Transportation
    {name:'FHWA Surface Transportation Block Grant',agency:'Dept. of Transportation',category:'Infrastructure',min:500000,max:5000000,deadline:'2026-06-30',keywords:['road','highway','bridge','pavement','transportation'],url:'https://www.fhwa.dot.gov/federal-aidprogram/'},
    {name:'FTA Bus & Bus Facilities',agency:'Dept. of Transportation',category:'Infrastructure',min:250000,max:3000000,deadline:'2026-07-15',keywords:['transit','bus','fleet','vehicle','transportation'],url:'https://www.transit.dot.gov/funding/grants/bus-and-bus-facilities'},
    {name:'EPA Clean Water State Revolving Fund',agency:'EPA',category:'Infrastructure',min:250000,max:10000000,deadline:'2026-08-01',keywords:['water','sewer','wastewater','treatment','clean water'],url:'https://www.epa.gov/cwsrf'},
    {name:'EPA Drinking Water SRF',agency:'EPA',category:'Infrastructure',min:100000,max:5000000,deadline:'2026-08-01',keywords:['drinking water','water main','lead pipe','water supply'],url:'https://www.epa.gov/dwsrf'},
    {name:'USDA Water & Waste Disposal Loans & Grants',agency:'USDA Rural Development',category:'Infrastructure',min:50000,max:2000000,deadline:'2026-09-30',keywords:['rural','water','waste','wastewater','utility'],url:'https://www.rd.usda.gov/programs-services/water-environmental-programs'},
    {name:'USDA Community Facilities Grant',agency:'USDA Rural Development',category:'Infrastructure',min:25000,max:500000,deadline:'2026-09-30',keywords:['community','facility','building','rural','public'],url:'https://www.rd.usda.gov/programs-services/community-facilities-programs'},
    {name:'EDA Public Works Program',agency:'Dept. of Commerce (EDA)',category:'Infrastructure',min:500000,max:10000000,deadline:'2026-05-31',keywords:['economic development','public works','industrial','infrastructure'],url:'https://www.eda.gov/funding/programs/public-works'},
    {name:'RAISE Discretionary Grants',agency:'Dept. of Transportation',category:'Infrastructure',min:1000000,max:25000000,deadline:'2026-04-14',keywords:['transportation','infrastructure','multimodal','highway','bridge'],url:'https://www.transportation.gov/RAISEgrants'},
    // Public Safety
    {name:'COPS Hiring Program',agency:'Dept. of Justice',category:'Public Safety',min:125000,max:1250000,deadline:'2026-05-15',keywords:['police','law enforcement','hiring','officers','public safety'],url:'https://cops.usdoj.gov/grants'},
    {name:'SAFER Firefighter Staffing',agency:'FEMA',category:'Public Safety',min:200000,max:2000000,deadline:'2026-07-15',keywords:['fire','firefighter','staffing','SAFER','emergency'],url:'https://www.fema.gov/grants/preparedness/firefighters'},
    {name:'Assistance to Firefighters Grant',agency:'FEMA',category:'Public Safety',min:25000,max:1000000,deadline:'2026-06-15',keywords:['fire','equipment','training','firefighter','AFG'],url:'https://www.fema.gov/grants/preparedness/firefighters/assistance-firefighters'},
    {name:'BRIC Hazard Mitigation',agency:'FEMA',category:'Public Safety',min:100000,max:5000000,deadline:'2026-09-30',keywords:['hazard','mitigation','flood','disaster','resilience','risk'],url:'https://www.fema.gov/grants/mitigation/building-resilient-infrastructure-communities'},
    {name:'Edward Byrne Memorial JAG',agency:'Dept. of Justice',category:'Public Safety',min:25000,max:500000,deadline:'2026-08-30',keywords:['criminal justice','law enforcement','corrections','courts','public safety'],url:'https://bja.ojp.gov/program/jag'},
    // Housing & Community Development
    {name:'CDBG Community Development Block Grant',agency:'HUD',category:'Housing',min:100000,max:3000000,deadline:'2026-04-30',keywords:['community','housing','low income','development','CDBG'],url:'https://www.hud.gov/program_offices/comm_planning/cdbg'},
    {name:'HOME Investment Partnerships',agency:'HUD',category:'Housing',min:200000,max:2000000,deadline:'2026-06-30',keywords:['affordable housing','HOME','rental','homeownership','housing'],url:'https://www.hud.gov/program_offices/comm_planning/home'},
    {name:'Choice Neighborhoods Initiative',agency:'HUD',category:'Housing',min:500000,max:50000000,deadline:'2026-03-31',keywords:['neighborhood','distressed housing','public housing','revitalization'],url:'https://www.hud.gov/program_offices/public_indian_housing/programs/ph/cn'},
    // Environment & Climate
    {name:'Climate Pollution Reduction Grant',agency:'EPA',category:'Environment',min:250000,max:5000000,deadline:'2026-07-01',keywords:['climate','emissions','pollution','carbon','greenhouse','sustainability'],url:'https://www.epa.gov/inflation-reduction-act/climate-pollution-reduction-grants'},
    {name:'Environmental Justice Collaborative',agency:'EPA',category:'Environment',min:50000,max:500000,deadline:'2026-05-01',keywords:['environmental justice','community','pollution','health','equity'],url:'https://www.epa.gov/environmentaljustice'},
    {name:'Land & Water Conservation Fund',agency:'Dept. of Interior',category:'Parks',min:50000,max:750000,deadline:'2026-03-01',keywords:['parks','recreation','land','conservation','trail','green space'],url:'https://www.nps.gov/subjects/lwcf/index.htm'},
    // Technology & Innovation
    {name:'Smart City Technology Initiative',agency:'Dept. of Commerce',category:'Technology',min:250000,max:2500000,deadline:'2026-06-01',keywords:['smart city','technology','IoT','broadband','digital','innovation'],url:'https://www.nist.gov/tpo/grants-and-funding'},
    {name:'BroadbandUSA Infrastructure Grant',agency:'NTIA',category:'Technology',min:100000,max:10000000,deadline:'2026-06-30',keywords:['broadband','internet','connectivity','digital divide','fiber'],url:'https://broadbandusa.ntia.doc.gov'},
    {name:'E-Rate Connectivity Program',agency:'FCC',category:'Technology',min:10000,max:5000000,deadline:'2026-02-28',keywords:['e-rate','school','library','internet','network','connectivity'],url:'https://www.usac.org/e-rate/'},
    // Education & Workforce
    {name:'Title I Education Supplement',agency:'Dept. of Education',category:'Education',min:50000,max:500000,deadline:'2026-09-01',keywords:['education','school','Title I','low income','students','literacy'],url:'https://www2.ed.gov/programs/titleiparta/index.html'},
    {name:'21st Century Community Learning Centers',agency:'Dept. of Education',category:'Education',min:50000,max:500000,deadline:'2026-06-01',keywords:['after school','community learning','youth','academic','enrichment'],url:'https://www2.ed.gov/programs/21stcclc/index.html'},
    {name:'Workforce Innovation & Opportunity Act',agency:'Dept. of Labor',category:'Workforce',min:100000,max:2000000,deadline:'2026-08-01',keywords:['workforce','job training','employment','skills','WIOA','career'],url:'https://www.dol.gov/agencies/eta/wioa'},
    // Public Health
    {name:'CDC Healthy Communities Program',agency:'CDC / HHS',category:'Public Health',min:100000,max:1000000,deadline:'2026-05-15',keywords:['public health','community health','disease','prevention','wellness'],url:'https://www.cdc.gov/nccdphp/dnpao/state-local-programs/index.html'},
    {name:'HRSA Rural Health Grant',agency:'HHS / HRSA',category:'Public Health',min:50000,max:750000,deadline:'2026-07-01',keywords:['rural health','healthcare','clinic','health services','rural'],url:'https://www.hrsa.gov/grants/find-funding'},
    // Historic Preservation & Arts
    {name:'Historic Preservation Fund',agency:'Dept. of Interior',category:'Historic',min:50000,max:750000,deadline:'2026-05-01',keywords:['historic','preservation','heritage','building','restoration','landmark'],url:'https://www.nps.gov/subjects/historicpreservation/index.htm'},
    {name:'National Endowment for the Arts',agency:'NEA',category:'Arts',min:10000,max:100000,deadline:'2026-02-12',keywords:['arts','culture','arts program','public art','music','theater'],url:'https://www.arts.gov/grants'},
    // Emergency Management
    {name:'HMGP Hazard Mitigation Grant',agency:'FEMA',category:'Public Safety',min:100000,max:3000000,deadline:'2026-06-30',keywords:['flood','hurricane','wildfire','disaster','mitigation','emergency management'],url:'https://www.fema.gov/grants/mitigation/hazard-mitigation'},
];

// Shorthand for auto-match suggestions (subset most applicable to common municipal gaps)
const GRANT_TEMPLATES = GRANT_LIBRARY.slice(0, 8);

// Client-side fuzzy search against the full library
const searchGrantLibrary = (query) => {
    if (!query || !query.trim()) return [];
    const q = query.toLowerCase().trim();
    const tokens = q.split(/\s+/);
    const scored = GRANT_LIBRARY.map(g => {
        const text = [g.name, g.agency, g.category, ...(g.keywords||[])].join(' ').toLowerCase();
        let score = 0;
        tokens.forEach(t => {
            if (g.name.toLowerCase().includes(t)) score += 10;
            else if (g.agency.toLowerCase().includes(t)) score += 5;
            else if (g.category.toLowerCase().includes(t)) score += 7;
            else if ((g.keywords||[]).some(k => k.includes(t))) score += 6;
            else if (text.includes(t)) score += 1;
        });
        return { ...g, _score: score };
    });
    return scored.filter(g => g._score > 0).sort((a, b) => b._score - a._score);
};

// Author identity is resolved from window.GOVSIGHT_USER, injected server-side
// from the authenticated Streamlit session. No manual name entry required.
function CollabSidebar({ annotations, setAnnotations, currentTab, scenarioName }) {
    const [open, setOpen] = useState(false);
    const [text, setText] = useState('');

    // Resolve the logged-in user's display name from the server-injected global.
    // Falls back gracefully if the planner is ever opened outside Streamlit.
    const gsUser = (typeof window !== 'undefined' && window.GOVSIGHT_USER) || {};
    const authorName = gsUser.name || 'Anonymous';
    const authorRole = gsUser.role || '';

    const add = () => {
        if (!text.trim()) return;
        const ann = {
            id: genId(),
            target: currentTab,
            authorName,
            authorRole,
            text: text.trim(),
            timestamp: new Date().toISOString(),
        };
        setAnnotations(prev => [...prev, ann]);
        setText('');
    };

    const remove = (id) => setAnnotations(prev => prev.filter(a => a.id !== id));

    const TAB_LABELS = {scenario:'Scenario',revenue:'Revenue',expenses:'Expenses & Analytics',comparison:'Comparison',whatif:'What-If',legislative:'Legislative',montecarlo:'Monte Carlo'};

    // Capitalise first letter of role for display (e.g. "admin" → "Admin")
    const fmtRole = (r) => r ? r.charAt(0).toUpperCase() + r.slice(1) : '';

    return (
        <>
            <button className="collab-toggle" onClick={() => setOpen(o => !o)}>
                Notes {annotations.length > 0 ? `[${annotations.length}]` : ''}
            </button>
            <div className={`collab-sidebar ${open ? 'open' : ''}`}>
                <div className="collab-header">
                    <span>Collaboration Notes</span>
                    <button className="collab-close" onClick={() => setOpen(false)}>Close</button>
                </div>
                {scenarioName && (
                    <div style={{padding:'6px 14px',background:'#f0f4f8',borderBottom:'1px solid #e0e4e8',fontSize:11,color:'#555'}}>
                        Scenario: <strong>{scenarioName}</strong>
                    </div>
                )}
                <div className="collab-body">
                    {annotations.length === 0 && (
                        <p style={{color:'#aaa',fontSize:13,textAlign:'center',marginTop:20}}>No notes yet. Add the first one below.</p>
                    )}
                    {annotations.slice().reverse().map(a => (
                        <div key={a.id} className="ann-item">
                            <div className="ann-meta">
                                <span>
                                    <strong>{a.authorName}</strong>
                                    {a.authorRole && <span style={{marginLeft:5,fontSize:10,background:'#e8eaf6',color:'#3949ab',padding:'1px 5px',borderRadius:3,verticalAlign:'middle'}}>{fmtRole(a.authorRole)}</span>}
                                    {' '}&bull;{' '}{timeAgo(a.timestamp)}
                                </span>
                                <button className="ann-remove" onClick={() => remove(a.id)}>remove</button>
                            </div>
                            {TAB_LABELS[a.target] && (
                                <div style={{marginBottom:4}}><span className="ann-target">{TAB_LABELS[a.target]}</span></div>
                            )}
                            <div style={{fontSize:13}}>{a.text}</div>
                        </div>
                    ))}
                </div>
                <div className="collab-add">
                    {/* Identity badge — shows the server-authenticated user, not a free-text field */}
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8,padding:'6px 8px',background:'#f5f5f5',borderRadius:4,border:'1px solid #e0e0e0'}}>
                        <div style={{width:28,height:28,borderRadius:'50%',background:'#1565c0',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,flexShrink:0}}>
                            {authorName.charAt(0)}

                        <div style={{lineHeight:1.3}}>

                    </div>
                    <div style={{marginBottom:6}}>
                        <textarea value={text} onChange={e => setText(e.target.value)}
                            placeholder={`Add a note about ${TAB_LABELS[currentTab] || 'this section'}...`}
                            rows={3} style={{width:'100%',padding:'5px 8px',border:'1px solid #ddd',borderRadius:4,fontSize:12,resize:'vertical'}} />
                    </div>
                    <button className="btn btn-primary" onClick={add} style={{width:'100%',fontSize:12}}>Add Note</button>
                </div>
            </div>
        </>
    );
}

// TAB 1 — SCENARIO (project setup + funding sources)
// ════════════════════════════════════════════════════════════════════════════
function ScenarioTab({ scenario, setScenario, fundingSources, setFundingSources, expenses, setExpenses, onSave, onLoad, onDelete, onNew, savedScenarios, saveMsg, adjExpenseTotal=0, adjContingencyPct=10 }) {
    const chartRef = useRef(null);
    const chartInst = useRef(null);

    useEffect(() => { drawChart(); }, [fundingSources]);

    const addSrc = () => setFundingSources(p => [...p, {id:genId(),type:'tax',description:'',amount:0}]);
    const updateSrc = (id,f,v) => setFundingSources(p => p.map(s => s.id===id ? {...s,[f]:f==='amount'?(parseFloat(v)||0):v} : s));
    const removeSrc = (id) => setFundingSources(p => p.filter(s => s.id!==id));

    const drawChart = () => {
        if (!chartRef.current) return;
        const ctx = chartRef.current.getContext('2d');
        if (chartInst.current) chartInst.current.destroy();
        const grouped = fundingSources.reduce((acc,s) => { acc[s.type]=(acc[s.type]||0)+s.amount; return acc; }, {});
        if (!Object.keys(grouped).length) return;
        const TYPE_COLORS = {tax:'#1976d2',grant:'#2e7d32',bond:'#ff9800',private:'#9c27b0',reallocation:'#0097a7',other:'#607d8b'};
        chartInst.current = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: Object.keys(grouped).map(t => ({tax:'Tax Revenue',grant:'Grant',bond:'Bond',private:'Private',reallocation:'Dept. Reallocation',other:'Other'})[t]||t),
                datasets: [{data:Object.values(grouped), backgroundColor:Object.keys(grouped).map(t=>TYPE_COLORS[t]||'#90a4ae')}]
            },
            options: { responsive:true, maintainAspectRatio:false, plugins: { legend:{position:'right'}, tooltip:{callbacks:{label:c=>`${c.label}: ${fc(c.parsed)}`}} } }
        });
    };

    const [showSaved, setShowSaved] = useState(false);

    const totalRevenue = fundingSources.reduce((s,f) => s+(f.amount||0), 0);
    const totalExpenses = (expenses||[]).reduce((s,e) => s+(parseFloat(e.amount)||0), 0);
    // Use the contingency-adjusted total from the Expenses & Analytics tab when available.
    // adjExpenseTotal is 0 until the user visits that tab for the first time.
    const hasContingency = adjExpenseTotal > 0 && adjExpenseTotal > totalExpenses;
    const contingencyAmt = hasContingency ? adjExpenseTotal - totalExpenses : 0;
    const effectiveCost  = hasContingency ? adjExpenseTotal : totalExpenses;
    const netPosition    = totalRevenue - effectiveCost;

    return (
        <div>
            <h2>Scenario Setup</h2>
            <p className="page-desc">Define your project and configure funding sources. Grants and reallocations added from the Revenue tab appear here automatically. This page is your scenario summary.</p>

            <div className="grid-2" style={{marginBottom:18}}>
                <div className="card">
                    <div className="card-header">Project Information</div>
                    <div className="card-body">
                        <div className="form-group"><label>Project Name</label><input type="text" value={scenario.name} placeholder="e.g., Water Treatment Facility Upgrade" onChange={e=>setScenario({...scenario,name:e.target.value})} /></div>
                        <div className="form-group"><label>Description</label><textarea value={scenario.description} placeholder="Describe the project objectives..." rows={3} onChange={e=>setScenario({...scenario,description:e.target.value})} /></div>
                        <div className="form-group"><label>Project Duration (Years)</label><input type="number" min={1} max={10} value={scenario.years} onChange={e=>setScenario({...scenario,years:parseInt(e.target.value)||5})} /></div>

                        {/* Summary totals — live-synced from Revenue and Expenses tabs */}
                        <div style={{borderTop:'1px solid #eee',paddingTop:14,marginTop:6}}>
                            <div style={{display:'flex',gap:10}}>
                                <div style={{flex:1,padding:'10px 12px',background:'#e8f5e9',borderRadius:6,border:'1px solid #c8e6c9'}}>
                                    <div style={{fontSize:11,color:'#555',marginBottom:2}}>Total Revenue</div>
                                    <div style={{fontWeight:700,fontSize:17,color:'#2e7d32'}}>{fc(totalRevenue)}</div>
                                    <div style={{fontSize:10,color:'#888'}}>{fundingSources.length} source{fundingSources.length!==1?'s':''}</div>
                                </div>
                                <div style={{flex:1,padding:'10px 12px',background:'#fce4ec',borderRadius:6,border:'1px solid #f8bbd0'}}>
                                    <div style={{fontSize:11,color:'#555',marginBottom:2}}>
                                        {hasContingency ? 'Total Required' : 'Total Expenses'}
                                    </div>
                                    <div style={{fontWeight:700,fontSize:17,color:'#c62828'}}>{fc(effectiveCost)}</div>
                                    {hasContingency ? (
                                        <div style={{fontSize:10,color:'#888',lineHeight:1.5}}>
                                            Base: {fc(totalExpenses)}<br/>
                                            + {adjContingencyPct}% contingency: {fc(contingencyAmt)}
                                        </div>
                                    ) : (
                                        <div style={{fontSize:10,color:'#888'}}>
                                            {(expenses||[]).length} line item{(expenses||[]).length!==1?'s':''}
                                            {(expenses||[]).length > 0 && <span style={{display:'block',color:'#aaa',fontStyle:'italic'}}>Visit Expenses tab to include contingency</span>}
                                        </div>
                                    )}
                                </div>
                                <div style={{flex:1,padding:'10px 12px',background:netPosition>=0?'#e3f2fd':'#fff3e0',borderRadius:6,border:`1px solid ${netPosition>=0?'#bbdefb':'#ffe0b2'}`}}>
                                    <div style={{fontSize:11,color:'#555',marginBottom:2}}>Net Position</div>
                                    <div style={{fontWeight:700,fontSize:17,color:netPosition>=0?'#1565c0':'#e65100'}}>{netPosition>=0?'+':''}{fc(netPosition)}</div>
                                    <div style={{fontSize:10,color:netPosition>=0?'#888':'#bf360c',fontWeight:netPosition<0?600:400}}>
                                        {netPosition>=0?'Surplus':'Funding Gap'}
                                        {hasContingency && <span style={{display:'block',fontWeight:400,color:'#aaa',fontStyle:'italic'}}>incl. {adjContingencyPct}% contingency</span>}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div className="card">
                    <div className="card-header">Funding Mix</div>
                    <div className="card-body">
                        <div className="chart-box"><canvas ref={chartRef}></canvas></div>
                        {fundingSources.length > 0 && <div style={{textAlign:'center',marginTop:10,fontWeight:700,fontSize:18,color:'var(--primary)'}}>{fc(totalRevenue)} <span style={{fontSize:13,fontWeight:400,color:'#777'}}>total funding</span></div>}
                    </div>
                </div>
            </div>

            <div className="card">
                <div className="card-header">
                    Funding Sources
                    <button className="btn btn-primary btn-sm no-print" onClick={addSrc}>Add Source</button>
                </div>
                <div className="card-body">
                    {fundingSources.length === 0 && <div className="alert alert-info">No funding sources yet. Click "Add Source" to add manually, or use the "+" buttons in the Revenue tab to pull in grants and reallocations.</div>}
                    {fundingSources.map(s => (
                        <div key={s.id} className="funding-row">
                            <select value={s.type} onChange={e=>updateSrc(s.id,'type',e.target.value)}>
                                <option value="tax">Tax Revenue</option>
                                <option value="grant">Grant</option>
                                <option value="bond">Bond</option>
                                <option value="private">Private</option>
                                <option value="reallocation">Dept. Reallocation</option>
                                <option value="other">Other</option>
                            </select>
                            <input type="text" placeholder="Description" value={s.description} onChange={e=>updateSrc(s.id,'description',e.target.value)} />
                            <input type="number" placeholder="Amount" value={s.amount} onChange={e=>updateSrc(s.id,'amount',e.target.value)} />
                            <button className="btn btn-danger btn-sm" onClick={()=>removeSrc(s.id)}>Remove</button>
                        </div>
                    ))}
                </div>
            </div>

            {/* ── Save / Load / New ── */}
            <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',marginTop:4}}>
                <button className="btn btn-primary" onClick={onSave}>Save Scenario</button>
                <button className="btn btn-secondary" onClick={()=>setShowSaved(s=>!s)}>
                    {showSaved?'Hide':'Load'} Saved ({savedScenarios.length})
                </button>
                <button className="btn btn-secondary" onClick={()=>{
                    if((scenario.name||'').trim() || fundingSources.length > 1 || expenses.length > 0) {
                        if(!window.confirm('Start a new scenario? Any unsaved changes will be lost.')) return;
                    }
                    onNew();
                }}>New Scenario</button>
                {saveMsg && <span style={{fontSize:13,color:'#2e7d32',fontWeight:600}}>{saveMsg}</span>}
            </div>

            {showSaved && (
                <div className="card" style={{marginTop:16}}>
                    <div className="card-header">Saved Scenarios</div>
                    <div className="card-body">
                        {savedScenarios.length === 0 && <div className="alert alert-info" style={{marginBottom:0}}>No saved scenarios yet. Click "Save Scenario" to save your current work.</div>}
                        {savedScenarios.map(s => (
                            <div key={s.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',background:'#f9f9f9',borderRadius:6,border:'1px solid #e0e0e0',marginBottom:8}}>
                                <div style={{flex:1,minWidth:0}}>
                                    <div style={{fontWeight:600,fontSize:14}}>{s.name}</div>
                                    <div style={{fontSize:11,color:'#888'}}>
                                        Saved {new Date(s.savedAt).toLocaleString()} &bull;{' '}
                                        {fc((s.fundingSources||[]).reduce((t,f)=>t+(f.amount||0),0))} funding &bull;{' '}
                                        {(s.expenses||[]).length} expense item{(s.expenses||[]).length!==1?'s':''}
                                    </div>
                                </div>
                                <button className="btn btn-primary btn-sm" onClick={()=>{onLoad(s);setShowSaved(false);}}>Load</button>
                                <button className="btn btn-danger btn-sm" onClick={()=>onDelete(s.id)}>Delete</button>
                            </div>
                        ))}
                    </div>
                </div>
            )}
        </div>
    );
}

function GrantPipeline({ fundingGap, gapDetails, expenses, fundingSources, setFundingSources }) {
    const [pipeline, setPipeline] = useState(() => lsGet('gs_grants',[]));
    const [mappings, setMappings] = useState(() => lsGet('gs_grant_maps',{}));
    const [searchQuery, setSearchQuery] = useState('');
    const [searchResults, setSearchResults] = useState([]);
    const [searching, setSearching] = useState(false);
    const [searchError, setSearchError] = useState('');
    const [portalFilter, setPortalFilter] = useState('All Agencies');
    const [selectedState, setSelectedState] = useState('');
    const [showPortals, setShowPortals] = useState(false);

    // Add a grant directly to the Scenario tab's funding sources.
    // Checks by description to prevent duplicates.
    const addGrantToScenario = (name, agency, amount) => {
        const desc = `${name}${agency ? ' — ' + agency : ''}`;
        const alreadyAdded = (fundingSources||[]).some(s => s.description === desc && s.type === 'grant');
        if (alreadyAdded) return;
        setFundingSources(prev => [...prev, {id:genId(), type:'grant', description:desc, amount: parseFloat(amount)||0}]);
    };
    const grantInScenario = (name, agency) => {
        const desc = `${name}${agency ? ' — ' + agency : ''}`;
        return (fundingSources||[]).some(s => s.description === desc && s.type === 'grant');
    };

    useEffect(() => { lsSet('gs_grants', pipeline); }, [pipeline]);
    useEffect(() => { lsSet('gs_grant_maps', mappings); }, [mappings]);

    const STATUS = ['Researching','Applied','Awarded','Denied'];
    const S_BADGE = {Researching:'badge-gray',Applied:'badge-blue',Awarded:'badge-green',Denied:'badge-red'};

    const track = (g) => {
        const already = pipeline.some(p => p.name === g.name);
        if (already) return;
        setPipeline(p => [...p, {
            id:genId(), name:g.name, agency:g.agency||'', category:g.category||'Other',
            amount:g.min||g.amount||0, deadline:g.deadline||'', status:'Researching',
            addedAt:new Date().toISOString(), url:g.url||''
        }]);
    };

    const trackSearchResult = (r) => {
        const already = pipeline.some(p => p.name === r.name);
        if (already) return;
        setPipeline(p => [...p, {
            id:genId(), name:r.name, agency:r.agency||r.funder||'', category:r.category||'Other',
            amount:r.amount||r.max_amount||0, deadline:r.deadline||r.close_date||'',
            status:'Researching', addedAt:new Date().toISOString(), url:r.url||r.link||''
        }]);
    };

    const advance = (id) => setPipeline(p => p.map(g => g.id!==id?g : {...g, status: STATUS[Math.min(STATUS.indexOf(g.status)+1, STATUS.length-1)]}));
    const updateG = (id,f,v) => setPipeline(p => p.map(g => g.id!==id?g : {...g,[f]:f==='amount'?(parseFloat(v)||0):v}));
    const removeG = (id) => { setPipeline(p=>p.filter(g=>g.id!==id)); setMappings(m=>{const n={...m};delete n[id];return n;}); };

    const alerts = pipeline.filter(g => { const d=daysUntil(g.deadline); return d!==null&&d<=30; });
    const awarded = pipeline.filter(g => g.status==='Awarded');

    const runSearch = async () => {
        if (!searchQuery.trim()) return;
        setSearching(true); setSearchError(''); setSearchResults([]);

        // Step 1: immediate client-side search against built-in library (always works)
        const localResults = searchGrantLibrary(searchQuery);
        setSearchResults(localResults);

        // Step 2: try API in background, merge any additional results
        try {
            const r = await Promise.race([
                api.searchGrants(searchQuery),
                new Promise((_,rej) => setTimeout(()=>rej(new Error('timeout')),4000))
            ]);
            const apiGrants = (r.grants||r.results||[]).map(g => ({
                ...g, name:g.name||g.title, _fromApi:true
            }));
            // Merge: add API results not already present in local results
            const localNames = new Set(localResults.map(g=>g.name.toLowerCase()));
            const newFromApi = apiGrants.filter(g => !localNames.has((g.name||'').toLowerCase()));
            if (newFromApi.length) setSearchResults(prev => [...prev, ...newFromApi]);
        } catch {
            // API unavailable — local results already shown, no error needed
        }

        setSearching(false);
    };

    const filteredPortals = portalFilter==='All Agencies' ? FEDERAL_PORTALS : FEDERAL_PORTALS.filter(p=>p.category===portalFilter);
    const portalCategories = ['All Agencies',...Array.from(new Set(FEDERAL_PORTALS.map(p=>p.category)))];

    return (
        <div>
            {alerts.length > 0 && alerts.map(g => {
                const d = daysUntil(g.deadline);
                return <div key={g.id} className={`alert ${d<0?'alert-danger':'alert-warning'}`}>
                    <strong>{d<0?'OVERDUE':'Deadline soon'}</strong> — {g.name}: {new Date(g.deadline).toLocaleDateString()} {d>=0&&`(${d} days)`}
                </div>;
            })}

            {/* ── Grant Search ── */}
            <div className="card" style={{marginBottom:18}}>
                <div className="card-header">
                    Grant Search
                    <button className="btn btn-secondary btn-sm" onClick={()=>setShowPortals(p=>!p)}>{showPortals?'Hide':'Show'} External Portals</button>
                </div>
                <div className="card-body">
                    <div style={{display:'flex',gap:10,marginBottom:10}}>
                        <input type="text" value={searchQuery} onChange={e=>setSearchQuery(e.target.value)}
                            onKeyDown={e=>e.key==='Enter'&&runSearch()}
                            placeholder="Search by keyword, agency, or category — e.g. infrastructure, public safety, water..."
                            style={{flex:1}} />
                        <button className="btn btn-primary" onClick={runSearch} disabled={searching||!searchQuery.trim()}>
                            {searching?'Searching...':'Search'}{searching&&<span className="loading"></span>}
                        </button>
                        {searchQuery.trim()&&<a href={`https://www.grants.gov/search-grants?keywords=${encodeURIComponent(searchQuery)}`} target="_blank" rel="noopener noreferrer" className="btn btn-secondary" title="Search this query directly on Grants.gov">Search Grants.gov</a>}
                    </div>

                    {searchResults.length > 0 && (
                        <div style={{marginBottom:14}}>
                            <div style={{fontSize:13,fontWeight:600,color:'#555',marginBottom:8}}>
                                {searchResults.length} result{searchResults.length!==1?'s':''} found
                                {searching&&<span style={{fontWeight:400,color:'#888',marginLeft:8}}>— checking API for more...</span>}
                            </div>
                            {searchResults.map((r,i) => {
                                const already = pipeline.some(p=>p.name===r.name);
                                const amountDisplay = r.max ? `${fc(r.min||0)} – ${fc(r.max)}` : r.amount ? `Up to ${fc(r.amount)}` : null;
                                return (
                                    <div key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 12px',border:'1px solid #e3f2fd',borderRadius:6,marginBottom:7,background:'#fafeff'}}>
                                        <div style={{flex:1,minWidth:0}}>
                                            <div style={{fontWeight:600,fontSize:13}}>{r.name||r.title}</div>
                                            <div style={{fontSize:11,color:'#777',marginTop:1}}>{r.agency||r.funder} {r.category&&<span className="badge badge-blue" style={{marginLeft:4}}>{r.category}</span>}</div>
                                            {amountDisplay&&<div style={{fontSize:11,color:'#2e7d32',marginTop:2}}>{amountDisplay}</div>}
                                            {(r.deadline||r.close_date)&&<div style={{fontSize:11,color:'#888'}}>Deadline: {r.deadline||r.close_date}</div>}
                                        </div>
                                        <div style={{display:'flex',gap:6,flexShrink:0}}>
                                            {(r.url||r.link)&&<a href={r.url||r.link} target="_blank" rel="noopener noreferrer" className="btn btn-secondary btn-sm">View</a>}
                                            <button className={`btn btn-sm ${already?'btn-secondary':'btn-primary'}`} disabled={already} onClick={()=>trackSearchResult(r)}>{already?'Tracking':'Track Grant'}</button>
                                            {(() => { const inScenario = grantInScenario(r.name||r.title, r.agency||r.funder); return (
                                                <button className={`btn btn-sm ${inScenario?'btn-secondary':'btn-success'}`} disabled={inScenario} title="Add to Scenario funding sources" onClick={()=>addGrantToScenario(r.name||r.title, r.agency||r.funder, r.max||r.amount||0)} style={{minWidth:28,fontWeight:700}}>
                                                    {inScenario ? 'Added' : '+'}
                                                </button>
                                            ); })()}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                    {!searching && searchQuery.trim() && searchResults.length===0 && (
                        <div className="alert alert-info">No matches found in the built-in library for "{searchQuery}". Try broader terms, or use the <a href={`https://www.grants.gov/search-grants?keywords=${encodeURIComponent(searchQuery)}`} target="_blank" rel="noopener noreferrer">Grants.gov search</a> to find additional programs.
                        </div>
                    )}

                    {showPortals && (
                        <div style={{borderTop:'1px solid #eee',paddingTop:16}}>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
                                <strong style={{fontSize:14}}>Federal Grant Portals</strong>
                                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                                    {portalCategories.map(cat=>(
                                        <button key={cat} className={`btn btn-sm ${portalFilter===cat?'btn-primary':'btn-secondary'}`} onClick={()=>setPortalFilter(cat)}>{cat}</button>
                                    ))}
                                </div>
                            </div>
                            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:10,marginBottom:18}}>
                                {filteredPortals.map((p,i) => (
                                    <div key={i} style={{border:'1px solid #e0e0e0',borderRadius:6,padding:'10px 12px',background:'#fafafa',display:'flex',flexDirection:'column',gap:5}}>
                                        <div style={{fontWeight:600,fontSize:13}}>{p.name}</div>
                                        <div style={{fontSize:11,color:'#777',flex:1}}>{p.desc}</div>
                                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                                            <span className="badge badge-blue">{p.category}</span>
                                            <a href={p.url} target="_blank" rel="noopener noreferrer" className="btn btn-primary btn-sm">Open Portal</a>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div style={{borderTop:'1px solid #eee',paddingTop:14}}>
                                <strong style={{fontSize:14}}>State Grant Portals</strong>
                                <p style={{fontSize:12,color:'#888',margin:'6px 0 10px'}}>Select a state to open its official grant portal in a new tab.</p>
                                <div style={{display:'flex',gap:10,alignItems:'center'}}>
                                    <select value={selectedState} onChange={e=>setSelectedState(e.target.value)} style={{flex:1,padding:'7px 10px',border:'1px solid #ddd',borderRadius:4,fontSize:14}}>
                                        <option value="">-- Select a state --</option>
                                        {Object.keys(STATE_PORTALS).sort().map(s=><option key={s} value={s}>{s}</option>)}
                                    </select>
                                    <button className="btn btn-primary" disabled={!selectedState} onClick={()=>{ if(selectedState&&STATE_PORTALS[selectedState]) window.open(STATE_PORTALS[selectedState],'_blank'); }}>
                                        Open State Portal
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            </div>

            {/* ── Auto-suggested grants when gap detected ── */}
            {fundingGap && (
                <div className="card" style={{marginBottom:18}}>
                    <div className="card-header">
                        Auto-Matched Grants for Your Funding Gap
                        <span style={{fontSize:12,fontWeight:400,color:'#777'}}>Shortfall: {gapDetails.map(d=>`Yr ${d.year}: ${fc(d.shortfall)}`).join(', ')}</span>
                    </div>
                    <div className="card-body">
                        <p style={{fontSize:13,color:'#777',marginBottom:12}}>These grants were matched to your project's categories and funding gap. Click "Track Grant" to add any to your pipeline.</p>
                        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:12}}>
                            {GRANT_TEMPLATES.map((g,i) => {
                                const tracked = pipeline.some(p=>p.name===g.name);
                                const d = daysUntil(g.deadline);
                                return (
                                    <div key={i} style={{border:'1px solid #ddd',borderRadius:8,padding:12,background:'#fafafa'}}>
                                        <div style={{fontWeight:600,fontSize:13,marginBottom:3}}>{g.name}</div>
                                        <div style={{fontSize:11,color:'#777',marginBottom:6}}>{g.agency}</div>
                                        <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:8}}>
                                            <span className="badge badge-blue">{g.category}</span>
                                            <span style={{fontSize:11,color:'#444'}}>{fc(g.min)}–{fc(g.max)}</span>
                                            {d!==null&&<span style={{fontSize:11,color:d<30?'#e65100':'#888'}}>Due {new Date(g.deadline).toLocaleDateString()}</span>}
                                        </div>
                                        <div style={{display:'flex',gap:6}}>
                                            <button className={`btn btn-sm ${tracked?'btn-secondary':'btn-primary'}`} disabled={tracked} onClick={()=>track(g)}>{tracked?'Tracking':'Track Grant'}</button>
                                            {(() => { const inScenario = grantInScenario(g.name, g.agency); return (
                                                <button className={`btn btn-sm ${inScenario?'btn-secondary':'btn-success'}`} disabled={inScenario} title="Add to Scenario funding sources" onClick={()=>addGrantToScenario(g.name, g.agency, g.max||g.min||0)} style={{minWidth:28,fontWeight:700}}>
                                                    {inScenario ? 'Added' : '+'}
                                                </button>
                                            ); })()}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            )}

            {!fundingGap && <div className="alert alert-success">Project is currently fully funded. Auto-matched grants appear here when a funding gap is detected in Expenses &amp; Analytics.</div>}

            {/* ── Pipeline Tracker ── */}
            <div className="card" style={{marginBottom:18}}>
                <div className="card-header">
                    Pipeline Tracker ({pipeline.length} grants)
                    <button className="btn btn-secondary btn-sm" onClick={()=>track(GRANT_TEMPLATES[0])}>Add Sample</button>
                </div>
                {pipeline.length===0
                    ? <div style={{padding:18,color:'#999',fontSize:13,textAlign:'center'}}>No grants tracked yet. Use the search above, open a portal, or accept an auto-matched suggestion.</div>
                    : <div style={{padding:10}}>
                        {pipeline.map(g => {
                            const d = daysUntil(g.deadline);
                            return (
                                <div key={g.id} className="grant-row">
                                    <div style={{flex:1,minWidth:0}}>
                                        <div style={{fontWeight:600,fontSize:13}}>
                                            {g.url ? <a href={g.url} target="_blank" rel="noopener noreferrer" style={{color:'inherit',textDecoration:'none'}} title="Open grant page">{g.name}</a> : g.name}
                                        </div>
                                        <div style={{fontSize:11,color:'#777'}}>{g.agency} &bull; {g.category}</div>
                                        {g.deadline && <div style={{fontSize:11,color:d!==null&&d<0?'#c62828':d!==null&&d<30?'#e65100':'#888'}}>
                                            Deadline: {new Date(g.deadline).toLocaleDateString()} {d!==null&&d>=0&&`(${d}d)`} {d!==null&&d<0&&'OVERDUE'}
                                        </div>}
                                    </div>
                                    <input type="number" value={g.amount} onChange={e=>updateG(g.id,'amount',e.target.value)} style={{width:110,padding:'4px 8px',border:'1px solid #ddd',borderRadius:4,fontSize:12,textAlign:'right'}} />
                                    <span className={`badge ${S_BADGE[g.status]}`}>{g.status}</span>
                                    <button className="btn btn-secondary btn-sm" disabled={g.status==='Denied'||g.status==='Awarded'} onClick={()=>advance(g.id)}>Advance</button>
                                    {(() => { const inScenario = grantInScenario(g.name, g.agency); return (
                                        <button className={`btn btn-sm ${inScenario?'btn-secondary':'btn-success'}`} disabled={inScenario} title="Add to Scenario funding sources" onClick={()=>addGrantToScenario(g.name, g.agency, g.amount)} style={{minWidth:28,fontWeight:700}}>
                                            {inScenario ? 'Added' : '+'}
                                        </button>
                                    ); })()}
                                    <button className="btn btn-danger btn-sm" onClick={()=>removeG(g.id)}>Remove</button>
                                </div>
                            );
                        })}
                    </div>
                }
            </div>

            {/* ── Awarded grant → expense mapping ── */}
            {awarded.length > 0 && (
                <div className="card">
                    <div className="card-header">Awarded Grant — Budget Mapping</div>
                    <div className="card-body">
                        <p style={{fontSize:13,color:'#777',marginBottom:12}}>Assign each awarded grant to a specific expense line item.</p>
                        {awarded.map(g => (
                            <div key={g.id} style={{display:'flex',alignItems:'center',gap:12,padding:10,background:'#f9f9f9',borderRadius:6,marginBottom:8,border:'1px solid #e8f5e9'}}>
                                <div style={{flex:1}}>
                                    <span className="badge badge-green" style={{marginRight:6}}>Awarded</span>
                                    <strong style={{fontSize:13}}>{g.name}</strong>
                                    <span style={{marginLeft:8,color:'#1565c0',fontWeight:600}}>{fc(g.amount)}</span>
                                </div>
                                <select value={mappings[g.id]||''} onChange={e=>setMappings(m=>({...m,[g.id]:e.target.value}))} style={{padding:'4px 8px',border:'1px solid #ddd',borderRadius:4,fontSize:12}}>
                                    <option value="">-- Assign to expense --</option>
                                    {expenses.map(exp => <option key={exp.id} value={exp.id}>Yr {exp.year}: {exp.label||exp.category} ({fc(exp.amount)})</option>)}
                                </select>
                                {mappings[g.id] && <span className="badge badge-green">Mapped</span>}
                            </div>
                        ))}
                    </div>
                </div>
            )}
        </div>
    );
}

function DeptReallocation({ fundingGap, fundingSources, setFundingSources }) {
    const [depts, setDepts] = useState(SAMPLE_DEPTS);
    const [safetyFloor, setSafetyFloor] = useState(85);
    const [targetAmount, setTargetAmount] = useState(0);

    // Add a dept reallocation amount to the Scenario funding sources.
    const addReallocToScenario = (deptName, amount) => {
        const desc = `${deptName} Budget Reallocation`;
        const already = (fundingSources||[]).some(s => s.description === desc && s.type === 'reallocation');
        if (already) return;
        setFundingSources(prev => [...prev, {id:genId(), type:'reallocation', description:desc, amount}]);
    };
    const reallocInScenario = (deptName) => {
        const desc = `${deptName} Budget Reallocation`;
        return (fundingSources||[]).some(s => s.description === desc && s.type === 'reallocation');
    };

    const computeRealloc = (dept) => {
        const variance = dept.budget - dept.actual;            // unspent budget (the pool to draw from)
        const maxRealloc = dept.budget * (1 - safetyFloor / 100); // cap = (100-floor)% of total budget
        return Math.max(0, Math.min(variance, maxRealloc));
    };

    const totalAvailable = depts.reduce((s,d) => s+computeRealloc(d), 0);
    const recomDepts = depts.filter(d => computeRealloc(d) > 0).sort((a,b)=>computeRealloc(b)-computeRealloc(a));

    return (
        <div>
            <div className="alert alert-info">
                The reallocation scanner analyzes actual spend versus budgeted amounts across departments. It identifies where budget headroom exists and suggests safe reallocation amounts without starving any department below its operational floor.
            </div>

            <div className="grid-2" style={{marginBottom:18}}>
                <div className="card">
                    <div className="card-header">Reallocation Parameters</div>
                    <div className="card-body">
                        <div className="form-group">
                            <label>Safety Floor — minimum % of budget a dept must retain: <strong>{safetyFloor}%</strong></label>
                            <div className="slider-row">
                                <input type="range" min={70} max={100} value={safetyFloor} onChange={e=>setSafetyFloor(+e.target.value)} />
                                <span className="slider-val">{safetyFloor}%</span>
                            </div>
                            <div style={{fontSize:12,color:'#888',marginTop:4}}>At {safetyFloor}%, each department can contribute at most {100-safetyFloor}% of its total budget. Departments with more unspent budget are ranked first.</div>
                        </div>
                        {fundingGap && (
                            <div className="form-group">
                                <label>Funding gap to close</label>
                                <input type="number" value={targetAmount} min={0} onChange={e=>setTargetAmount(parseFloat(e.target.value)||0)} />
                            </div>
                        )}
                    </div>
                </div>
                <div>
                    <div className="grid-2" style={{marginBottom:12}}>
                        <div className="stat-card">
                            <div className="stat-value" style={{color:'#2e7d32'}}>{fc(totalAvailable)}</div>
                            <div className="stat-label">Total Realloc. Potential</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-value">{recomDepts.length}</div>
                            <div className="stat-label">Depts with Headroom</div>
                        </div>
                    </div>
                    {fundingGap && targetAmount > 0 && (
                        <div className={`alert ${totalAvailable >= targetAmount ? 'alert-success' : 'alert-warning'}`}>
                            {totalAvailable >= targetAmount
                                ? `Reallocation can fully cover the ${fc(targetAmount)} target. Surplus available: ${fc(totalAvailable-targetAmount)}.`
                                : `Reallocation covers ${fc(totalAvailable)} of the ${fc(targetAmount)} target. Remaining gap: ${fc(targetAmount-totalAvailable)}.`}
                        </div>
                    )}
                </div>
            </div>

            <div className="card" style={{marginBottom:18}}>
                <div className="card-header">Budget vs. Actuals — All Departments</div>
                <div style={{overflowX:'auto'}}>
                    <table>
                        <thead>
                            <tr>
                                <th>Department</th>
                                <th style={{textAlign:'right'}}>Approved Budget</th>
                                <th style={{textAlign:'right'}}>Current Actual</th>
                                <th style={{textAlign:'right'}}>Variance</th>
                                <th style={{textAlign:'right'}}>% Utilized</th>
                                <th>Utilization</th>
                                <th style={{textAlign:'right'}} title={`Maximum each dept can give = ${100-safetyFloor}% of their budget`}>Max Contribution ({100-safetyFloor}%)</th>
                                <th style={{textAlign:'right'}}>Realloc. Available</th>
                            </tr>
                        </thead>
                        <tbody>
                            {depts.map(dept => {
                                const variance = dept.budget - dept.actual;
                                const utilized = (dept.actual / dept.budget) * 100;
                                const maxContrib = dept.budget * (1 - safetyFloor / 100);
                                const avail = computeRealloc(dept);
                                const barColor = utilized > 95 ? '#f44336' : utilized > 80 ? '#ff9800' : '#4caf50';
                                return (
                                    <tr key={dept.id}>
                                        <td><strong>{dept.name}</strong></td>
                                        <td style={{textAlign:'right'}}>{fc(dept.budget)}</td>
                                        <td style={{textAlign:'right'}}>{fc(dept.actual)}</td>
                                        <td style={{textAlign:'right',color:variance>0?'#2e7d32':'#c62828'}}>{variance>0?'+':''}{fc(variance)}</td>
                                        <td style={{textAlign:'right'}}>{fp(utilized)}</td>
                                        <td style={{minWidth:120}}>
                                            <div className="realloc-bar-track">
                                                <div className="realloc-bar-fill" style={{width:`${Math.min(utilized,100)}%`,background:barColor}} />
                                            </div>
                                        </td>
                                        <td style={{textAlign:'right',color:'#999'}}>{fc(maxContrib)}</td>
                                        <td style={{textAlign:'right',fontWeight:avail>0?700:400,color:avail>0?'#1565c0':'#999'}}>
                                            {avail>0 ? fc(avail) : '—'}
                                        </td>
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            </div>

            {recomDepts.length > 0 && (
                <div className="card">
                    <div className="card-header">Reallocation Recommendations</div>
                    <div className="card-body">
                        <p style={{fontSize:13,color:'#777',marginBottom:14}}>These departments have budget headroom above the {safetyFloor}% safety floor. Listed from highest to lowest available capacity.</p>
                        {recomDepts.map((dept,i) => {
                            const avail = computeRealloc(dept);
                            const pct = (avail / totalAvailable * 100).toFixed(0);
                            const inScenario = reallocInScenario(dept.name);
                            return (
                                <div key={dept.id} style={{display:'flex',alignItems:'center',gap:14,marginBottom:12,padding:'10px 14px',background:'#f0f7ff',borderRadius:6,border:`1px solid ${inScenario?'#a5d6a7':'#bbdefb'}`}}>
                                    <div style={{width:22,height:22,background:'#1976d2',borderRadius:'50%',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,flexShrink:0}}>{i+1}</div>
                                    <div style={{flex:1}}>
                                        <div style={{fontWeight:600,fontSize:13}}>{dept.name}</div>
                                        <div style={{fontSize:11,color:'#777'}}>Actual {fc(dept.actual)} of {fc(dept.budget)} budget ({fp(dept.actual/dept.budget*100)} utilized)</div>
                                    </div>
                                    <div style={{textAlign:'right',marginRight:4}}>
                                        <div style={{fontWeight:700,color:'#1565c0',fontSize:16}}>{fc(avail)}</div>
                                        <div style={{fontSize:11,color:'#888'}}>{pct}% of potential</div>
                                    </div>
                                    <button
                                        className={`btn btn-sm ${inScenario?'btn-secondary':'btn-success'}`}
                                        disabled={inScenario}
                                        title={inScenario ? 'Already in Scenario' : 'Add reallocation to Scenario funding sources'}
                                        onClick={() => addReallocToScenario(dept.name, avail)}
                                        style={{minWidth:36,fontWeight:700,flexShrink:0}}
                                    >
                                        {inScenario ? 'Added' : '+'}
                                    </button>
                                </div>
                            );
                        })}
                    </div>
                </div>
            )}
        </div>
    );
}

// TAB 3 — EXPENSES & ANALYTICS
