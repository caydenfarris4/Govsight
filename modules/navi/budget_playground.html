<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Budget Playground — GovSight</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:13px;background:#f0f2f5;color:#1a1a2e;}
#root{padding:0;}
/* ── Layout ── */
.app-shell{display:flex;flex-direction:column;min-height:100vh;}
.top-bar{background:#1565c0;color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100;}
.top-bar h1{font-size:16px;font-weight:700;letter-spacing:.3px;}
.top-bar .tagline{font-size:11px;opacity:.8;margin-top:2px;}
.scenario-selector{display:flex;align-items:center;gap:8px;font-size:12px;}
.scenario-selector select{padding:4px 10px;border-radius:4px;border:none;font-size:12px;background:#fff;color:#1a1a2e;cursor:pointer;}
.dirty-badge{background:#ff7043;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.6;}}
/* ── Tabs ── */
.tab-bar{background:#fff;border-bottom:2px solid #e0e0e0;display:flex;gap:0;overflow-x:auto;padding:0 20px;}
.tab-btn{padding:11px 18px;font-size:13px;font-weight:500;color:#555;border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s;}
.tab-btn:hover{color:#1565c0;}
.tab-btn.active{color:#1565c0;border-bottom-color:#1565c0;font-weight:700;}
.tab-content{padding:20px;}
/* ── Cards ── */
.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:16px;}
.card-header{padding:12px 16px;border-bottom:1px solid #f0f0f0;font-weight:700;font-size:13px;color:#1565c0;display:flex;justify-content:space-between;align-items:center;}
.card-body{padding:16px;}
/* ── Buttons ── */
.btn{padding:7px 16px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;transition:background .15s;}
.btn-primary{background:#1565c0;color:#fff;}.btn-primary:hover{background:#0d47a1;}
.btn-success{background:#2e7d32;color:#fff;}.btn-success:hover{background:#1b5e20;}
.btn-warning{background:#e65100;color:#fff;}.btn-warning:hover{background:#bf360c;}
.btn-secondary{background:#e8eaf6;color:#1565c0;}.btn-secondary:hover{background:#c5cae9;}
.btn-danger{background:#c62828;color:#fff;}.btn-danger:hover{background:#b71c1c;}
.btn-sm{padding:4px 10px;font-size:11px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
/* ── Forms ── */
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-weight:600;font-size:11px;color:#555;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;}
input[type=text],input[type=number],select,textarea{width:100%;padding:7px 10px;border:1px solid #ddd;border-radius:4px;font-size:13px;color:#1a1a2e;}
textarea{min-height:70px;resize:vertical;}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1565c0;box-shadow:0 0 0 2px rgba(21,101,192,.15);}
/* ── Spreadsheet ── */
.spreadsheet-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:#e8eaf6;color:#1565c0;font-weight:700;padding:8px 10px;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:5;}
th.right,td.right{text-align:right;}
td{padding:5px 8px;border-bottom:1px solid #f5f5f5;vertical-align:middle;}
tr:hover td{background:#f9faff;}
tr.dept-header td{background:#e3f2fd;font-weight:700;color:#0d47a1;font-size:12px;cursor:pointer;}
tr.dept-header td:hover{background:#bbdefb;}
tr.subtotal-row td{background:#fafafa;font-weight:700;border-top:2px solid #e0e0e0;}
/* Editable cell inputs */
.cell-input{width:100%;padding:3px 6px;border:1px solid transparent;border-radius:3px;font-size:12px;background:transparent;text-align:right;}
.cell-input:focus{border-color:#1565c0;background:#fff;box-shadow:0 0 0 2px rgba(21,101,192,.12);}
.cell-input.dirty{background:#fff9c4;border-color:#f9a825;}
.cell-note{width:100%;padding:3px 6px;border:1px solid transparent;border-radius:3px;font-size:11px;background:transparent;}
.cell-note:focus{border-color:#1565c0;background:#fff;}
/* Variance coloring */
.pos{color:#2e7d32;font-weight:600;}
.neg{color:#c62828;font-weight:600;}
/* Footer totals */
.footer-totals{background:#e8eaf6;border-radius:6px;padding:12px 16px;display:flex;gap:24px;flex-wrap:wrap;margin-top:12px;}
.footer-stat{text-align:center;}
.footer-stat .label{font-size:10px;color:#666;text-transform:uppercase;font-weight:700;letter-spacing:.5px;}
.footer-stat .value{font-size:18px;font-weight:800;margin-top:2px;}
/* ── Stats ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px;}
.stat-card{background:#fff;border-radius:8px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.stat-card .sv{font-size:22px;font-weight:800;margin-bottom:4px;}
.stat-card .sl{font-size:11px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
/* ── Scenario cards ── */
.scenario-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.sc-card{background:#fff;border-radius:8px;border:2px solid #e0e0e0;padding:16px;position:relative;transition:border-color .15s;}
.sc-card.active{border-color:#1565c0;background:#f0f4ff;}
.sc-card .sc-name{font-weight:700;font-size:14px;margin-bottom:4px;}
.sc-card .sc-meta{font-size:11px;color:#888;margin-bottom:10px;}
.sc-card .sc-actions{display:flex;gap:6px;flex-wrap:wrap;}
.lock-badge{position:absolute;top:10px;right:10px;background:#e65100;color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;}
/* ── Supplementals ── */
.sup-table td,th{font-size:12px;}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;}
.badge-pending{background:#fff3e0;color:#e65100;}
.badge-approved{background:#e8f5e9;color:#2e7d32;}
.badge-denied{background:#fce4ec;color:#c62828;}
.badge-rev{background:#e8f5e9;color:#2e7d32;}
.badge-exp{background:#fff3e0;color:#e65100;}
/* ── Reforecast ── */
.rf-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 80px 140px;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid #f0f0f0;}
.rf-header{background:#e8eaf6;font-weight:700;font-size:11px;color:#555;}
.rf-over{color:#c62828;}
.rf-under{color:#2e7d32;}
/* ── Chart containers ── */
.chart-box{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:16px;}
.chart-box canvas{max-height:280px;}
/* ── Alerts ── */
.alert{padding:10px 14px;border-radius:6px;font-size:12px;margin-bottom:14px;}
.alert-info{background:#e3f2fd;color:#0d47a1;border-left:4px solid #1565c0;}
.alert-warning{background:#fff3e0;color:#e65100;border-left:4px solid #ff9800;}
.alert-success{background:#e8f5e9;color:#2e7d32;border-left:4px solid #4caf50;}
/* ── Modals ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;}
.modal-box{background:#fff;border-radius:10px;width:92%;max-width:480px;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,.2);}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;color:#1565c0;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
/* ── Toolbar ── */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
/* ── Filter bar ── */
.filter-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.filter-bar select,input.filter-input{padding:5px 10px;border:1px solid #ddd;border-radius:4px;font-size:12px;}
/* ── Empty state ── */
.empty{text-align:center;padding:40px;color:#888;font-size:13px;}
/* Spinner */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ccc;border-top-color:#1565c0;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
/* ── Dept collapse toggle ── */
.dept-toggle{font-size:10px;margin-right:6px;user-select:none;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const API = (typeof window !== 'undefined' && window.BUDGET_PLAYGROUND_API_URL) || 'http://localhost:5002';
const BASE = API + '/api';

// ── Helpers ──────────────────────────────────────────────────────────────────
const fc  = (n) => typeof n === 'number' ? '$' + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}) + (n < 0 ? ' CR' : '') : '—';
const fp  = (n) => typeof n === 'number' ? (n >= 0 ? '+' : '') + n.toFixed(1) + '%' : '—';
const fv  = (n) => { if (!n && n!==0) return '—'; return (n>=0?'+':'') + '$' + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}); };
const req = (url, opts={}) => fetch(url, { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) } }).then(r => r.ok ? r.json() : r.json().then(e => { throw new Error(e.detail || e.error || 'Request failed'); }));

// ── Main App ─────────────────────────────────────────────────────────────────
function App() {
    const [tab, setTab]             = useState('ledger');
    const [scenarios, setScenarios] = useState([]);
    const [activeId,  setActiveId]  = useState(null);
    const [scenario,  setScenario]  = useState(null);
    const [accounts,  setAccounts]  = useState([]);
    const [dirty,     setDirty]     = useState(false);
    const [loading,   setLoading]   = useState(true);
    const [error,     setError]     = useState('');

    const TABS = [
        {k:'ledger',      label:'Budget Ledger'},
        {k:'scenarios',   label:'Scenarios'},
        {k:'supplementals',label:'Supplementals'},
        {k:'reforecast',  label:'Reforecast'},
        {k:'summary',     label:'Summary'},
    ];

    const loadScenarios = useCallback(async () => {
        try {
            const list = await req(BASE + '/scenarios');
            setScenarios(list);
            if (!activeId && list.length > 0) setActiveId(list[0].id);
        } catch (e) { setError('Could not load scenarios: ' + e.message); }
    }, [activeId]);

    const loadAccounts = useCallback(async () => {
        try { setAccounts(await req(BASE + '/accounts')); } catch {}
    }, []);

    const loadScenario = useCallback(async (id) => {
        if (!id) return;
        setLoading(true);
        try { setScenario(await req(BASE + '/scenarios/' + id)); }
        catch (e) { setError('Could not load scenario: ' + e.message); }
        finally { setLoading(false); }
    }, []);

    useEffect(() => {
        Promise.all([loadScenarios(), loadAccounts()])
            .then(() => setLoading(false));
    }, []);

    useEffect(() => {
        if (activeId) { setDirty(false); loadScenario(activeId); }
    }, [activeId]);

    const onScenarioChange = (id) => { if (dirty && !window.confirm('You have unsaved changes. Switch anyway?')) return; setActiveId(id); };

    const exportCSV = () => {
        if (!activeId) return;
        window.open(BASE + '/scenarios/' + activeId + '/export.csv', '_blank');
    };

    return (
        <div className="app-shell">
            <div className="top-bar">
                <div>
                    <div className="h1" style={{fontWeight:800,fontSize:17,color:'#fff'}}>Budget Playground</div>
                    <div className="tagline">Dynamic re-forecasting and scenario modeling — all non-payroll accounts</div>
                </div>
                <div className="scenario-selector">
                    {dirty && <span className="dirty-badge">Unsaved changes</span>}
                    <span style={{fontSize:11,opacity:.8}}>Active scenario:</span>
                    <select value={activeId||''} onChange={e=>onScenarioChange(e.target.value)}>
                        {scenarios.map(s => <option key={s.id} value={s.id}>{s.name} (FY {s.fiscal_year}){s.is_locked?' [Locked]':''}</option>)}
                    </select>
                </div>
            </div>
            <div className="tab-bar">
                {TABS.map(t => <button key={t.k} className={'tab-btn'+(tab===t.k?' active':'')} onClick={()=>setTab(t.k)}>{t.label}</button>)}
            </div>
            {error && <div className="alert alert-warning" style={{margin:'12px 20px 0'}}>{error} <button onClick={()=>setError('')} style={{marginLeft:8,fontWeight:700,cursor:'pointer',border:'none',background:'none'}}>x</button></div>}
            <div className="tab-content">
                {loading && tab==='ledger' ? (
                    <div className="empty"><span className="spinner"></span> Loading budget data...</div>
                ) : (
                    <>
                        {tab === 'ledger'       && <LedgerTab scenario={scenario} setScenario={setScenario} activeId={activeId} dirty={dirty} setDirty={setDirty} exportCSV={exportCSV} />}
                        {tab === 'scenarios'    && <ScenariosTab scenarios={scenarios} activeId={activeId} onActivate={onScenarioChange} onRefresh={loadScenarios} />}
                        {tab === 'supplementals'&& <SupplementalsTab activeId={activeId} scenarios={scenarios} accounts={accounts} onApplied={()=>loadScenario(activeId)} />}
                        {tab === 'reforecast'   && <ReforecastTab scenario={scenario} activeId={activeId} onApplied={()=>loadScenario(activeId)} />}
                        {tab === 'summary'      && <SummaryTab scenario={scenario} />}
                    </>
                )}
            </div>
        </div>
    );
}

// ════════════════════════════════════════════════════════════════════════════
// TAB 1 — BUDGET LEDGER
// ════════════════════════════════════════════════════════════════════════════
function LedgerTab({ scenario, setScenario, activeId, dirty, setDirty, exportCSV }) {
    const [edits,        setEdits]        = useState({});
    const [filterDept,   setFilterDept]   = useState('');
    const [filterType,   setFilterType]   = useState('');
    const [collapsed,    setCollapsed]    = useState({});
    const [saving,       setSaving]       = useState(false);
    const [saveMsg,      setSaveMsg]      = useState('');
    const [focusedCell,  setFocusedCell]  = useState(null); // { acct, field }

    // Format a raw number/string value with thousand-separator commas (no decimals for budget figures)
    const numFmt = v => {
        if (v === '' || v === null || v === undefined) return '';
        const n = parseFloat(String(v).replace(/,/g, ''));
        return isNaN(n) ? String(v || '') : Math.round(n).toLocaleString('en-US');
    };
    // Strip everything except digits, minus sign, and decimal point
    const numStrip = s => String(s).replace(/[^0-9.\-]/g, '');

    // Clear edits when scenario changes
    useEffect(() => { setEdits({}); }, [activeId]);

    const lines = useMemo(() => {
        if (!scenario?.lines) return [];
        let L = scenario.lines;
        if (filterDept) L = L.filter(l => l.department === filterDept);
        if (filterType) L = L.filter(l => l.account_type === filterType);
        return L;
    }, [scenario, filterDept, filterType]);

    const departments = useMemo(() => {
        if (!scenario?.lines) return [];
        return [...new Set(scenario.lines.map(l => l.department))].sort();
    }, [scenario]);

    const grouped = useMemo(() => {
        const g = {};
        for (const l of lines) {
            if (!g[l.department]) g[l.department] = [];
            g[l.department].push(l);
        }
        return g;
    }, [lines]);

    const val = (acct, field) => {
        if (edits[acct] && edits[acct][field] !== undefined) return edits[acct][field];
        const line = scenario?.lines?.find(l => l.account_number === acct);
        if (!line) return '';
        return line[field] ?? line.budget_amount ?? '';
    };

    const setEdit = (acct, field, v) => {
        setEdits(prev => ({ ...prev, [acct]: { ...prev[acct], [field]: v } }));
        setDirty(true);
    };

    // Running totals
    const totals = useMemo(() => {
        if (!scenario?.lines) return { totalRevAdopted:0, totalRevRevised:0, totalExpAdopted:0, totalExpRevised:0 };
        let totalRevAdopted=0, totalRevRevised=0, totalExpAdopted=0, totalExpRevised=0;
        for (const l of scenario.lines) {
            const adopted  = l.budget_amount || 0;
            const eKey     = l.account_number;
            const revised  = edits[eKey]?.revised_budget !== undefined ? parseFloat(edits[eKey].revised_budget)||0 : l.revised_budget ?? adopted;
            if (l.account_type === 'Revenue') { totalRevAdopted += adopted; totalRevRevised += revised; }
            else { totalExpAdopted += adopted; totalExpRevised += revised; }
        }
        return { totalRevAdopted, totalRevRevised, totalExpAdopted, totalExpRevised };
    }, [scenario, edits]);

    const surplusAdopted  = totals.totalRevAdopted  - totals.totalExpAdopted;
    const surplusRevised  = totals.totalRevRevised  - totals.totalExpRevised;
    const netVariance     = surplusRevised - surplusAdopted;

    const save = async () => {
        if (!activeId || !Object.keys(edits).length) return;
        setSaving(true);
        const lines_payload = Object.entries(edits).map(([acct, e]) => {
            const base = scenario?.lines?.find(l => l.account_number === acct) || {};
            return {
                account_number: acct,
                revised_budget: parseFloat(e.revised_budget ?? base.revised_budget ?? base.budget_amount) || 0,
                forecast_yr2:   parseFloat(e.forecast_yr2   ?? base.forecast_yr2   ?? base.budget_amount) || 0,
                forecast_yr3:   parseFloat(e.forecast_yr3   ?? base.forecast_yr3   ?? base.budget_amount) || 0,
                note:           e.note ?? base.note ?? '',
            };
        });
        try {
            await req(BASE + '/scenarios/' + activeId + '/lines', { method:'PUT', body: JSON.stringify(lines_payload) });
            const refreshed = await req(BASE + '/scenarios/' + activeId);
            setScenario(refreshed);
            setEdits({});
            setDirty(false);
            setSaveMsg('Saved successfully.');
            setTimeout(() => setSaveMsg(''), 3000);
        } catch (e) { setSaveMsg('Save failed: ' + e.message); }
        setSaving(false);
    };

    const resetToAdopted = () => {
        if (!window.confirm('Reset all unsaved changes back to the adopted budget?')) return;
        setEdits({});
        setDirty(false);
    };

    const toggleDept = (dept) => setCollapsed(p => ({ ...p, [dept]: !p[dept] }));

    if (!scenario) return <div className="empty">No scenario loaded. Select or create a scenario first.</div>;
    if (scenario.is_locked) return (
        <div>
            <div className="alert alert-warning">This scenario is locked and cannot be edited. Duplicate it to make changes.</div>
            <LedgerReadOnly scenario={scenario} />
        </div>
    );

    return (
        <div>
            <div className="toolbar">
                <button className="btn btn-success" onClick={save} disabled={!dirty||saving}>{saving?<><span className="spinner"></span> Saving...</>:'Save Changes'}</button>
                <button className="btn btn-secondary" onClick={resetToAdopted} disabled={!dirty}>Reset to Adopted</button>
                <button className="btn btn-secondary" onClick={exportCSV}>Export CSV</button>
                {saveMsg && <span style={{fontSize:12,color:saveMsg.includes('fail')?'#c62828':'#2e7d32',fontWeight:700}}>{saveMsg}</span>}
            </div>
            <div className="filter-bar">
                <select value={filterDept} onChange={e=>setFilterDept(e.target.value)}>
                    <option value="">All Departments</option>
                    {departments.map(d => <option key={d} value={d}>{d}</option>)}
                </select>
                <select value={filterType} onChange={e=>setFilterType(e.target.value)}>
                    <option value="">All Types</option>
                    <option value="Revenue">Revenue</option>
                    <option value="Expense">Expense</option>
                </select>
            </div>
            <div className="spreadsheet-wrap">
                <table>
                    <thead>
                        <tr>
                            <th style={{width:100}}>Account #</th>
                            <th>Account Name</th>
                            <th style={{width:80}}>Type</th>
                            <th className="right" style={{width:115}}>Adopted</th>
                            <th className="right" style={{width:90}}>YTD Actual</th>
                            <th className="right" style={{width:70}}>% Used</th>
                            <th className="right" style={{width:130}}>Revised Forecast</th>
                            <th className="right" style={{width:115}}>Yr+1</th>
                            <th className="right" style={{width:115}}>Yr+2</th>
                            <th className="right" style={{width:100}}>Variance</th>
                            <th style={{width:150}}>Note</th>
                        </tr>
                    </thead>
                    <tbody>
                        {Object.entries(grouped).map(([dept, dlines]) => {
                            const isCollapsed = !!collapsed[dept];
                            const deptAdopted  = dlines.reduce((s,l)=>s+(l.budget_amount||0),0);
                            const deptRevised  = dlines.reduce((s,l)=>{
                                const rev = edits[l.account_number]?.revised_budget !== undefined ? parseFloat(edits[l.account_number].revised_budget)||0 : (l.revised_budget ?? l.budget_amount ?? 0);
                                return s+rev;
                            }, 0);
                            const deptVar = deptRevised - deptAdopted;
                            return (
                                <React.Fragment key={dept}>
                                    <tr className="dept-header" onClick={()=>toggleDept(dept)}>
                                        <td colSpan={3}><span className="dept-toggle">{isCollapsed?'▶':'▼'}</span>{dept}</td>
                                        <td className="right">{fc(deptAdopted)}</td>
                                        <td colSpan={2}></td>
                                        <td className="right">{fc(deptRevised)}</td>
                                        <td colSpan={2}></td>
                                        <td className={deptVar>=0?'right pos':'right neg'}>{fv(deptVar)}</td>
                                        <td></td>
                                    </tr>
                                    {!isCollapsed && dlines.map(line => {
                                        const adopted  = line.budget_amount || 0;
                                        const ytd      = line.ytd_actual || 0;
                                        const pctUsed  = adopted ? ((ytd / adopted) * 100).toFixed(0) + '%' : '—';
                                        const editedRev = edits[line.account_number]?.revised_budget;
                                        const revised   = editedRev !== undefined ? parseFloat(editedRev)||0 : (line.revised_budget ?? adopted);
                                        const variance  = revised - adopted;
                                        const isDirtyCell = !!edits[line.account_number];
                                        return (
                                            <tr key={line.account_number} style={{background:isDirtyCell?'#fffde7':undefined}}>
                                                <td style={{fontFamily:'monospace',fontSize:11,color:'#666'}}>{line.account_number}</td>
                                                <td>{line.account_name}</td>
                                                <td><span className={'badge '+(line.account_type==='Revenue'?'badge-rev':'badge-exp')}>{line.account_type}</span></td>
                                                <td className="right">{fc(adopted)}</td>
                                                <td className="right">{fc(ytd)}</td>
                                                <td className="right" style={{color:adopted&&ytd/adopted>1?'#c62828':'#555'}}>{pctUsed}</td>
                                                <td><input type="text" className={'cell-input'+(isDirtyCell?' dirty':'')}
                                                    value={focusedCell?.acct===line.account_number&&focusedCell?.field==='revised_budget' ? String(val(line.account_number,'revised_budget')||'') : numFmt(val(line.account_number,'revised_budget'))}
                                                    onFocus={()=>setFocusedCell({acct:line.account_number,field:'revised_budget'})}
                                                    onBlur={()=>setFocusedCell(null)}
                                                    onChange={e=>setEdit(line.account_number,'revised_budget',numStrip(e.target.value))} /></td>
                                                <td><input type="text" className="cell-input"
                                                    value={focusedCell?.acct===line.account_number&&focusedCell?.field==='forecast_yr2' ? String(val(line.account_number,'forecast_yr2')||'') : numFmt(val(line.account_number,'forecast_yr2'))}
                                                    onFocus={()=>setFocusedCell({acct:line.account_number,field:'forecast_yr2'})}
                                                    onBlur={()=>setFocusedCell(null)}
                                                    onChange={e=>setEdit(line.account_number,'forecast_yr2',numStrip(e.target.value))} /></td>
                                                <td><input type="text" className="cell-input"
                                                    value={focusedCell?.acct===line.account_number&&focusedCell?.field==='forecast_yr3' ? String(val(line.account_number,'forecast_yr3')||'') : numFmt(val(line.account_number,'forecast_yr3'))}
                                                    onFocus={()=>setFocusedCell({acct:line.account_number,field:'forecast_yr3'})}
                                                    onBlur={()=>setFocusedCell(null)}
                                                    onChange={e=>setEdit(line.account_number,'forecast_yr3',numStrip(e.target.value))} /></td>
                                                <td className={variance>=0?'right pos':'right neg'}>{fv(variance)}</td>
                                                <td><input type="text" className="cell-note" placeholder="Add note..." value={val(line.account_number,'note')||''} onChange={e=>setEdit(line.account_number,'note',e.target.value)} /></td>
                                            </tr>
                                        );
                                    })}
                                </React.Fragment>
                            );
                        })}
                    </tbody>
                </table>
            </div>
            <div className="footer-totals">
                <div className="footer-stat">
                    <div className="label">Revenue — Adopted</div>
                    <div className="value" style={{color:'#1565c0'}}>{fc(totals.totalRevAdopted)}</div>
                </div>
                <div className="footer-stat">
                    <div className="label">Revenue — Revised</div>
                    <div className="value" style={{color:totals.totalRevRevised>=totals.totalRevAdopted?'#2e7d32':'#e65100'}}>{fc(totals.totalRevRevised)}</div>
                </div>
                <div className="footer-stat">
                    <div className="label">Expense — Adopted</div>
                    <div className="value" style={{color:'#1565c0'}}>{fc(totals.totalExpAdopted)}</div>
                </div>
                <div className="footer-stat">
                    <div className="label">Expense — Revised</div>
                    <div className="value" style={{color:totals.totalExpRevised<=totals.totalExpAdopted?'#2e7d32':'#e65100'}}>{fc(totals.totalExpRevised)}</div>
                </div>
                <div className="footer-stat">
                    <div className="label">Surplus/(Deficit) — Adopted</div>
                    <div className="value" style={{color:surplusAdopted>=0?'#2e7d32':'#c62828'}}>{surplusAdopted>=0?'':'('+fc(-surplusAdopted)+')'}{surplusAdopted>=0?fc(surplusAdopted):''}</div>
                </div>
                <div className="footer-stat">
                    <div className="label">Surplus/(Deficit) — Revised</div>
                    <div className="value" style={{color:surplusRevised>=0?'#2e7d32':'#c62828',fontSize:22}}>
                        {surplusRevised>=0?fc(surplusRevised):'('+fc(-surplusRevised)+')'}
                    </div>
                </div>
                <div className="footer-stat">
                    <div className="label">Net Change in Position</div>
                    <div className="value" style={{color:netVariance>=0?'#2e7d32':'#c62828'}}>{fv(netVariance)}</div>
                </div>
            </div>
        </div>
    );
}

function LedgerReadOnly({ scenario }) {
    if (!scenario?.lines) return null;
    return (
        <div className="spreadsheet-wrap">
            <table>
                <thead><tr><th>Account #</th><th>Account Name</th><th>Department</th><th>Type</th><th className="right">Adopted</th><th className="right">Revised</th><th className="right">Variance</th></tr></thead>
                <tbody>
                    {scenario.lines.map(l => {
                        const v = (l.revised_budget??l.budget_amount??0) - (l.budget_amount||0);
                        return <tr key={l.account_number}><td style={{fontFamily:'monospace',fontSize:11}}>{l.account_number}</td><td>{l.account_name}</td><td>{l.department}</td><td>{l.account_type}</td><td className="right">{fc(l.budget_amount)}</td><td className="right">{fc(l.revised_budget)}</td><td className={v>=0?'right pos':'right neg'}>{fv(v)}</td></tr>;
                    })}
                </tbody>
            </table>
        </div>
    );
}

// TAB 2 — SCENARIOS
// ════════════════════════════════════════════════════════════════════════════
function ScenariosTab({ scenarios, activeId, onActivate, onRefresh }) {
    const [showModal,  setShowModal]  = useState(false);
    const [editTarget, setEditTarget] = useState(null);
    const [form,       setForm]       = useState({ name:'', description:'', fiscal_year:2025, copy_from_id:'' });
    const [saving,     setSaving]     = useState(false);
    const [msg,        setMsg]        = useState('');

    const openCreate = () => { setForm({name:'',description:'',fiscal_year:2025,copy_from_id:''}); setEditTarget(null); setShowModal(true); };
    const openEdit   = (s) => { setForm({name:s.name,description:s.description,fiscal_year:s.fiscal_year,copy_from_id:''}); setEditTarget(s); setShowModal(true); };

    const submit = async () => {
        if (!form.name.trim()) return;
        setSaving(true);
        try {
            if (editTarget) {
                await req(BASE + '/scenarios/' + editTarget.id, { method:'PUT', body: JSON.stringify({ name: form.name, description: form.description }) });
            } else {
                await req(BASE + '/scenarios', { method:'POST', body: JSON.stringify(form) });
            }
            await onRefresh();
            setShowModal(false);
            setMsg('');
        } catch (e) { setMsg(e.message); }
        setSaving(false);
    };

    const duplicate = async (s) => {
        setSaving(true);
        try {
            const created = await req(BASE + '/scenarios', { method:'POST', body: JSON.stringify({ name: s.name + ' (Copy)', description: s.description, fiscal_year: s.fiscal_year, copy_from_id: s.id }) });
            await onRefresh();
            setMsg('Duplicated as "' + created.name + '"');
            setTimeout(() => setMsg(''), 3000);
        } catch (e) { setMsg(e.message); }
        setSaving(false);
    };

    const toggleLock = async (s) => {
        try {
            await req(BASE + '/scenarios/' + s.id, { method:'PUT', body: JSON.stringify({ is_locked: s.is_locked ? 0 : 1 }) });
            await onRefresh();
        } catch (e) { alert(e.message); }
    };

    const deleteScenario = async (s) => {
        if (!window.confirm(`Delete "${s.name}"? This cannot be undone.`)) return;
        try {
            await req(BASE + '/scenarios/' + s.id, { method:'DELETE' });
            await onRefresh();
            if (s.id === activeId) onActivate(scenarios.find(x => x.id !== s.id)?.id);
        } catch (e) { alert(e.message); }
    };

    return (
        <div>
            <div className="toolbar">
                <button className="btn btn-primary" onClick={openCreate}>New Scenario</button>
                {msg && <span style={{fontSize:12,color:'#2e7d32',fontWeight:700}}>{msg}</span>}
            </div>
            <div className="alert alert-info">
                Scenarios are independent versions of the budget. Create a "Current Forecast" to track re-estimates, or a "Conservative" to model downside risk. The Ledger always edits the active scenario selected at the top of the page.
            </div>
            <div className="scenario-grid">
                {scenarios.map(s => (
                    <div key={s.id} className={'sc-card'+(s.id===activeId?' active':'')}>
                        {s.is_locked && <span className="lock-badge">LOCKED</span>}
                        <div className="sc-name">{s.name}</div>
                        <div className="sc-meta">FY {s.fiscal_year} &bull; Created {new Date(s.created_at).toLocaleDateString()}</div>
                        {s.description && <div style={{fontSize:12,color:'#555',marginBottom:10}}>{s.description}</div>}
                        <div className="sc-actions">
                            <button className="btn btn-primary btn-sm" onClick={()=>onActivate(s.id)} disabled={s.id===activeId}>{s.id===activeId?'Active':'Load'}</button>
                            <button className="btn btn-secondary btn-sm" onClick={()=>openEdit(s)} disabled={!!s.is_locked}>Rename</button>
                            <button className="btn btn-secondary btn-sm" onClick={()=>duplicate(s)} disabled={saving}>Duplicate</button>
                            <button className="btn btn-secondary btn-sm" onClick={()=>toggleLock(s)}>{s.is_locked?'Unlock':'Lock'}</button>
                            <button className="btn btn-danger btn-sm" onClick={()=>deleteScenario(s)} disabled={!!s.is_locked || s.id===activeId}>Delete</button>
                        </div>
                    </div>
                ))}
            </div>
            {showModal && (
                <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowModal(false)}>
                    <div className="modal-box">
                        <div className="modal-title">{editTarget?'Edit Scenario':'New Scenario'}</div>
                        <div className="form-group"><label>Name *</label><input type="text" value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} placeholder="e.g. Current Forecast, Conservative" autoFocus /></div>
                        <div className="form-group"><label>Description</label><textarea value={form.description} onChange={e=>setForm(p=>({...p,description:e.target.value}))} placeholder="Optional description..." /></div>
                        {!editTarget && <>
                            <div className="form-group"><label>Fiscal Year</label><select value={form.fiscal_year} onChange={e=>setForm(p=>({...p,fiscal_year:parseInt(e.target.value)}))}>{[2024,2025,2026,2027,2028].map(y=><option key={y} value={y}>{y}</option>)}</select></div>
                            <div className="form-group"><label>Copy from</label><select value={form.copy_from_id} onChange={e=>setForm(p=>({...p,copy_from_id:e.target.value}))}><option value="">Seed from adopted budget</option>{scenarios.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></div>
                        </>}
                        {msg && <div className="alert alert-warning">{msg}</div>}
                        <div className="modal-actions">
                            <button className="btn btn-secondary" onClick={()=>setShowModal(false)}>Cancel</button>
                            <button className="btn btn-primary" onClick={submit} disabled={saving||!form.name.trim()}>{saving?'Saving...':editTarget?'Save Changes':'Create Scenario'}</button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

// TAB 3 — SUPPLEMENTALS
// ════════════════════════════════════════════════════════════════════════════
function SupplementalsTab({ activeId, scenarios, accounts, onApplied }) {
    const [sups,       setSups]       = useState([]);
    const [showModal,  setShowModal]  = useState(false);
    const [form,       setForm]       = useState({ scenario_id:'', account_number:'', department:'', category:'Supplemental', amount:'', justification:'' });
    const [saving,     setSaving]     = useState(false);
    const [msg,        setMsg]        = useState('');

    const depts      = [...new Set(accounts.map(a=>a.department))].sort();
    const deptAccts  = accounts.filter(a => !form.department || a.department === form.department);
    const CATS       = ['Supplemental','Reduction','Transfer','Emergency'];

    const load = useCallback(async () => {
        try { setSups(await req(BASE + '/supplementals' + (activeId ? '?scenario_id='+activeId : ''))); } catch {}
    }, [activeId]);

    useEffect(() => { load(); }, [load]);

    const submit = async () => {
        if (!form.scenario_id || form.amount === '') return;
        setSaving(true);
        try {
            await req(BASE + '/supplementals', { method:'POST', body: JSON.stringify({ ...form, amount: parseFloat(form.amount)||0 }) });
            await load();
            setShowModal(false);
        } catch (e) { setMsg(e.message); }
        setSaving(false);
    };

    const updateStatus = async (id, status) => {
        try { await req(BASE + '/supplementals/' + id, { method:'PUT', body: JSON.stringify({ status }) }); await load(); } catch (e) { alert(e.message); }
    };

    const deleteSup = async (id) => {
        if (!window.confirm('Delete this supplemental request?')) return;
        try { await req(BASE + '/supplementals/' + id, { method:'DELETE' }); await load(); } catch (e) { alert(e.message); }
    };

    const applyApproved = async () => {
        if (!activeId) return;
        if (!window.confirm('Apply all approved supplementals to the active scenario ledger? This will add amounts to the Revised Forecast for each matched account.')) return;
        try {
            const r = await req(BASE + '/scenarios/' + activeId + '/apply-supplementals', { method:'POST' });
            setMsg(`Applied ${r.applied} approved supplemental(s) to the ledger.`);
            await load();
            onApplied();
            setTimeout(() => setMsg(''), 4000);
        } catch (e) { setMsg(e.message); }
    };

    const totalPending  = sups.filter(s=>s.status==='pending').reduce((t,s)=>t+s.amount,0);
    const totalApproved = sups.filter(s=>s.status==='approved').reduce((t,s)=>t+s.amount,0);

    return (
        <div>
            <div className="toolbar">
                <button className="btn btn-primary" onClick={()=>{setForm({scenario_id:activeId||'',account_number:'',department:'',category:'Supplemental',amount:'',justification:''});setMsg('');setShowModal(true);}}>Add Request</button>
                <button className="btn btn-success" onClick={applyApproved} disabled={!activeId||!sups.some(s=>s.status==='approved')}>Apply Approved to Ledger</button>
                {msg && <span style={{fontSize:12,color:'#2e7d32',fontWeight:700}}>{msg}</span>}
            </div>
            <div className="alert alert-info">
                Track mid-year budget amendments — supplemental funding requests, budget reductions, or inter-departmental transfers. Approved supplementals can be applied directly to the Revised Forecast in the Ledger.
            </div>
            <div className="stat-grid" style={{gridTemplateColumns:'repeat(3,1fr)',maxWidth:500,marginBottom:16}}>
                <div className="stat-card"><div className="sv" style={{color:'#e65100'}}>{sups.filter(s=>s.status==='pending').length}</div><div className="sl">Pending</div></div>
                <div className="stat-card"><div className="sv" style={{color:'#2e7d32'}}>{fc(totalApproved)}</div><div className="sl">Total Approved</div></div>
                <div className="stat-card"><div className="sv" style={{color:'#888'}}>{fc(totalPending)}</div><div className="sl">Pending Amount</div></div>
            </div>
            <div className="card">
                <div className="spreadsheet-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th><th>Scenario</th><th>Department</th><th>Account</th>
                                <th>Category</th><th className="right">Amount</th><th>Justification</th>
                                <th>Status</th><th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {sups.length === 0 && <tr><td colSpan={9} className="empty">No supplemental requests yet.</td></tr>}
                            {sups.map(s => {
                                const scName = scenarios.find(sc=>sc.id===s.scenario_id)?.name || s.scenario_id?.slice(0,8);
                                const acctName = accounts.find(a=>a.account_number===s.account_number)?.account_name || s.account_number;
                                return (
                                    <tr key={s.id}>
                                        <td style={{fontSize:11,color:'#888'}}>{new Date(s.submitted_at).toLocaleDateString()}</td>
                                        <td style={{fontSize:11}}>{scName}</td>
                                        <td>{s.department}</td>
                                        <td style={{fontSize:11}}>{acctName || '—'}</td>
                                        <td><span className="badge" style={{background:'#e8eaf6',color:'#1565c0'}}>{s.category}</span></td>
                                        <td className={s.amount>=0?'right pos':'right neg'}>{s.amount>=0?'+':''}{fc(s.amount)}</td>
                                        <td style={{fontSize:11,maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={s.justification}>{s.justification || '—'}</td>
                                        <td><span className={'badge badge-'+s.status}>{s.status}</span></td>
                                        <td style={{display:'flex',gap:4}}>
                                            {s.status==='pending'&&<><button className="btn btn-success btn-sm" onClick={()=>updateStatus(s.id,'approved')}>Approve</button><button className="btn btn-danger btn-sm" onClick={()=>updateStatus(s.id,'denied')}>Deny</button></>}
                                            <button className="btn btn-secondary btn-sm" onClick={()=>deleteSup(s.id)}>Delete</button>
                                        </td>
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            </div>
            {showModal && (
                <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowModal(false)}>
                    <div className="modal-box">
                        <div className="modal-title">Add Supplemental Request</div>
                        <div className="form-group"><label>Scenario</label><select value={form.scenario_id} onChange={e=>setForm(p=>({...p,scenario_id:e.target.value}))}><option value="">Select scenario</option>{scenarios.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></div>
                        <div className="form-group"><label>Department</label><select value={form.department} onChange={e=>setForm(p=>({...p,department:e.target.value,account_number:''}))}>
                            <option value="">All departments</option>{depts.map(d=><option key={d} value={d}>{d}</option>)}</select></div>
                        <div className="form-group"><label>Account (optional)</label><select value={form.account_number} onChange={e=>setForm(p=>({...p,account_number:e.target.value}))}>
                            <option value="">No specific account</option>{deptAccts.map(a=><option key={a.account_number} value={a.account_number}>{a.account_number} — {a.account_name}</option>)}</select></div>
                        <div className="form-group"><label>Category</label><select value={form.category} onChange={e=>setForm(p=>({...p,category:e.target.value}))}>{CATS.map(c=><option key={c}>{c}</option>)}</select></div>
                        <div className="form-group"><label>Amount (use negative for reductions)</label><input type="text" value={form.amount} onChange={e=>setForm(p=>({...p,amount:e.target.value.replace(/[^0-9.\-]/g,'')}))} placeholder="e.g. 50000 or -25000" /></div>
                        <div className="form-group"><label>Justification</label><textarea value={form.justification} onChange={e=>setForm(p=>({...p,justification:e.target.value}))} placeholder="Explain why this amendment is needed..." /></div>
                        {msg && <div className="alert alert-warning">{msg}</div>}
                        <div className="modal-actions">
                            <button className="btn btn-secondary" onClick={()=>setShowModal(false)}>Cancel</button>
                            <button className="btn btn-primary" onClick={submit} disabled={saving||!form.scenario_id||form.amount===''}>Submit Request</button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

// ════════════════════════════════════════════════════════════════════════════
// TAB 4 — REFORECAST
// ════════════════════════════════════════════════════════════════════════════
function ReforecastTab({ scenario, activeId, onApplied }) {
    const [fyStart,  setFyStart]  = useState('July');
    const [months,   setMonths]   = useState(() => {
        const now = new Date();
        const m = now.getMonth(); // 0=Jan
        return fyStart === 'July' ? ((m - 6 + 12) % 12) + 1 : m + 1;
    });
    const [accepted,   setAccepted]   = useState({});
    const [overrides,  setOverrides]  = useState({});
    const [applying,   setApplying]   = useState(false);
    const [msg,        setMsg]        = useState('');
    const [rfFocused,  setRfFocused]  = useState(null);

    const numFmt = v => {
        if (v === '' || v === null || v === undefined) return '';
        const n = parseFloat(String(v).replace(/,/g, ''));
        return isNaN(n) ? String(v || '') : Math.round(n).toLocaleString('en-US');
    };
    const numStrip = s => String(s).replace(/[^0-9.\-]/g, '');

    const lines = useMemo(() => {
        if (!scenario?.lines) return [];
        return scenario.lines
            .map(l => {
                const adopted    = l.budget_amount || 0;
                const ytd        = l.ytd_actual    || 0;
                const extrap     = months > 0 ? (ytd / months) * 12 : ytd;
                const variance   = extrap - adopted;
                return { ...l, ytd, extrap, variance, adopted };
            })
            .sort((a,b) => Math.abs(b.variance) - Math.abs(a.variance));
    }, [scenario, months]);

    const overBudget   = lines.filter(l=>l.variance>0 && l.account_type!=='Revenue').length;
    const underBudget  = lines.filter(l=>l.variance<0 && l.account_type!=='Revenue').length;
    const totalExtrap  = lines.filter(l=>l.account_type==='Revenue').reduce((s,l)=>s+l.extrap,0)
                       - lines.filter(l=>l.account_type!=='Revenue').reduce((s,l)=>s+l.extrap,0);

    const toggle = (acct) => setAccepted(p => ({ ...p, [acct]: !p[acct] }));

    const apply = async () => {
        const toSave = lines
            .filter(l => accepted[l.account_number])
            .map(l => ({
                account_number: l.account_number,
                revised_budget: parseFloat(overrides[l.account_number] ?? l.extrap.toFixed(0)),
                forecast_yr2: l.forecast_yr2 ?? l.adopted,
                forecast_yr3: l.forecast_yr3 ?? l.adopted,
                note: 'Reforecast applied — extrapolated from ' + months + '-month YTD',
            }));
        if (!toSave.length) { setMsg('No accounts selected.'); return; }
        setApplying(true);
        try {
            await req(BASE + '/scenarios/' + activeId + '/lines', { method:'PUT', body: JSON.stringify(toSave) });
            setMsg(toSave.length + ' forecast(s) applied to ledger.');
            setAccepted({});
            onApplied();
            setTimeout(() => setMsg(''), 4000);
        } catch (e) { setMsg('Error: ' + e.message); }
        setApplying(false);
    };

    if (!scenario) return <div className="empty">Load a scenario first.</div>;

    return (
        <div>
            <div className="card">
                <div className="card-header">Reforecast Settings</div>
                <div className="card-body" style={{display:'flex',gap:20,flexWrap:'wrap',alignItems:'flex-end'}}>
                    <div className="form-group" style={{marginBottom:0}}>
                        <label>Fiscal Year Start</label>
                        <select value={fyStart} onChange={e=>setFyStart(e.target.value)}><option>January</option><option>July</option></select>
                    </div>
                    <div className="form-group" style={{marginBottom:0}}>
                        <label>Months elapsed: {months}</label>
                        <input type="range" min={1} max={12} value={months} onChange={e=>setMonths(parseInt(e.target.value))} style={{display:'block',width:200}} />
                    </div>
                    <div style={{fontSize:12,color:'#888'}}>Extrapolating full-year from {months} month{months!==1?'s':''} of actual data.</div>
                </div>
            </div>
            <div className="stat-grid" style={{gridTemplateColumns:'repeat(3,1fr)',maxWidth:480,marginBottom:12}}>
                <div className="stat-card"><div className="sv" style={{color:'#c62828'}}>{overBudget}</div><div className="sl">Accounts Over Budget</div></div>
                <div className="stat-card"><div className="sv" style={{color:'#2e7d32'}}>{underBudget}</div><div className="sl">Accounts Under Budget</div></div>
                <div className="stat-card"><div className="sv" style={{color:totalExtrap>=0?'#2e7d32':'#c62828'}}>{fc(totalExtrap)}</div><div className="sl">Projected Net Position</div></div>
            </div>
            <div className="toolbar">
                <button className="btn btn-primary" onClick={apply} disabled={applying||!Object.values(accepted).some(Boolean)}>
                    {applying?'Applying...':'Apply Selected to Ledger'} ({Object.values(accepted).filter(Boolean).length} selected)
                </button>
                {msg && <span style={{fontSize:12,color:msg.includes('Error')?'#c62828':'#2e7d32',fontWeight:700}}>{msg}</span>}
            </div>
            <div className="alert alert-info">
                Check accounts where you want to accept the extrapolated forecast. You can also enter a custom override. Click "Apply Selected to Ledger" to push chosen values to the Revised Forecast column.
            </div>
            <div style={{background:'#fff',borderRadius:8,overflow:'hidden',boxShadow:'0 1px 4px rgba(0,0,0,.08)'}}>
                <div className="rf-row rf-header">
                    <span>Account</span><span className="right">Adopted</span><span className="right">YTD Actual</span><span className="right">Extrapolated</span><span>Accept</span><span>Custom Override</span>
                </div>
                {lines.map(l => {
                    const ov = overrides[l.account_number];
                    const finalVal = ov !== undefined ? parseFloat(ov)||0 : l.extrap;
                    const isOver = l.variance > 0;
                    return (
                        <div key={l.account_number} className="rf-row" style={{background:accepted[l.account_number]?'#e8f5e9':undefined}}>
                            <div>
                                <div style={{fontWeight:600,fontSize:12}}>{l.account_name}</div>
                                <div style={{fontSize:10,color:'#888'}}>{l.account_number} &bull; {l.department}</div>
                            </div>
                            <div className="right" style={{fontSize:12}}>{fc(l.adopted)}</div>
                            <div className="right" style={{fontSize:12}}>{fc(l.ytd)}</div>
                            <div className="right">
                                <div style={{fontWeight:700,color:isOver&&l.account_type!=='Revenue'?'#c62828':'#2e7d32',fontSize:12}}>{fc(l.extrap)}</div>
                                <div style={{fontSize:10,color:'#888'}}>{fv(l.variance)}</div>
                            </div>
                            <div style={{textAlign:'center'}}>
                                <input type="checkbox" checked={!!accepted[l.account_number]} onChange={()=>toggle(l.account_number)} style={{width:16,height:16,cursor:'pointer'}} />
                            </div>
                            <div>
                                <input type="text" className="cell-input"
                                    placeholder={numFmt(l.extrap)}
                                    value={rfFocused===l.account_number ? (ov??'') : (ov!=null&&ov!=='' ? numFmt(ov) : '')}
                                    onFocus={()=>setRfFocused(l.account_number)}
                                    onBlur={()=>setRfFocused(null)}
                                    onChange={e=>setOverrides(p=>({...p,[l.account_number]:numStrip(e.target.value)}))}
                                    style={{background:'#f9f9f9'}} />
                            </div>
                        </div>
                    );
                })}
            </div>
        </div>
    );
}

// ════════════════════════════════════════════════════════════════════════════
// TAB 5 — SUMMARY DASHBOARD
// ════════════════════════════════════════════════════════════════════════════
function SummaryTab({ scenario }) {
    const barRef  = useRef(null);
    const lineRef = useRef(null);
    const barInst = useRef(null);
    const lineInst= useRef(null);
    const [sortBy, setSortBy] = useState('dept');
    const [sortDir,setSortDir]= useState(1);

    const { lines } = scenario || { lines:[] };

    const revenue = useMemo(()=>lines.filter(l=>l.account_type==='Revenue'),[lines]);
    const expense  = useMemo(()=>lines.filter(l=>l.account_type!=='Revenue'),[lines]);

    const totalRevAdopted = revenue.reduce((s,l)=>s+(l.budget_amount||0),0);
    const totalRevRevised = revenue.reduce((s,l)=>s+(l.revised_budget??l.budget_amount??0),0);
    const totalExpAdopted = expense.reduce((s,l)=>s+(l.budget_amount||0),0);
    const totalExpRevised = expense.reduce((s,l)=>s+(l.revised_budget??l.budget_amount??0),0);
    const surplusAdopted  = totalRevAdopted - totalExpAdopted;
    const surplusRevised  = totalRevRevised - totalExpRevised;
    const negCount = lines.filter(l=>{ const v=(l.revised_budget??l.budget_amount??0)-(l.budget_amount||0); return v<0; }).length;

    // Dept summary
    const depts = useMemo(() => {
        const g = {};
        for (const l of expense) {
            if (!g[l.department]) g[l.department]={dept:l.department,adopted:0,revised:0};
            g[l.department].adopted  += l.budget_amount||0;
            g[l.department].revised  += l.revised_budget??l.budget_amount??0;
        }
        return Object.values(g).map(d=>({...d,variance:d.revised-d.adopted,pctVar:d.adopted?(((d.revised-d.adopted)/d.adopted)*100).toFixed(1):0}));
    }, [expense]);

    // Top variances
    const allVars = useMemo(()=>lines.map(l=>({...l,variance:(l.revised_budget??l.budget_amount??0)-(l.budget_amount||0)})).sort((a,b)=>b.variance-a.variance),[lines]);
    const top5Fav  = allVars.filter(l=>l.variance>0).slice(0,5);
    const top5Unf  = allVars.filter(l=>l.variance<0).reverse().slice(0,5);

    // Charts
    useEffect(() => {
        if (!barRef.current || !depts.length) return;
        if (barInst.current) barInst.current.destroy();
        barInst.current = new Chart(barRef.current, {
            type:'bar',
            data:{
                labels: depts.map(d=>d.dept),
                datasets:[
                    {label:'Adopted',data:depts.map(d=>d.adopted),backgroundColor:'rgba(21,101,192,.4)',borderColor:'#1565c0',borderWidth:1},
                    {label:'Revised',data:depts.map(d=>d.revised),backgroundColor:'rgba(46,125,50,.4)',borderColor:'#2e7d32',borderWidth:1},
                ]
            },
            options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:'Department Expense — Adopted vs Revised'}},scales:{y:{ticks:{callback:v=>'$'+Math.round(v/1000)+'K'}}}}
        });
    }, [depts]);

    useEffect(() => {
        if (!lineRef.current) return;
        if (lineInst.current) lineInst.current.destroy();
        const yr1Rev = revenue.reduce((s,l)=>s+(l.forecast_yr2??l.revised_budget??l.budget_amount??0),0);
        const yr1Exp = expense.reduce((s,l)=>s+(l.forecast_yr2??l.revised_budget??l.budget_amount??0),0);
        const yr2Rev = revenue.reduce((s,l)=>s+(l.forecast_yr3??l.forecast_yr2??l.revised_budget??l.budget_amount??0),0);
        const yr2Exp = expense.reduce((s,l)=>s+(l.forecast_yr3??l.forecast_yr2??l.revised_budget??l.budget_amount??0),0);
        lineInst.current = new Chart(lineRef.current, {
            type:'line',
            data:{
                labels:['Adopted','Revised','Yr+1','Yr+2'],
                datasets:[
                    {label:'Total Revenue',data:[totalRevAdopted,totalRevRevised,yr1Rev,yr2Rev],borderColor:'#1565c0',backgroundColor:'rgba(21,101,192,.1)',fill:true,tension:.3},
                    {label:'Total Expense',data:[totalExpAdopted,totalExpRevised,yr1Exp,yr2Exp],borderColor:'#c62828',backgroundColor:'rgba(198,40,40,.08)',fill:true,tension:.3},
                ]
            },
            options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:'3-Year Budget Trajectory'}},scales:{y:{ticks:{callback:v=>'$'+Math.round(v/1000000)+'M'}}}}
        });
    }, [revenue, expense]);

    if (!scenario) return <div className="empty">Load a scenario to see the summary.</div>;

    const sortDepts = [...depts].sort((a,b)=>{
        const va = sortBy==='dept'?a.dept:sortBy==='adopted'?a.adopted:sortBy==='revised'?a.revised:a.variance;
        const vb = sortBy==='dept'?b.dept:sortBy==='adopted'?b.adopted:sortBy==='revised'?b.revised:b.variance;
        return typeof va==='string'?(va<vb?-sortDir:sortDir)*-1:sortDir*(vb-va);
    });
    const thSort = (col,label) => <th style={{cursor:'pointer',userSelect:'none'}} onClick={()=>{if(sortBy===col)setSortDir(p=>-p);else{setSortBy(col);setSortDir(1);}}}>{label}{sortBy===col?(sortDir>0?' ↓':' ↑'):''}</th>;

    return (
        <div>
            <div className="stat-grid">
                <div className="stat-card"><div className="sv" style={{color:'#1565c0'}}>{fc(totalRevRevised)}</div><div className="sl">Total Revenue (Revised)</div><div style={{fontSize:11,color:'#888',marginTop:2}}>{fv(totalRevRevised-totalRevAdopted)} vs adopted</div></div>
                <div className="stat-card"><div className="sv" style={{color:'#e65100'}}>{fc(totalExpRevised)}</div><div className="sl">Total Expense (Revised)</div><div style={{fontSize:11,color:'#888',marginTop:2}}>{fv(totalExpRevised-totalExpAdopted)} vs adopted</div></div>
                <div className="stat-card"><div className="sv" style={{color:surplusRevised>=0?'#2e7d32':'#c62828'}}>{surplusRevised>=0?fc(surplusRevised):'('+fc(-surplusRevised)+')'}</div><div className="sl">Net Surplus/(Deficit)</div><div style={{fontSize:11,color:'#888',marginTop:2}}>Adopted: {surplusAdopted>=0?fc(surplusAdopted):'('+fc(-surplusAdopted)+')'}</div></div>
                <div className="stat-card"><div className="sv" style={{color:'#c62828'}}>{negCount}</div><div className="sl">Accounts with Negative Variance</div></div>
            </div>
            <div className="chart-box">
                <canvas ref={barRef} style={{maxHeight:260}}></canvas>
            </div>
            <div className="chart-box">
                <canvas ref={lineRef} style={{maxHeight:260}}></canvas>
            </div>
            <div className="card">
                <div className="card-header">Department Expense Breakdown</div>
                <div className="spreadsheet-wrap">
                    <table>
                        <thead><tr>{thSort('dept','Department')}{thSort('adopted','Adopted')}{thSort('revised','Revised')}{thSort('variance','Variance')}<th className="right">% Variance</th></tr></thead>
                        <tbody>
                            {sortDepts.map(d=>(
                                <tr key={d.dept}>
                                    <td style={{fontWeight:600}}>{d.dept}</td>
                                    <td className="right">{fc(d.adopted)}</td>
                                    <td className="right">{fc(d.revised)}</td>
                                    <td className={d.variance>=0?'right pos':'right neg'}>{fv(d.variance)}</td>
                                    <td className={d.pctVar>=0?'right pos':'right neg'}>{d.pctVar>=0?'+':''}{d.pctVar}%</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
                <div className="card">
                    <div className="card-header">Top 5 Favorable Changes</div>
                    <div className="card-body">
                        {top5Fav.length === 0 ? <div style={{color:'#888',fontSize:12}}>No favorable variances</div> : top5Fav.map(l=>(
                            <div key={l.account_number} style={{display:'flex',justifyContent:'space-between',padding:'5px 0',borderBottom:'1px solid #f5f5f5',fontSize:12}}>
                                <span>{l.account_name}</span><span className="pos">{fv(l.variance)}</span>
                            </div>
                        ))}
                    </div>
                </div>
                <div className="card">
                    <div className="card-header">Top 5 Unfavorable Changes</div>
                    <div className="card-body">
                        {top5Unf.length === 0 ? <div style={{color:'#888',fontSize:12}}>No unfavorable variances</div> : top5Unf.map(l=>(
                            <div key={l.account_number} style={{display:'flex',justifyContent:'space-between',padding:'5px 0',borderBottom:'1px solid #f5f5f5',fontSize:12}}>
                                <span>{l.account_name}</span><span className="neg">{fv(l.variance)}</span>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        </div>
    );
}

// ── Boot ──────────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
