<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GovSight - Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Source Serif 4", Georgia, serif;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: #f3f2f2;
    color: #201e1d;
  }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid #0088b0; outline-offset: 2px; }
  ::selection { background: rgba(0, 136, 176, 0.3); }
  .panel-ink {
    background: #201e1d;
    color: #f3f2f2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 60px 40px;
  }
  .kicker {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #ff90b1;
  }
  .wordmark { font-size: 56px; line-height: 1.05; letter-spacing: -0.02em; font-weight: 400; }
  .wordmark strong { font-weight: 600; }
  .panel-ink p { font-size: 17px; opacity: 0.8; max-width: 36ch; margin-top: 15px; }
  .panel-ink .foot { font-size: 12px; opacity: 0.5; }
  .form-side {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  form { width: 340px; }
  h2 { font-size: 25px; letter-spacing: -0.015em; margin-bottom: 20px; }
  label {
    display: block;
    font-size: 12px;
    color: rgba(32, 30, 29, 0.7);
    margin: 15px 0 5px;
  }
  input {
    width: 100%;
    min-height: 36px;
    padding: 6px 10px;
    font: inherit;
    font-size: 14px;
    color: #201e1d;
    caret-color: #0088b0;
    background: #eae9e9;
    border: 1px solid rgba(32, 30, 29, 0.16);
    border-radius: 2px;
  }
  input:hover { border-color: rgba(32, 30, 29, 0.45); }
  input:focus-visible { border-color: #0088b0; outline-offset: 0; }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 10px 18px;
    background: #0088b0;
    color: #f3f2f2;
    border: 1px solid transparent;
    border-radius: 2px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #1186ac; }
  button:active { background: #006786; }
  button:disabled { opacity: 0.45; cursor: default; }
  .error {
    display: none;
    margin-top: 14px;
    padding: 9px 13px;
    background: #fff1f4;
    color: #790e3d;
    border-radius: 2px;
    font-size: 13px;
  }
  .hint { font-size: 12px; color: rgba(32, 30, 29, 0.55); margin-top: 16px; }
  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; }
    .panel-ink { padding: 40px 30px; gap: 20px; }
    .wordmark { font-size: 42px; }
  }
</style>
</head>
<body>
<div class="panel-ink">
  <span class="kicker">GovSight</span>
  <div>
    <div class="wordmark"><strong>Gov</strong>Sight</div>
    <p>Your financial communication tool. Analytics over the ERP you already run.</p>
  </div>
  <span class="foot">Municipal Financial Intelligence Platform</span>
</div>
<div class="form-side">
  <form id="login-form">
    <h2>Sign in</h2>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="submit-btn">Sign in</button>
    <div class="error" id="error-box"></div>
    <p class="hint">Sign in with the account your administrator provisioned.</p>
  </form>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  var btn = document.getElementById('submit-btn');
  var errorBox = document.getElementById('error-box');
  btn.disabled = true;
  errorBox.style.display = 'none';
  try {
    var res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    var data = await res.json();
    if (data.ok) {
      window.location.href = '/';
      return;
    }
    errorBox.textContent = data.error || 'Sign in failed. Please try again.';
    errorBox.style.display = 'block';
  } catch (err) {
    errorBox.textContent = 'Could not reach the server. Please try again.';
    errorBox.style.display = 'block';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
