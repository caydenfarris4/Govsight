<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GovSight Financial Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* GovSight — Broadsheet/Cardinal design system tokens */
  :root {
    --paper: #f3f2f2;
    --surface: #eae9e9;
    --ink: #201e1d;
    --divider: rgba(32, 30, 29, 0.16);
    --accent: #0088b0;        /* cyan — interactive */
    --accent-600: #1186ac;
    --accent-700: #006786;
    --accent-100: #e9f8ff;
    --cardinal: #d6006c;      /* magenta — brand + data emphasis */
    --cardinal-400: #ff90b1;
    --neutral-400: #bab6b6;
    --neutral-900: #2d2b2b;
    --muted: rgba(32, 30, 29, 0.55);
    --warn-bg: #f2e7c2;
    --warn-fg: #6d5504;
    --font: "Source Serif 4", Georgia, serif;
    --radius-sm: 1px;
    --radius-md: 2px;
    --shadow-md: 0 3px 10px rgba(45, 43, 43, 0.16);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--paper);
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: rgba(0, 136, 176, 0.3); }
  /* Top bar — paper nav, serif brand */
  .topbar {
    background: var(--paper);
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.85rem 1.5rem;
    flex-shrink: 0;
  }
  .topbar .title { font-weight: 600; font-size: 1.1rem; letter-spacing: -0.015em; }
  .topbar .org {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--cardinal);
  }
  .topbar .spacer { flex-grow: 1; }
  .topbar a.logout {
    color: var(--ink);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    border: 1px solid var(--divider);
    padding: 0.35rem 0.85rem;
    border-radius: var(--radius-md);
  }
  .topbar a.logout:hover { background: rgba(32, 30, 29, 0.07); }
  .topbar .who {
    font-size: 0.75rem;
    color: var(--neutral-900);
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 0.25rem 0.8rem;
  }
  .topbar .who.employee { background: var(--warn-bg); color: var(--warn-fg); }
  .topbar button.persona {
    color: var(--accent-700);
    background: none;
    font-size: 0.85rem;
    font-family: inherit;
    border: none;
    padding: 0.35rem 0.4rem;
    border-radius: var(--radius-md);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .topbar button.persona:hover { background: rgba(0, 136, 176, 0.1); }
  main { flex-grow: 1; display: flex; flex-direction: column; min-height: 0; }

  /* Home — open broadsheet layout */
  .home { max-width: 1080px; margin: 0 auto; padding: 2.5rem 1.5rem 3rem; width: 100%; }
  .home .kicker {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--cardinal);
  }
  .home h1 { font-size: 2.3rem; letter-spacing: -0.015em; line-height: 1.12; margin: 0.3rem 0 0.4rem; }
  .home > p { color: var(--muted); font-size: 1.05rem; margin-bottom: 2.5rem; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.8rem; }
  .mcard {
    cursor: pointer;
    text-align: left;
    padding-top: 0.9rem;
    border-top: 2px solid var(--ink);
  }
  .mcard .kicker { font-size: 0.65rem; letter-spacing: 0.1em; color: var(--cardinal); text-transform: uppercase; }
  .mcard h2 { font-size: 1.55rem; letter-spacing: -0.015em; margin: 0.35rem 0 0.3rem; }
  .mcard .sub { font-size: 0.9rem; color: var(--muted); margin-bottom: 1.1rem; }
  .mcard .enter {
    display: inline-block;
    color: var(--ink);
    border: 1px solid var(--divider);
    padding: 0.45rem 1.1rem;
    border-radius: var(--radius-md);
    font-size: 0.88rem;
    font-weight: 600;
  }
  .mcard:hover .enter { background: rgba(32, 30, 29, 0.07); }
  .mcard.admin {
    background: var(--ink);
    color: var(--paper);
    border-top: none;
    padding: 1.4rem 1.5rem;
    border-radius: var(--radius-md);
  }
  .mcard.admin .kicker { color: var(--cardinal-400); }
  .mcard.admin .sub { color: rgba(243, 242, 242, 0.7); }
  .mcard.admin .enter { color: #fff; background: var(--accent); border-color: transparent; }
  .mcard.admin:hover .enter { background: var(--accent-600); }

  /* Module view */
  .module-view { display: flex; flex-direction: column; flex-grow: 1; min-height: 0; }
  .module-head { background: var(--paper); color: var(--ink); padding: 1.1rem 1.5rem 0; }
  .module-head .row { max-width: 1240px; margin: 0 auto; display: flex; align-items: baseline; gap: 0.9rem; }
  .module-head a.back {
    color: var(--accent-700);
    text-decoration: none;
    font-size: 0.82rem;
    white-space: nowrap;
  }
  .module-head a.back:hover { color: var(--accent); }
  .module-head h1 { font-size: 1.55rem; letter-spacing: -0.015em; }
  .module-head .tag {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--cardinal);
  }
  .tabbar {
    background: var(--paper);
    border-bottom: 1px solid var(--divider);
    overflow-x: auto;
    flex-shrink: 0;
  }
  .tabbar .row { max-width: 1240px; margin: 0 auto; display: flex; gap: 1.4rem; padding: 0 1.5rem; }
  .tabbar button {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    padding: 0.75rem 0;
    font-size: 0.9rem;
    font-family: inherit;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .tabbar button.active { color: var(--ink); border-bottom-color: var(--cardinal); font-weight: 600; }
  .tabbar button:hover { color: var(--ink); }
  .panel { flex-grow: 1; min-height: 0; display: flex; flex-direction: column; }
  .panel iframe { border: none; width: 100%; flex-grow: 1; background: var(--paper); }
  .placeholder { max-width: 760px; margin: 3rem auto; padding: 0 1.5rem; text-align: center; }
  .placeholder h2 { font-size: 1.4rem; letter-spacing: -0.015em; margin-bottom: 0.75rem; }
  .placeholder p { color: var(--muted); font-size: 0.95rem; line-height: 1.65; }
  .placeholder .note {
    display: inline-block;
    margin-top: 1.5rem;
    background: var(--warn-bg);
    color: var(--warn-fg);
    font-size: 0.82rem;
    font-weight: 600;
    padding: 0.45rem 1rem;
    border-radius: var(--radius-sm);
  }
  .placeholder ul {
    text-align: left;
    display: inline-block;
    margin-top: 1.25rem;
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.9;
  }
</style>
</head>
<body>
<header class="topbar">
  <div>
    <div class="title"><strong>Gov</strong><span style="font-weight:400">Sight</span> Financial Analyzer</div>
    <div class="org">Organization: Spanish Fork</div>
  </div>
  <div class="spacer"></div>
  <span class="who" id="who-badge"></span>
  <button class="persona" id="persona-toggle" title="Demo: switch between the city administrator and a department-restricted employee"></button>
  <a class="logout" href="/api/logout">Logout</a>
</header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<script>
  // Charts speak the design system too: serif type, ink-tinted grid
  if (window.Chart) {
    Chart.defaults.font.family = '"Source Serif 4", Georgia, serif';
    Chart.defaults.color = '#605d5d';
    Chart.defaults.borderColor = 'rgba(32, 30, 29, 0.1)';
  }
</script>
<script src="assets/bi_sandbox.js"></script>
<script src="assets/demo_views.js"></script>
<script>
const MODULES = {
  navi: {
    name: 'Navi',
    kicker: 'GovSight Navi',
    tagline: 'Navigation & Planning Hub',
    // Focused four-tab layout. Scenario Planner stays first and prominent
    // (the market differentiator vs. budget-book competitors). Market
    // Context renders as a subdued secondary link. Phase-2 tabs are
    // commented out, not deleted - restore any line to bring it back.
    // Their capabilities remain reachable: comparison and Monte Carlo live
    // inside the Scenario Planner; forecasting lives in Budget > Revenue
    // Forecast and Treasury > Cash Flow.
    tabs: [
      { name: 'Scenario Planner', src: 'scenario-planner.html' },
      { name: 'Budget', view: 'budgetHub' },
      { name: 'Personnel', view: 'pbb' },
      { name: 'Treasury', view: 'treasuryHub' },
      { name: 'Market Context', view: 'econ', secondary: true },
      // { name: 'Report Comparison', view: 'reportComparison' },
      // { name: 'Risk Analysis', view: 'risk' },
      // { name: 'Predictive Analytics', view: 'predictive' },
    ],
  },
  mantis: {
    name: 'Mantis',
    kicker: 'GovSight Mantis',
    tagline: 'AI Intelligence Hub',
    tabs: [
      { name: 'AI Chat', view: 'aiChat' },
      { name: 'Ledger Insights', view: 'mantisDemo' },
    ],
  },
  vatica: {
    name: 'Vatica',
    kicker: 'GovSight Vatica',
    tagline: 'Departmental Insights & Reporting',
    tabs: [
      { name: 'BI Sandbox', view: 'bi' },
      { name: 'Historical Analysis', view: 'historical' },
      { name: 'Department Insights', view: 'deptInsights' },
      { name: 'Transaction Analyzer', view: 'transactions' },
      { name: 'Balance Sheet', view: 'balance' },
      { name: 'Monthly Close', view: 'close' },
      { name: 'Google Sheets Export',
        desc: 'Automated report exports to Google Sheets and Drive with scheduling. Requires the platform backend with Google service-account credentials.' },
    ],
  },
};

const app = document.getElementById('app');

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── demo personas: city administrator vs department-restricted employee ──
function persona() {
  return window.DEMO_VIEWS ? DEMO_VIEWS.getPersona() : 'admin';
}
function updateTopbar() {
  const p = persona();
  const who = DEMO_VIEWS.personas[p];
  const badge = document.getElementById('who-badge');
  badge.textContent = `${who.username} (${who.title})`;
  badge.className = 'who' + (p === 'employee' ? ' employee' : '');
  document.getElementById('persona-toggle').textContent =
    p === 'admin' ? 'View as employee' : 'Back to admin';
}
window.GS_PERSONA_CHANGED = function () {
  updateTopbar();
  if (persona() === 'employee' && location.hash.indexOf('#/admin') === 0) {
    location.hash = '#/';
  }
  route();
};
document.getElementById('persona-toggle').addEventListener('click', function () {
  DEMO_VIEWS.setPersona(persona() === 'admin' ? 'employee' : 'admin');
  window.GS_PERSONA_CHANGED();
});

function renderHome() {
  let cards = '';
  for (const key of Object.keys(MODULES)) {
    const m = MODULES[key];
    cards += `
      <div class="mcard" onclick="location.hash='#/${key}/0'">
        <div class="kicker">${esc(m.kicker)}</div>
        <h2>${esc(m.name)}</h2>
        <div class="sub">${esc(m.tagline)}</div>
        <span class="enter">Enter ${esc(m.name)} &rarr;</span>
      </div>`;
  }
  if (persona() === 'admin') {
    cards += `
      <div class="mcard admin" onclick="location.hash='#/admin'">
        <div class="kicker">GOVSIGHT ADMIN</div>
        <h2>Administration</h2>
        <div class="sub">Users, roles &amp; department access</div>
        <span class="enter">Open Admin Settings</span>
      </div>`;
  }
  const note = persona() === 'employee'
    ? `<p style="background:#f2e7c2;color:#6d5504;border-radius:2px;padding:0.6rem 1rem;font-size:0.85rem;margin-bottom:1.5rem">
         You are viewing GovSight as a department-restricted employee - budgets, transactions, and insights
         are limited to the departments your administrator granted.</p>` : '';
  app.innerHTML = `
    <div class="home">
      <span class="kicker">Overview</span>
      <h1>Welcome to GovSight.</h1>
      <p>Select a module below to access different analytical tools.</p>
      ${note}
      <div class="cards">${cards}</div>
    </div>`;
}

function renderAdmin() {
  if (persona() !== 'admin') { location.hash = '#/'; return; }
  app.innerHTML = `
    <div class="module-view">
      <div class="module-head">
        <div class="row">
          <a class="back" href="#/">&#8592; Dashboard</a>
          <h1>Administration</h1>
          <span class="tag">Users, roles &amp; department access</span>
        </div>
      </div>
      <div class="panel" style="overflow-y:auto">
        <div id="view-host" style="padding:20px;max-width:1240px;margin:0 auto;width:100%"></div>
      </div>
    </div>`;
  window.DEMO_VIEWS.render('adminDemo', document.getElementById('view-host'));
}

function renderModule(key, tabIndex) {
  const m = MODULES[key];
  if (!m) { location.hash = ''; return; }
  const idx = Math.min(Math.max(tabIndex, 0), m.tabs.length - 1);
  const tab = m.tabs[idx];

  const tabButtons = m.tabs.map((t, i) => {
    const cls = (i === idx ? 'active' : '') + (t.secondary ? ' secondary' : '');
    const style = t.secondary ? 'margin-left:auto;font-size:0.78rem;opacity:0.75;' : '';
    return `<button class="${cls}" style="${style}" onclick="location.hash='#/${key}/${i}'">${esc(t.name)}</button>`;
  }).join('');

  let panel;
  if (tab.src) {
    panel = `<iframe src="${tab.src}" title="${esc(tab.name)}"></iframe>`;
  } else if (tab.view) {
    panel = `<div id="view-host" style="padding:20px;max-width:1240px;margin:0 auto;width:100%"></div>`;
  } else {
    const caps = tab.capabilities
      ? `<ul>${tab.capabilities.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : '';
    panel = `
      <div class="placeholder">
        <h2>${esc(tab.name)}</h2>
        <p>${esc(tab.desc)}</p>
        ${caps}
        <div><span class="note">Available when the GovSight platform backend is connected</span></div>
      </div>`;
  }

  app.innerHTML = `
    <div class="module-view">
      <div class="module-head">
        <div class="row">
          <a class="back" href="#/">&#8592; Dashboard</a>
          <h1>${esc(m.name)}</h1>
          <span class="tag">${esc(m.tagline)}</span>
        </div>
      </div>
      <nav class="tabbar"><div class="row">${tabButtons}</div></nav>
      <div class="panel" style="${tab.view ? 'overflow-y:auto' : ''}">${panel}</div>
    </div>`;
  if (tab.view && window.DEMO_VIEWS) {
    window.DEMO_VIEWS.render(tab.view, document.getElementById('view-host'));
  }
}

function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  if (parts[0] === 'admin') {
    renderAdmin();
  } else if (parts[0] && MODULES[parts[0]]) {
    renderModule(parts[0], parseInt(parts[1] || '0', 10) || 0);
  } else {
    renderHome();
  }
}

window.addEventListener('hashchange', route);
updateTopbar();
route();
</script>
</body>
</html>
