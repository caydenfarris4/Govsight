# GovSight full-platform stack (Streamlit + PBB API + Budget Playground API
# in one container, matching the single-host architecture the app expects).
services:
  govsight:
    build: .
    ports:
      - "5000:5000"   # Streamlit application (public entrypoint)
      - "8000:8000"   # PBB API (expose only if not fronted by a proxy)
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SEED_SAMPLE_DATA=${SEED_SAMPLE_DATA:-1}
      # Browser-facing URL of the PBB API; set to your public API hostname
      # when deploying behind Cloudflare or another proxy.
      - PBB_API_URL=${PBB_API_URL:-http://localhost:8000}
    volumes:
      - govsight-data:/app/databases

volumes:
  govsight-data:
